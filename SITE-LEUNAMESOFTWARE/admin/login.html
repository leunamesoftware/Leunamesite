<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — LeuName Softwares</title>
<meta name="description" content="Panel administrativo interno de la tienda LeuName Softwares.">
<link rel="manifest" href="../admin-manifest.webmanifest">
<meta name="theme-color" content="#0a2647">
<link rel="apple-touch-icon" href="../assets/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LeuName Admin">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body admin-body-center">

<!-- Panel interno (no es un sistema de cuentas de usuario real): solo guarda
     el ADMIN_TOKEN en localStorage de este navegador y lo envía como
     "Authorization: Bearer <token>" en cada llamada a la API del Worker.
     Es el mismo patrón usado por el panel de licencias. -->
<div class="admin-login-card">
  <div class="admin-login-brand">
    <img src="../assets/img/logo-mark.png" alt="" width="40" height="40">
    <span>LEUNAME <small>ADMIN</small></span>
  </div>
  <h1>Acceso administrativo</h1>
  <p>Introduce el token de administrador para gestionar el catálogo y los pedidos de la tienda.</p>
  <form id="adminLoginForm">
    <label class="admin-label" for="tokenInput">Token de administrador</label>
    <input class="admin-input" id="tokenInput" type="password" autocomplete="off" required placeholder="••••••••••••">
    <button class="admin-btn admin-btn-primary" type="submit" style="width:100%;margin-top:14px;">Entrar</button>
  </form>
  <p class="admin-error" id="loginError" hidden>Token inválido o el servidor no respondió. Verifica e inténtalo de nuevo.</p>
  <p class="admin-note">Herramienta interna. No es un sistema de cuentas de usuario.</p>
</div>

<script src="admin.js"></script>
<script>
  document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var token = document.getElementById('tokenInput').value.trim();
    var errEl = document.getElementById('loginError');
    errEl.hidden = true;
    try {
      var res = await fetch(AdminAPI.BASE_URL + '/admin/pedidos', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) throw new Error('token_invalido');
      AdminAPI.setToken(token);
      location.href = 'index.html';
    } catch (err) {
      errEl.hidden = false;
    }
  });
</script>
</body>
</html>
