<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sua licença — LeuName Softwares</title>
<meta name="description" content="Abra seu envelope e veja a sua chave de licença.">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a2647; --navy-2:#123a6b; --accent:#3b82f6; --accent-2:#60a5fa;
    --paper:#fff; --ink:#0f172a; --muted:#64748b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:radial-gradient(circle at 50% -10%, var(--navy-2), var(--navy) 60%);
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    color:var(--ink);
  }
  .wrap{ width:100%; max-width:380px; text-align:center; }
  .brand{ color:#cfe0ff; font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:.4px; font-size:14px; margin-bottom:26px; opacity:.85; }
  .stage{ position:relative; height:230px; margin-bottom:8px; }

  /* ---- envelope fechado ---- */
  .envelope{
    position:absolute; inset:0; margin:auto; width:220px; height:150px; top:40px; left:50%; transform:translateX(-50%);
    cursor:pointer; user-select:none;
    animation:float 2.6s ease-in-out infinite;
  }
  @keyframes float{ 0%,100%{ transform:translateX(-50%) translateY(0);} 50%{ transform:translateX(-50%) translateY(-6px);} }
  .env-body{
    position:absolute; inset:0; border-radius:12px;
    background:linear-gradient(135deg,#fff,#eef2f9);
    box-shadow:0 18px 34px rgba(2,10,30,.35);
  }
  .env-flap{
    position:absolute; top:0; left:0; right:0; height:0;
    border-left:110px solid transparent; border-right:110px solid transparent;
    border-top:78px solid #dbe4f3;
    transform-origin:top; transition:transform .5s cubic-bezier(.4,0,.2,1);
    border-radius:12px 12px 0 0;
  }
  .seal{
    position:absolute; top:58px; left:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--navy-2));
    color:#fff; font-family:'Poppins',sans-serif; font-weight:800; font-size:17px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px rgba(0,0,0,.25); transition:opacity .25s;
  }
  .tap-hint{ color:#cfe0ff; font-size:13px; margin-top:4px; opacity:.8; }

  .stage.open .env-flap{ transform:rotateX(180deg); }
  .stage.open .seal{ opacity:0; }
  .stage.open .envelope{ animation:none; }

  /* ---- cartão revelado ---- */
  .card{
    position:absolute; left:50%; bottom:0; width:280px; transform:translate(-50%,20px) scale(.94);
    background:var(--paper); border-radius:18px; padding:22px 20px 20px;
    box-shadow:0 24px 50px rgba(2,10,30,.4);
    opacity:0; transition:opacity .45s ease .15s, transform .45s cubic-bezier(.2,.8,.2,1) .15s;
    z-index:2;
  }
  .stage.open .card{ opacity:1; transform:translate(-50%,44px) scale(1); }

  .card .hello{ font-size:13px; color:var(--muted); margin:0 0 2px; }
  .card .titulo{ font-family:'Poppins',sans-serif; font-weight:800; font-size:16px; margin:0 0 14px; }
  .app-pill{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700; color:#fff; margin-bottom:12px; letter-spacing:.3px; }
  .chave-box{
    font-family:ui-monospace,'SF Mono',Consolas,monospace; font-size:17px; font-weight:700; letter-spacing:1px;
    background:#f1f5fb; border:1.5px dashed #c7d5ea; border-radius:10px; padding:12px 8px; margin-bottom:12px; word-break:break-all;
  }
  .copy-btn{
    display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer;
    background:var(--navy); color:#fff; font-weight:700; font-size:13.5px; padding:10px 16px; border-radius:10px; width:100%; justify-content:center;
    font-family:'Inter',sans-serif;
  }
  .copy-btn:active{ transform:scale(.98); }
  .copy-btn.copied{ background:#16a34a; }
  .instrucao{ font-size:12.5px; color:var(--muted); margin-top:12px; line-height:1.5; }
  .footer{ margin-top:220px; color:#9db3d6; font-size:11.5px; }
  .stage.open ~ .footer{ margin-top:20px; }

  .erro{ color:#fff; }
  .erro h1{ font-family:'Poppins',sans-serif; font-size:18px; }
  .erro p{ color:#cfe0ff; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">LEUNAME SOFTWARES</div>
  <div id="conteudo"></div>
  <div class="footer" id="rodape" hidden>Guarde essa chave com você. LeuName Softwares.</div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var chave = (params.get('chave') || '').trim().toUpperCase();
  var appId = params.get('app') || '';
  var nome = (params.get('nome') || '').trim();

  var APPS = {
    'leuname-gestao': { nome: 'Gestacell', cor: 'linear-gradient(135deg,#3b82f6,#0a2647)' },
    'construgestao':  { nome: 'ConstruGestão', cor: 'linear-gradient(135deg,#f97316,#c2410c)' }
  };
  var appInfo = APPS[appId] || { nome: 'LeuName Softwares', cor: 'linear-gradient(135deg,#3b82f6,#0a2647)' };

  var root = document.getElementById('conteudo');

  if (!chave) {
    root.innerHTML = '<div class="erro"><h1>Link inválido</h1><p>Não encontramos nenhuma chave nesse link. Peça pra LeuName Softwares te mandar de novo.</p></div>';
    return;
  }

  document.getElementById('rodape').hidden = false;

  root.innerHTML =
    '<div class="stage" id="stage">' +
      '<div class="envelope" id="envelope" role="button" aria-label="Abrir envelope">' +
        '<div class="env-body"></div>' +
        '<div class="env-flap"></div>' +
        '<div class="seal">L</div>' +
      '</div>' +
      '<div class="card">' +
        '<p class="hello">' + (nome ? ('Oi, ' + esc(nome) + '!') : 'Olá!') + '</p>' +
        '<p class="titulo">Sua licença chegou 🎉</p>' +
        '<span class="app-pill" style="background:' + appInfo.cor + '">' + esc(appInfo.nome) + '</span>' +
        '<div class="chave-box" id="chaveBox">' + esc(chave) + '</div>' +
        '<button class="copy-btn" id="copyBtn" type="button">Copiar chave</button>' +
        '<p class="instrucao">Abra o app ' + esc(appInfo.nome) + ' no seu celular ou computador e cole essa chave na tela de ativação.</p>' +
      '</div>' +
    '</div>' +
    '<p class="tap-hint" id="tapHint">Toque no envelope pra abrir</p>';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var stage = document.getElementById('stage');
  var envelope = document.getElementById('envelope');
  var tapHint = document.getElementById('tapHint');
  function abrir(){
    stage.classList.add('open');
    tapHint.style.opacity = '0';
  }
  envelope.addEventListener('click', abrir);
  envelope.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' ') abrir(); });

  document.getElementById('copyBtn').addEventListener('click', function(){
    var btn = this;
    var texto = document.getElementById('chaveBox').textContent;
    var feito = function(){
      btn.textContent = 'Copiado!'; btn.classList.add('copied');
      setTimeout(function(){ btn.textContent = 'Copiar chave'; btn.classList.remove('copied'); }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(feito).catch(function(){ selecionarFallback(texto, feito); });
    } else {
      selecionarFallback(texto, feito);
    }
  });
  function selecionarFallback(texto, cb){
    var ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    cb();
  }
})();
</script>
</body>
</html>
