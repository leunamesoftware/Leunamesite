<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Licenças — LeuName Softwares</title>
<meta name="description" content="Painel administrativo interno de licenças da LeuName Softwares.">
<link rel="manifest" href="../admin-manifest.webmanifest">
<meta name="theme-color" content="#0a2647">
<link rel="apple-touch-icon" href="../assets/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LeuName Admin">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../admin/admin.css">
</head>
<body class="admin-body admin-body-center">

<!-- Painel interno (não é um sistema de contas de usuário real): só guarda
     o ADMIN_TOKEN no localStorage deste navegador e o envia como
     "Authorization: Bearer <token>" em cada chamada à API do servidor de
     licenças. Mesmo padrão do painel admin da loja. -->
<div class="admin-login-card">
  <div class="admin-login-brand">
    <img src="../assets/img/logo-mark.png" alt="" width="40" height="40">
    <span>LEUNAME <small>LICENÇAS</small></span>
  </div>
  <h1>Acesso administrativo</h1>
  <p>Digite o token de administrador para gerar, consultar e revogar licenças do LeuName Gestão.</p>
  <form id="adminLoginForm">
    <label class="admin-label" for="tokenInput">Token de administrador</label>
    <input class="admin-input" id="tokenInput" type="password" autocomplete="off" required placeholder="••••••••••••">
    <button class="admin-btn admin-btn-primary" type="submit" style="width:100%;margin-top:14px;">Entrar</button>
  </form>
  <p class="admin-error" id="loginError" hidden>Token inválido ou o servidor não respondeu. Verifique e tente novamente.</p>
  <p class="admin-note">Ferramenta interna. Não é um sistema de contas de usuário.</p>
</div>

<script src="admin-licencas.js"></script>
<script>
  document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var token = document.getElementById('tokenInput').value.trim();
    var errEl = document.getElementById('loginError');
    errEl.hidden = true;
    try {
      var res = await fetch(AdminLicencasAPI.BASE_URL + '/admin/licencas', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) throw new Error('token_invalido');
      AdminLicencasAPI.setToken(token);
      location.href = '../admin/index.html';
    } catch (err) {
      errEl.hidden = false;
    }
  });
</script>
</body>
</html>
