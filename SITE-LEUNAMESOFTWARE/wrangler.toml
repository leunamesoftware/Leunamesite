name = "leuname-site"
compatibility_date = "2026-09-19"

# Publica o site estatico (SITE-LEUNAMESOFTWARE/) como um Worker de
# "static assets" na Cloudflare — nao precisa de codigo de servidor,
# nem de permissao extra no CF_API_TOKEN (usa a MESMA permissao
# "Workers Scripts Edit" ja concedida para os outros dois Workers
# deste projeto). Cada arquivo .html e servido no caminho exato do
# link (ex: /checkout.html), sem reescrita de URL.
[assets]
directory = "./"

# Dominio customizado: por enquanto NAO configurado (o site fica
# disponivel apenas em leuname-site.<subdominio-da-conta>.workers.dev).
# Para ligar www.leunamesoftware.com, repita no Cloudflare Dashboard o
# mesmo passo manual ja feito para api.leunamesoftware.com:
#   Workers & Pages -> leuname-site -> Settings -> Domains & Routes ->
#   Add Custom Domain -> www.leunamesoftware.com
# Depois, descomente o bloco abaixo e rode o workflow de deploy de novo.
# [[routes]]
# pattern = "www.leunamesoftware.com"
# custom_domain = true
