name = "leuname-site"
compatibility_date = "2026-09-19"

# Publica o site estatico (SITE-LEUNAMESOFTWARE/) como um Worker de
# "static assets" na Cloudflare — nao precisa de codigo de servidor,
# nem de permissao extra no CF_API_TOKEN (usa a MESMA permissao
# "Workers Scripts Edit" ja concedida para os outros dois Workers
# deste projeto). Cada arquivo .html e servido no caminho exato do
# link (ex: /checkout.html), sem reescrita de URL.
# worker.js atende só /api/* (pagamento Stripe); o resto é o site estático.
main = "worker.js"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

# Dominio customizado: leunamesoftware.com (a zona ja esta ativa na conta
# Cloudflare -- confirmado porque api.leunamesoftware.com ja funciona no
# servidor de licencas). O "wrangler deploy" liga isto automaticamente.
[[routes]]
pattern = "leunamesoftware.com"
custom_domain = true

[[routes]]
pattern = "www.leunamesoftware.com"
custom_domain = true

# Domínio próprio da loja (comprado na Cloudflare em 13/10/2026). leuname.com é o domínio-mãe:
# cada nicho vira um subdomínio (pets., casa., ...). O worker.js redireciona os outros endereços para pets.
[[routes]]
pattern = "pets.leuname.com"
custom_domain = true

[[routes]]
pattern = "leuname.com"
custom_domain = true

[[routes]]
pattern = "www.leuname.com"
custom_domain = true
