name = "leuname-site-br"
compatibility_date = "2026-09-19"

# Publica o site estatico (SITE-LEUNAMESOFTWARE-BR/) como um Worker de
# "static assets" na Cloudflare — nao precisa de codigo de servidor,
# nem de permissao extra no CF_API_TOKEN (usa a MESMA permissao
# "Workers Scripts Edit" ja concedida para os outros Workers
# deste projeto). Cada arquivo .html e servido no caminho exato do
# link (ex: /checkout.html), sem reescrita de URL.
[assets]
directory = "./"

# SEM domínio próprio: www.leunamesoftware.com.br e leunamesoftware.com.br são do worker "leuapps", que mostra
# este site na página inicial pela ligação interna SITE_ANTIGO (e serve /img, /apps, /instalar, /loja...).
# Se estas rotas voltarem aqui, cada publicação do site toma o domínio e quebra imagens, instalar e pagamento.
