<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licenças — Admin LeuName Softwares</title>
<meta name="description" content="Geração, consulta e revogação de licenças do LeuName Gestão.">
<link rel="manifest" href="../admin-manifest.webmanifest">
<meta name="theme-color" content="#0a2647">
<link rel="apple-touch-icon" href="../assets/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LeuName Admin">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../admin/admin.css">
<style>
  /* Lista de licenças em cards -- pra nunca precisar rolar de lado no
     celular pra ver nome/chave, diferente de uma tabela larga. */
  .lic-list{ display:flex; flex-direction:column; gap:10px; }
  .lic-card{ border:1px solid var(--gray-200); border-radius:var(--radius-m,10px); padding:14px; background:var(--white); }
  .lic-card__top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .lic-card__chave{ font-family:ui-monospace,'SF Mono',Consolas,monospace; font-weight:700; font-size:14.5px; letter-spacing:.2px; word-break:break-all; color:var(--ink-900); }
  .lic-card__nome{ font-size:16.5px; font-weight:800; color:var(--ink-900); margin:0 0 3px; }
  .lic-card__app{ display:inline-block; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; color:#fff; margin-bottom:6px; }
  .lic-card__meta{ font-size:12.5px; color:var(--ink-400); line-height:1.5; margin-bottom:12px; }
  .lic-card__motivo{ font-size:11.5px; opacity:.75; margin-top:3px; }
  .lic-card .admin-row-actions{ flex-wrap:wrap; }
</style>
</head>
<body class="admin-body">
<div class="admin-shell">
  <div class="admin-topbar">
    <div class="admin-topbar-brand">
      <img src="../assets/img/logo-mark.png" alt="" width="32" height="32">
      <span>LEUNAME<small>LICENÇAS</small></span>
    </div>
    <div class="admin-topbar-actions">
      <a href="../index.html">Ver site</a>
      <button type="button" id="logoutBtn">Sair</button>
    </div>
  </div>
  <nav class="admin-nav">
    <a href="../admin/index.html">Painel</a>
    <a href="../admin/productos.html">Produtos</a>
    <a href="../admin/pedidos.html">Pedidos</a>
    <a href="painel.html" class="is-active">Licenças</a>
  </nav>

  <main class="admin-main">
    <div class="admin-head">
      <h1>Licenças</h1>
      <button class="admin-btn admin-btn-primary" id="newLicBtn" type="button">+ Gerar licença</button>
    </div>

    <p class="admin-banner" id="apiBanner" hidden></p>

    <div class="admin-card" id="formCard" hidden>
      <h2>Gerar nova licença</h2>
      <form id="licForm">
        <div class="admin-form-grid cols-2">
          <div class="admin-field">
            <label class="admin-label" for="lApp">Aplicativo</label>
            <select class="admin-select" id="lApp">
              <option value="leuname-gestao">Gestacell</option>
              <option value="construgestao">ConstruGestão</option>
            </select>
          </div>
          <div class="admin-field"><label class="admin-label" for="lOrigem">Origem</label><input class="admin-input" id="lOrigem" value="manual" placeholder="manual, loja-stripe..."></div>
          <div class="admin-field"><label class="admin-label" for="lNome">Nome do cliente (obrigatório só pra chave nova)</label><input class="admin-input" id="lNome" placeholder="Ex: Jefferson"></div>
          <div class="admin-field"><label class="admin-label" for="lContato">WhatsApp ou e-mail (obrigatório só pra chave nova)</label><input class="admin-input" id="lContato" placeholder="Ex: 24999998888 ou nome@email.com"></div>
          <div class="admin-field"><label class="admin-label" for="lChave">Chave já existente -- reativa na hora (opcional)</label><input class="admin-input" id="lChave" placeholder="Deixe vazio para gerar uma nova"></div>
        </div>
        <div class="admin-form-actions">
          <button class="admin-btn admin-btn-primary" type="submit">Gerar</button>
          <button class="admin-btn admin-btn-outline" type="button" id="cancelFormBtn">Cancelar</button>
        </div>
      </form>
      <div class="admin-banner" id="newKeyBanner" hidden style="margin-top:14px;"></div>
    </div>

    <div class="admin-card">
      <h2>Todas as licenças (<span id="licCount">0</span>)</h2>
      <div class="lic-list" id="licBody"><p class="admin-empty">Carregando…</p></div>
    </div>
  </main>
</div>

<script src="admin-licencas.js"></script>
<script src="painel.js"></script>
</body>
</html>
