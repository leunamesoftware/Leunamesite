# Controle de versao do ConstruGestao para a Google Play.
#
# versionCode: numero inteiro que TEM que aumentar em toda atualizacao
#              enviada a Play Store (nunca pode repetir ou diminuir).
# versionName: o numero de versao que o usuario ve (ex.: 1.0.0, 1.0.1...).
#
# Para publicar uma atualizacao no futuro: aumente o versionCode em 1
# (ex.: de 1 para 2) e ajuste o versionName como preferir, depois rode
# o workflow "Build Android AAB ConstruGestão (Google Play)" de novo.
versionCode=1
versionName=1.0.0
