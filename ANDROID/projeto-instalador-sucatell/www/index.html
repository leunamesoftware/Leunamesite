<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sucatell</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d3b1f">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<style>
:root{
  --verde-escuro:#0d3b1f; --verde:#178a43; --verde-forte:#16a34a; --verde-claro:#e7f5ea;
  --bg:#f4f7f4; --card:#ffffff; --borda:#e3e9e3; --texto:#152018; --fraco:#68796d;
  --erro:#dc2626; --alerta:#b45309; --alerta-bg:#fef3c7;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-tema="escuro"]{
  --bg:#0e1712; --card:#152019; --borda:#25352b; --texto:#eef6ef; --fraco:#93a89b; --verde-claro:#153524; --alerta-bg:#3a2f10;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]):not([data-tema="escuro"]){
    --bg:#0e1712; --card:#152019; --borda:#25352b; --texto:#eef6ef; --fraco:#93a89b; --verde-claro:#153524; --alerta-bg:#3a2f10;
  }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--texto); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;}
#intro-splash{position:fixed; inset:0; background:var(--verde-escuro); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity .35s ease;}
#intro-splash img{width:112px; height:112px; border-radius:26px; box-shadow:0 10px 30px rgba(0,0,0,.25);}
#intro-splash .intro-nome{color:#fff; font-size:22px; font-weight:800; margin-top:18px;}
#intro-splash .intro-nome .verde{color:#4ade80;}
#intro-splash .intro-sub{color:#bfe3cc; font-size:13px; font-weight:600; margin-top:4px;}
#intro-splash .intro-barra-wrap{position:absolute; bottom:70px; width:130px; height:4px; background:rgba(255,255,255,.18); border-radius:4px; overflow:hidden;}
#intro-splash .intro-barra{position:absolute; left:0; top:0; width:40%; height:100%; background:#4ade80; border-radius:4px; animation:intro-barra-desliza 1.1s ease-in-out infinite;}
@keyframes intro-barra-desliza{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(350%); } }
#intro-splash.saindo{opacity:0; pointer-events:none;}
#intro-splash .intro-versao{position:absolute; bottom:calc(28px + env(safe-area-inset-bottom,0px)); color:rgba(255,255,255,.45); font-size:11px;}
input,select,textarea,button{font-family:inherit; font-size:15px;}
input,select,textarea{width:100%; padding:12px 13px; border-radius:10px; background:var(--card); border:1.5px solid var(--borda); color:var(--texto);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde); outline-offset:-1px;}
input::placeholder,textarea::placeholder{color:var(--fraco); opacity:.85;}
.campo-senha{position:relative;}
.campo-senha input{padding-right:42px;}
.campo-senha .olho{position:absolute; right:2px; top:2px; bottom:2px; background:none; border:none; padding:0 10px; margin:0; cursor:pointer; font-size:18px; line-height:1; color:var(--fraco); display:flex; align-items:center;}
label{display:block; font-size:13px; font-weight:600; color:var(--fraco); margin-bottom:6px; margin-top:14px;}
a{color:var(--verde);}
.btn{display:flex; align-items:center; justify-content:center; gap:7px; width:100%; padding:14px; border-radius:12px; border:none; background:var(--verde-forte); color:#fff; font-weight:700; cursor:pointer; margin-top:16px;}
.btn.secundario{background:var(--card); color:var(--texto); border:1.5px solid var(--borda);}
.btn.perigo{background:#fff; color:var(--erro); border:1.5px solid var(--erro);}
.btn.pequeno{width:auto; padding:9px 14px; margin-top:0; font-size:13px;}
.btn:disabled{opacity:.5;}
.linha2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.app-root{display:none; flex-direction:column; height:100vh;}
.app-root.pronto{display:flex;}
.topo{background:var(--verde-escuro); color:#fff; padding:calc(12px + var(--safe-t)) 16px 12px; flex-shrink:0; position:relative;}
.topo-linha{display:flex; align-items:center; gap:10px;}
.topo h2{font-size:17px; margin:0; flex:1; font-weight:700;}
.topo button.icone{background:rgba(255,255,255,.12); border:none; color:#fff; font-size:18px; width:38px; height:38px; border-radius:10px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.marca-topo-linha{flex:1; display:flex; align-items:center; gap:9px; min-width:0;}
.marca-topo-linha img{width:32px; height:32px; border-radius:8px; flex-shrink:0;}
.marca-topo{font-size:18px; font-weight:800; white-space:nowrap; line-height:1.15;}
.marca-topo b{color:var(--verde-forte);}
.marca-topo-tagline{font-size:9.5px; font-weight:600; color:#bfe3cc; white-space:nowrap;}
.pill-local{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:20px; padding:7px 12px; font-size:13px; color:#fff; cursor:pointer; max-width:180px;}
.pill-local span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.busca-barra{margin-top:10px; position:relative;}
.busca-barra input{padding-left:38px; border:none;}
.busca-barra .lupa{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55;}
.conteudo{flex:1; overflow-y:auto; padding:16px; padding-bottom:calc(90px + var(--safe-b));}
.tabbar{display:flex; align-items:flex-end; border-top:1px solid var(--borda); background:var(--card); flex-shrink:0; padding:6px 4px calc(6px + var(--safe-b)); position:fixed; bottom:0; left:0; right:0;}
.tabbar button{flex:1; background:none; border:none; color:var(--fraco); padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; cursor:pointer;}
.tabbar button.ativo{color:var(--verde-forte); font-weight:700;}
.tabbar .icone-tab{font-size:19px;}
.badge-tab{position:absolute; top:-6px; right:-9px; background:var(--erro); color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
.tabbar .tab-anunciar{flex:0 0 56px;}
.tabbar .tab-anunciar .icone-tab{width:52px; height:52px; margin-top:-26px; background:var(--verde-forte); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 4px 14px rgba(0,0,0,.25);}
.card{background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:15px; margin-bottom:12px;}
.chip{display:inline-flex; align-items:center; background:var(--verde-claro); color:var(--verde); border-radius:20px; padding:5px 12px; font-size:12px; font-weight:600; margin:2px 4px 2px 0;}
.chip.cinza{background:var(--bg); color:var(--fraco); border:1px solid var(--borda);}
.filtro-chips{display:flex; flex-wrap:wrap; gap:8px; padding-bottom:4px; margin-bottom:12px;}
.filtro-chips button{flex-shrink:0; background:var(--card); border:1.5px solid var(--borda); color:var(--texto); border-radius:20px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;}
.filtro-chips button.ativo{background:var(--verde-escuro); color:#fff; border-color:var(--verde-escuro);}
.preco{font-weight:800; color:var(--verde-forte); font-size:16px;}
.muted{color:var(--fraco); font-size:13px;}
.toast{position:fixed; left:16px; right:16px; bottom:calc(96px + var(--safe-b)); background:#1a1a1a; color:#fff; padding:13px 16px; border-radius:10px; text-align:center; z-index:1200; box-shadow:0 6px 20px rgba(0,0,0,.3); font-size:14px;}
.toast.erro{background:var(--erro);}
.toast.sucesso{background:var(--verde-forte);}
.foto-preview{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.foto-preview .miniatura{position:relative; width:76px; height:76px;}
.foto-preview img{width:76px; height:76px; object-fit:cover; border-radius:10px; border:1px solid var(--borda);}
.foto-preview .remover{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#000; color:#fff; border:none; font-size:12px; cursor:pointer;}
.foto-add{width:76px; height:76px; border-radius:10px; border:1.5px dashed var(--borda); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:var(--fraco); cursor:pointer; text-align:center; gap:2px;}
.msg{max-width:78%; padding:10px 13px; border-radius:15px; margin-bottom:8px; font-size:14px; line-height:1.4; white-space:pre-line; word-break:break-word;}
.msg.minha{background:var(--verde-forte); color:#fff; margin-left:auto; border-bottom-right-radius:4px;}
.msg.outra{background:var(--card); border:1px solid var(--borda); border-bottom-left-radius:4px;}
.msg.bloqueada{opacity:.7; font-style:italic;}
.recibo-leitura{display:inline-block; margin-left:6px; font-size:11px; opacity:.85;}
.respostas-rapidas{display:flex; gap:8px; overflow-x:auto; margin-bottom:10px;}
.respostas-rapidas button{flex-shrink:0; background:var(--verde-claro); color:var(--verde); border:none; border-radius:16px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer;}
.empty{text-align:center; padding:50px 20px; color:var(--fraco);}
.empty .emoji-vazio{font-size:38px; display:block; margin-bottom:10px;}
.produto-card{display:flex; gap:12px; padding:12px; cursor:pointer;}
.produto-foto{width:78px; height:78px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--verde-claro);}
.produto-foto-vazia{display:flex; align-items:center; justify-content:center; font-size:26px;}
.produto-info{flex:1; min-width:0;}
.produto-titulo{font-weight:700; margin:2px 0 3px; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.produto-local{display:flex; align-items:center; gap:4px; color:var(--fraco); font-size:12px;}
/* ===== Modo site (loja aberta no navegador) =====
   Menu no topo em vez da barra de baixo, produtos em grade (2 colunas no
   celular, mais no computador) e rodapé de site. O app baixado continua
   com a barra de baixo. */
.site-nav{display:none;}
.modo-site .tabbar{display:none;}
.modo-site .conteudo{padding-bottom:0;}
.modo-site .toast{bottom:calc(20px + var(--safe-b));}
.modo-site .site-nav{display:flex; gap:6px; overflow-x:auto; margin:10px -4px 0; padding:0 4px 2px; scrollbar-width:none;}
.modo-site .site-nav button{flex-shrink:0; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:8px 11px; font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px;}
.modo-site .site-nav button.ativo{background:#fff; color:var(--verde-escuro);}
.modo-site .site-nav button.destaque{background:#4ade80; color:#0d3b1f; border-color:#4ade80;}
/* Celular: o menu vira uma fileira fixa de botões do mesmo tamanho,
   ícone em cima e nome embaixo -- tudo visível, sem arrastar. */
@media (max-width:700px){
  .modo-site .site-nav{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; overflow:visible; margin:10px 0 0; padding:0;}
  .modo-site .site-nav .nav-espaco{display:none;}
  .modo-site .site-nav button{flex-direction:column; justify-content:center; gap:2px; padding:7px 2px; font-size:11.5px; min-width:0;}
  .modo-site .site-nav button .nav-ic{font-size:17px; line-height:1.1;}
}
/* Conteúdo em coluna: o rodapé sempre encosta no fim da tela (sem faixa
   vazia embaixo). Telas de grade (início, categorias, listas, loja do
   vendedor) usam até 1180px; o resto (anúncio, formulários, chat, perfil)
   fica numa coluna de 720px pra não esticar. */
.modo-site .conteudo{display:flex; flex-direction:column;}
.modo-site .conteudo > :not(.site-rodape){width:100%; max-width:720px; margin-left:auto!important; margin-right:auto!important; flex-shrink:0;}
.modo-site .conteudo.largo > :not(.site-rodape){max-width:1180px;}
.modo-site .site-rodape{margin-top:auto!important; flex-shrink:0;}
.modo-site .grid-cat-grande{grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));}
.modo-site .cat-card-grande .topo-icone-grande{height:auto; aspect-ratio:16/10;}
.modo-site .topo > *{max-width:1180px; margin-left:auto; margin-right:auto;}
.modo-site .lista-produtos{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px;}
.modo-site .lista-produtos .card{margin-bottom:0;}
.modo-site .lista-produtos > .empty, .modo-site .lista-produtos > .muted{grid-column:1 / -1;}
.modo-site .lista-produtos .produto-card{flex-direction:column; gap:8px; padding:0; overflow:hidden; position:relative;}
.modo-site .lista-produtos .produto-foto{width:100%; height:auto; aspect-ratio:1; border-radius:0;}
.modo-site .lista-produtos .produto-info{padding:0 10px 12px;}
.modo-site .lista-produtos .produto-titulo{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.modo-site .lista-produtos .produto-card > button{position:absolute; top:6px; right:6px; background:rgba(255,255,255,.9)!important; border-radius:50%; width:32px; height:32px;}
.site-rodape{display:none;}
.modo-site .site-rodape{display:block; background:var(--verde-escuro); color:#dcefe3; margin:28px -16px 0; padding:26px 16px calc(26px + var(--safe-b)); padding-top:26px;}
.site-rodape .rodape-grade{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:18px;}
.site-rodape h4{color:#fff; margin:0 0 8px; font-size:14px;}
.site-rodape a{display:block; color:#dcefe3; text-decoration:none; font-size:13.5px; padding:4px 0; cursor:pointer;}
.site-rodape a:hover{color:#4ade80;}
.site-rodape .rodape-fim{max-width:1180px; margin:18px auto 0; padding-top:14px; border-top:1px solid rgba(255,255,255,.15); font-size:12px; color:#a9cdb7;}
@media (min-width:900px){
  .modo-site .conteudo{padding:22px 24px 0;}
  .modo-site .lista-produtos{grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:16px;}
  .modo-site .site-rodape{margin:36px -24px 0;}
}
.grid-cat{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.grid-cat.pequeno{grid-template-columns:repeat(4,1fr);}
.cat-item{display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:14px 4px; cursor:pointer; font-size:11.5px; font-weight:600; text-align:center; color:var(--texto);}
.cat-item .cat-icone{font-size:26px;}
/* Categorias da tela inicial: grade fixa e alinhada (não arrasta pro lado). */
.cat-scroll{display:grid; grid-template-columns:repeat(5, 1fr); gap:12px 6px; margin-bottom:10px;}
.cat-scroll .cat-chip{width:auto; min-width:0;}
@media (min-width:700px){ .cat-scroll{grid-template-columns:repeat(auto-fill, minmax(86px, 1fr));} }
.preco-linha{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.btn-negociar{background:var(--verde-forte); color:#fff; border:none; border-radius:10px; padding:7px 11px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap;}
.btn-negociar:active{transform:scale(.97);}
.loja-capa{background:var(--card); border:1px solid var(--borda); border-radius:18px; overflow:hidden; margin-bottom:12px; padding:0 15px 15px;}
.loja-faixa{margin:0 -15px; height:92px; background:linear-gradient(120deg, #0d3b1f 0%, #15803d 60%, #4ade80 130%); display:flex; align-items:flex-start; justify-content:flex-end; padding:12px 15px 0;}
.loja-faixa span{color:#dcfce7; font-size:11.5px; font-weight:700; letter-spacing:.4px;}
.loja-faixa b{color:#4ade80;}
.loja-cabeca{display:flex; align-items:flex-start; gap:12px; margin-top:-34px;}
.loja-cabeca > div:last-child{padding-top:40px;}
.loja-nome{font-size:19px; font-weight:800; line-height:1.2;}
.produto-card.escolhido{outline:3px solid var(--verde-forte); outline-offset:-1px; background:var(--verde-claro);}
.selo-escolhido{position:absolute; top:8px; left:8px; z-index:2; background:var(--verde-forte); color:#fff; font-size:11px; font-weight:800; padding:4px 8px; border-radius:8px;}
.barra-negociar{position:fixed; left:0; right:0; bottom:calc(64px + var(--safe-b)); z-index:45; background:var(--card); border-top:1px solid var(--borda); box-shadow:0 -6px 18px rgba(0,0,0,.08); padding:10px 16px;}
.modo-site .barra-negociar{bottom:0; padding-bottom:calc(10px + var(--safe-b));}
.bn-dentro{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:10px;}
.bn-dentro img, .bn-ic{width:48px; height:48px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--verde-claro); display:flex; align-items:center; justify-content:center; font-size:22px;}
.bn-txt{flex:1; min-width:0;}
.bn-rot{font-size:11.5px; color:var(--fraco); font-weight:600;}
.bn-tit{font-weight:800; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bn-preco{font-weight:800; color:var(--verde-forte); font-size:13.5px;}
.bn-preco a{font-weight:700; font-size:12px;}
.conteudo.com-barra-negociar{padding-bottom:calc(170px + var(--safe-b));}
.modo-site .conteudo.com-barra-negociar{padding-bottom:0;}
.modo-site .conteudo.com-barra-negociar .site-rodape{padding-bottom:calc(96px + var(--safe-b));}
.selo-vendido{position:absolute; top:8px; left:8px; z-index:1; background:#0d3b1f; color:#fff; font-size:11px; font-weight:800; letter-spacing:.5px; padding:4px 8px; border-radius:8px;}
.produto-card{position:relative;}
.produto-card.vendido .produto-foto{filter:grayscale(.55); opacity:.8;}
.menu-categorias{position:absolute; left:0; right:0; top:100%; z-index:60; background:var(--card); color:var(--texto); border-bottom:1px solid var(--borda); box-shadow:0 14px 30px rgba(0,0,0,.18); padding:14px 16px 16px;}
.menu-categorias .mc-grade{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(2, 1fr); gap:6px;}
.menu-categorias button{display:flex; align-items:center; gap:10px; background:none; border:none; border-radius:10px; padding:10px; font-size:14px; font-weight:600; color:var(--texto); cursor:pointer; text-align:left;}
.menu-categorias button:hover{background:var(--verde-claro);}
.menu-categorias .mc-ic{width:34px; height:34px; border-radius:10px; background:var(--verde-claro); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.menu-categorias .mc-todas{max-width:1180px; margin:10px auto 0; display:block; text-align:center; font-weight:800; color:var(--verde);}
@media (min-width:700px){ .menu-categorias .mc-grade{grid-template-columns:repeat(4, 1fr);} }
.cat-chip{flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; width:62px; cursor:pointer;}
.cat-chip .cat-icone-box{width:56px; height:56px; border-radius:16px; background:var(--verde-claro); display:flex; align-items:center; justify-content:center; font-size:25px;}
.cat-chip span{font-size:11px; font-weight:600; text-align:center; color:var(--texto); line-height:1.2;}
.grid-cat-grande{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.cat-card-grande{background:var(--card); border:1px solid var(--borda); border-radius:16px; overflow:hidden; cursor:pointer;}
.cat-card-grande .topo-icone-grande{height:86px; background:var(--verde-claro) center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:42px;}
.cat-card-grande .rodape-cat{display:flex; align-items:center; justify-content:space-between; padding:11px 13px; font-weight:700; font-size:13.5px; gap:6px;}
.cat-card-grande .rodape-cat .seta{color:var(--fraco); font-weight:400; flex-shrink:0;}
.mapa-fake{background:var(--verde-claro); border-radius:12px; height:90px; display:flex; align-items:center; justify-content:center; gap:8px; color:var(--verde); font-weight:600; font-size:13px;}
.galeria-anuncio{position:relative; margin-bottom:8px;}
.galeria-scroll{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; border-radius:14px;}
.galeria-scroll img{width:100%; flex:0 0 100%; height:250px; object-fit:cover; scroll-snap-align:start;}
.modo-site .galeria-scroll img{height:auto; aspect-ratio:4/3; max-height:520px; background:var(--verde-claro);}
.galeria-contador{position:absolute; right:10px; top:10px; background:rgba(0,0,0,.6); color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px;}
.galeria-miniaturas{display:flex; gap:6px; overflow-x:auto; margin-bottom:10px;}

<div id="intro-splash">
  <img src="icon-512.png" alt="">
  <div class="intro-nome">Sucat<span class="verde">ell</span></div>
  <div class="intro-sub">Compra • Venda • Reaproveita</div>
  <div class="intro-barra-wrap"><div class="intro-barra"></div></div>
  <div class="intro-versao">versão 1.2</div>

<script>
// Roda separado do código principal, de propósito: mesmo que o resto
// quebre (erro de JS, internet caindo no meio), a tela de abertura nunca
// prende o app pra sempre -- e se foi erro, mostra o erro real na tela
// (pra dar pra mandar print e saber exatamente o que aconteceu).
(function(){
  var erros = [];
  window.addEventListener('error', function(e){ erros.push((e.message || 'erro') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function(e){ erros.push('promessa: ' + ((e.reason && e.reason.message) || e.reason)); });
  function telaProblema(titulo, detalhe){
    var s = document.getElementById('intro-splash');
    if (!s) return;
    s.innerHTML = '<div style="color:#fff;text-align:center;padding:24px;max-width:360px;">'
      + '<div style="font-size:42px;">⚠️</div><div style="font-size:18px;font-weight:800;margin:8px 0;">' + titulo + '</div>'
      + (detalhe ? '<p style="font-size:13px;opacity:.85;margin:0 0 8px;">Tire um print desta tela e mande pro suporte.</p><pre style="white-space:pre-wrap;word-break:break-word;font-size:11px;background:rgba(0,0,0,.3);padding:10px;border-radius:8px;text-align:left;max-height:40vh;overflow:auto;">' + String(detalhe).replace(/</g, '&lt;') + '</pre>' : '<p style="font-size:14px;opacity:.85;">Confira sua internet e tente de novo.</p>')
      + '<button onclick="location.reload()" style="margin-top:12px;padding:13px 22px;border:none;border-radius:12px;background:#4ade80;color:#0d3b1f;font-weight:800;font-size:15px;">Tentar de novo</button>'
      + '<div style="font-size:11px;opacity:.55;margin-top:14px;">versão 1.2</div></div>';
  }
  setTimeout(function(){ if (document.getElementById('intro-splash') && erros.length) telaProblema('O app não conseguiu abrir', erros.join('\n')); }, 7000);
  setTimeout(function(){ if (document.getElementById('intro-splash') && !document.querySelector('#intro-splash button')) telaProblema('Está demorando pra abrir', erros.join('\n')); }, 20000);
})();
</script>

<script>
const API = 'https://sucatel-api.emanuelantunes2024.workers.dev';
const LS_TOKEN = 'sucatel_token';
const LS_TEMA = 'sucatel_tema';
const LS_FAVORITOS = 'sucatel_favoritos';
let STATE = { usuario:null, bairroId:null, aba:'inicio', marcas:[], tiposPeca:[], pilha:[] };

// ---------------- helpers ----------------
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function campoSenha(id, placeholder){
  return `<div class="campo-senha"><input id="${id}" type="password" placeholder="${esc(placeholder||'')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="button" class="olho" onclick="alternarSenha('${id}')" aria-label="Mostrar ou esconder a senha">👁️</button></div>`;
}
window.alternarSenha = function(id){
  const el = document.getElementById(id);
  if (!el) return;
  const btn = el.nextElementSibling;
  const mostrando = el.type === 'text';
  el.type = mostrando ? 'password' : 'text';
  if (btn) btn.textContent = mostrando ? '👁️' : '🙈';
};
function opcoesComNovo(itens, texto){
  return '<option value="">Selecione</option>' + (itens||[]).map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('') + `<option value="__novo__">${texto}</option>`;
}
// Genérico: usado tanto pro select de bairro quanto de cidade. Deixa a
// pessoa cadastrar o próprio bairro/cidade quando não está na nossa lista
// inicial (que cobre só alguns exemplos, o Brasil real é gigante).
function tratarSelectComNovo(selectEl, opcoes){
  const { obterPaiId, aoMudar, endpoint, campoPai, campoResposta, placeholder, mensagemSucesso } = opcoes;
  let caixaNovo = selectEl.nextElementSibling && selectEl.nextElementSibling.classList && selectEl.nextElementSibling.classList.contains('caixa-novo-item')
    ? selectEl.nextElementSibling : null;
  if (!caixaNovo) {
    caixaNovo = document.createElement('div');
    caixaNovo.className = 'caixa-novo-item';
    caixaNovo.hidden = true;
    caixaNovo.style.marginTop = '8px';
    caixaNovo.innerHTML = `<input class="ni-input" placeholder="${esc(placeholder)}"><button class="btn pequeno ni-salvar" style="margin-top:8px; width:100%;">Salvar</button>`;
    selectEl.insertAdjacentElement('afterend', caixaNovo);
    caixaNovo.querySelector('.ni-salvar').onclick = async () => {
      const nome = caixaNovo.querySelector('.ni-input').value.trim();
      if (!nome) return toast('Digite o nome.', 'erro');
      const paiId = obterPaiId();
      const { data } = await api(endpoint, { method:'POST', body:{ [campoPai]: paiId, nome } });
      if (!data.ok) return toast('Erro ao adicionar.', 'erro');
      const item = data[campoResposta];
      const opt = document.createElement('option');
      opt.value = item.id; opt.textContent = item.nome;
      selectEl.insertBefore(opt, selectEl.lastElementChild);
      selectEl.value = item.id;
      caixaNovo.hidden = true;
      toast(mensagemSucesso, 'sucesso');
      aoMudar();
    };
  }
  selectEl.onchange = () => {
    caixaNovo.hidden = selectEl.value !== '__novo__';
    aoMudar();
  };
}
function safeJsonParse(s, fallback){ try { return JSON.parse(s); } catch(e) { return fallback; } }
function centavosParaReais(c){ return 'R$ ' + (c/100).toFixed(2).replace('.', ','); }
function iniciais(nome){ return (nome||'?').trim().split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
function avatarHtml(nome, fotoUrl, estilo){
  const st = estilo || '';
  return fotoUrl
    ? `<img class="avatar" style="${st} object-fit:cover;" src="${esc(fotoUrl)}">`
    : `<div class="avatar" style="${st}">${iniciais(nome)}</div>`;
}
function dataPorExtenso(iso){
  if(!iso) return '';
  const d = new Date(iso.includes('T') ? iso : iso.replace(' ','T')+'Z');
  return d.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
}
function distanciaLabel(km){
  if(km === null || km === undefined) return '';
  if(km < 1) return 'menos de 1 km';
  return Math.round(km*10)/10 + ' km';
}
const CONDICOES = { novo:'Novo', usado:'Usado', com_defeito:'Com defeito', sucata:'Sucata' };
const ICONE_TIPO = { celular:'📱', tela:'🔲', placa:'🖲️', bateria:'🔋', carcaca:'🛠️', camera:'📷', 'alto-falante':'🔊', 'conector-carga':'🔌', 'vidro-traseiro':'🪟', flex:'➰', outro:'📦', acessorio:'🔌', capinha:'🛡️', 'fone-ouvido':'🎧', smartwatch:'⌚', tablet:'📓', lote:'📦' };
const CATEGORIAS_GRID = [
  { grupo:'celular', nome:'Celulares', icone:'📱', foto:'img/categorias/celular.jpg' },
  { grupo:'peca', nome:'Peças', icone:'🔧', foto:'img/categorias/peca.jpg' },
  { grupo:'tela', nome:'Telas', icone:'🔲', foto:'img/categorias/tela.jpg' },
  { grupo:'bateria', nome:'Baterias', icone:'🔋', foto:'img/categorias/bateria.jpg' },
  { grupo:'camera', nome:'Câmeras', icone:'📷', foto:'img/categorias/camera.jpg' },
  { grupo:'placa', nome:'Placas', icone:'🖲️', foto:'img/categorias/placa.jpg' },
  { grupo:'lote', nome:'Lotes', icone:'📦' },
  { grupo:'acessorio', nome:'Acessórios', icone:'🔌', foto:'img/categorias/acessorio.jpg' },
  { grupo:'capinha', nome:'Capinhas', icone:'🛡️', foto:'img/categorias/capinha.jpg' },
  { grupo:'fone-ouvido', nome:'Fones de ouvido', icone:'🎧', foto:'img/categorias/fone-ouvido.jpg' },
  { grupo:'smartwatch', nome:'Smartwatches', icone:'⌚', foto:'img/categorias/smartwatch.jpg' },
  { grupo:'tablet', nome:'Tablets', icone:'📓', foto:'img/categorias/tablet.jpg' },
  { grupo:'outro', nome:'Outros', icone:'📦', foto:'img/categorias/outro.jpg' },
];
// Categorias da tela inicial: as fixas (com foto) + as que o admin criar
// no painel. Uma categoria fixa some se o admin ocultar tudo que há nela.
function categoriasGrid(){
  const tipos = (typeof STATE !== 'undefined' && STATE.tiposPeca) || [];
  if (!tipos.length) return CATEGORIAS_GRID;
  const grupos = new Set(tipos.map(t => t.grupo || t.id));
  const fixas = CATEGORIAS_GRID.filter(c => grupos.has(c.grupo));
  const novas = tipos.filter(t => (t.grupo || t.id) === t.id && !CATEGORIAS_GRID.some(c => c.grupo === t.id))
    .map(t => ({ grupo: t.id, nome: t.nome, icone: t.icone || '📦' }));
  const outro = fixas.filter(c => c.grupo === 'outro');
  return fixas.filter(c => c.grupo !== 'outro').concat(novas, outro);
}
function iconeTipo(id){
  const t = ((typeof STATE !== 'undefined' && STATE.tiposPeca) || []).find(x => x.id === id);
  return ICONE_TIPO[id] || (t && t.icone) || '📦';
}
// Mesma conferência do servidor: 15 dígitos + dígito verificador (Luhn).
function imeiValido(imei){
  if (!/^\d{15}$/.test(imei)) return false;
  let soma = 0;
  for (let i = 0; i < 15; i++) { let d = Number(imei[14 - i]); if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; } soma += d; }
  return soma % 10 === 0;
}
function imeiObrigatorioAnuncio(){
  const sel = document.getElementById('an-tipo');
  const tipo = sel && STATE.tiposPeca.find(t => t.id === sel.value);
  return !!(tipo && tipo.exige_imei) && ['novo', 'usado'].includes(condicaoSelecionada);
}
const ERROS_IMEI = {
  imei_obrigatorio: 'Aparelho funcionando precisa do IMEI (disque *#06#). Se não liga, marque a condição como Sucata ou Com defeito.',
  imei_invalido: 'IMEI inválido. Confira os 15 números (disque *#06# no aparelho pra ver).',
  imei_em_uso: 'Esse IMEI já está num anúncio no ar. Se você vendeu, dê baixa no anúncio antigo primeiro.',
  imei_ja_vendido: 'Você já vendeu esse aparelho (IMEI). Cada unidade nova precisa do IMEI dela.',
};
function tempoRelativo(iso){
  if(!iso) return '';
  const d = new Date(iso.includes('T') ? iso : iso.replace(' ','T')+'Z');
  const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
  if (diffMin < 60) return diffMin <= 1 ? 'agora mesmo' : `há ${diffMin} min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `há ${diffH}h`;
  const diffD = Math.floor(diffH / 24);
  if (diffD === 1) return 'há 1 dia';
  if (diffD < 30) return `há ${diffD} dias`;
  return dataPorExtenso(iso);
}

function toast(msg, tipo){
  const el = document.createElement('div');
  el.className = 'toast' + (tipo ? ' ' + tipo : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3400);
}
function abrirModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="overlay" id="modal-overlay"><div class="folha">${html}</div></div>`;
  document.getElementById('modal-overlay').onclick = (e) => { if (e.target.id === 'modal-overlay') fecharModal(); };
}
function fecharModal(){ document.getElementById('modal-root').innerHTML = ''; }
window.fecharModal = fecharModal;

// Sem favoritos salvos, localStorage devolve null e JSON.parse(null) dá
// null (não erro) -- sem o "|| []" a lista de produtos quebrava inteira
// pra quem nunca favoritou nada.
function favoritos(){ const f = safeJsonParse(localStorage.getItem(LS_FAVORITOS), []); return Array.isArray(f) ? f : []; }
function alternarFavorito(id){
  let f = favoritos();
  f = f.includes(id) ? f.filter(x => x !== id) : [...f, id];
  localStorage.setItem(LS_FAVORITOS, JSON.stringify(f));
  return f.includes(id);
}

async function api(path, opts={}){
  const token = localStorage.getItem(LS_TOKEN);
  const headers = Object.assign({}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (opts.body && !(opts.body instanceof ArrayBuffer) && typeof opts.body !== 'string') {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const resp = await fetch(API + path, Object.assign({}, opts, { headers }));
  let data;
  try { data = await resp.json(); } catch(e) { data = { ok:false, erro:'resposta_invalida' }; }
  return { status: resp.status, data };
}

// App baixado (Capacitor/WebView ou instalado na tela) = barra de baixo.
// Navegador = cara de site. ?modo=app|site força (usado pelo "Ver o site"
// do painel pra mostrar os dois jeitos).
const MODO_FORCADO = new URLSearchParams(location.search).get('modo');
const EH_APP = MODO_FORCADO ? MODO_FORCADO === 'app' : !!(
  (window.Capacitor && (window.Capacitor.isNativePlatform ? window.Capacitor.isNativePlatform() : true))
  || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)
  || / wv\)/.test(navigator.userAgent)
);
if (!EH_APP) document.documentElement.classList.add('modo-site');
function navSite(){
  if (EH_APP) return '';
  // Igual Shopee: à esquerda a vitrine (todo mundo vê); à direita a área
  // do cliente -- Vender, Chat e Minha loja (painel do vendedor).
  const btn = ([t, i, r, cls]) => `<button data-site-tab="${t}" class="${cls || ''} ${STATE.aba === t && !STATE.pilha.length ? 'ativo' : ''}"><span class="nav-ic">${i}</span><span>${r}</span></button>`;
  const vitrine = [['inicio','🏠','Início'], ['categorias','▦','Categorias']];
  const cliente = [['anunciar','➕','Vender', 'destaque']].concat(STATE.usuario ? [['chat','💬','Chat'], ['loja','🏪','Minha loja']] : []);
  return `<nav class="site-nav">${vitrine.map(btn).join('')}<span class="nav-espaco" style="flex:1; min-width:8px;"></span>${cliente.map(btn).join('')}</nav>`;
}
function setTopo(html){
  document.getElementById('conteudo').classList.remove('largo', 'com-barra-negociar');
  const barra = document.getElementById('barra-negociar'); if (barra) barra.remove();
  const topo = document.getElementById('topo');
  topo.innerHTML = html + navSite();
  topo.querySelectorAll('[data-site-tab]').forEach(b => b.onclick = (e) => {
    if (b.dataset.siteTab === 'categorias') { e.stopPropagation(); return alternarMenuCategorias(); }
    setTab(b.dataset.siteTab);
  });
}
// Menu suspenso de categorias (site): abre embaixo do topo, fecha ao
// escolher, ao tocar fora ou com Esc.
function alternarMenuCategorias(){
  const aberto = document.getElementById('menu-categorias');
  if (aberto) { aberto.remove(); return; }
  const m = document.createElement('div');
  m.id = 'menu-categorias'; m.className = 'menu-categorias';
  m.innerHTML = `<div class="mc-grade">${categoriasGrid().map(c => `<button data-grupo="${c.grupo}"><span class="mc-ic">${c.icone}</span>${esc(c.nome)}</button>`).join('')}</div>
    <a href="javascript:void(0)" class="mc-todas" id="mc-todas">Ver todas as categorias ›</a>`;
  m.onclick = (e) => e.stopPropagation();
  document.getElementById('topo').appendChild(m);
  m.querySelectorAll('[data-grupo]').forEach(b => b.onclick = () => {
    m.remove();
    const c = categoriasGrid().find(x => x.grupo === b.dataset.grupo);
    irPara(() => renderListaProdutos({ grupo: c.grupo, nome: c.nome }));
  });
  document.getElementById('mc-todas').onclick = () => { m.remove(); setTab('categorias'); };
}
document.addEventListener('click', () => { const m = document.getElementById('menu-categorias'); if (m) m.remove(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const m = document.getElementById('menu-categorias'); if (m) m.remove(); } });
function rodapeSite(){
  if (EH_APP) return '';
  // Tela com rodapé = tela de vitrine (grade larga).
  document.getElementById('conteudo').classList.add('largo');
  return `<footer class="site-rodape">
    <div class="rodape-grade">
      <div><h4>Sucat<span style="color:#4ade80;">ell</span></h4><div style="font-size:13.5px; line-height:1.5;">Compra e venda de celulares, peças e sucata perto de você. Anúncios de clientes de vários bairros, com chat seguro dentro do app.</div></div>
      <div><h4>Comprar</h4><a onclick="setTab('inicio')">Ofertas</a><a onclick="setTab('categorias')">Categorias</a><a onclick="verTodosBairros()">Todos os bairros</a></div>
      <div><h4>Vender</h4><a onclick="setTab('anunciar')">Anunciar um produto</a><a onclick="${STATE.usuario ? "setTab('perfil'); irPara(renderMeusAnuncios);" : "pedirLogin('ver seus anúncios')"}">Meus anúncios</a><a onclick="${STATE.usuario ? "setTab('perfil')" : "pedirLogin('')"}">${STATE.usuario ? 'Minha conta' : 'Entrar / criar conta grátis'}</a></div>
      <div><h4>Ajuda</h4><a href="https://api.leunamesoftware.com/download/sucatell.apk">📲 Baixar o app (Android)</a><a onclick="abrirEsqueciSenha()">Falar com o suporte</a></div>
    </div>
    <div class="rodape-fim">© ${new Date().getFullYear()} Sucatell · LeuName Softwares</div>
  </footer>`;
}
function topoComVoltar(titulo, aoVoltar, direita){
  setTopo(`<div class="topo-linha">
    <button class="icone" id="topo-voltar">←</button>
    <h2>${esc(titulo)}</h2>
    ${direita || ''}

async function fazerCadastro(){
  const nome = document.getElementById('cd-nome').value.trim();

function abrirSeletorBairro(){
  abrirModal(`

let mapaSeletorInstancia = null;
async function carregarMapaSeletor(){
  const el = document.getElementById('sb-mapa');
  if (!el || !window.L) return;
  const { data } = await api('/localizacao/bairros-no-mapa');
  if (!data.ok || !data.bairros.length) { el.remove(); return; }
  const centro = data.bairros.find(b => b.id === STATE.bairroId) || data.bairros[0];
  if (mapaSeletorInstancia) { mapaSeletorInstancia.remove(); mapaSeletorInstancia = null; }
  const mapa = L.map('sb-mapa').setView([centro.lat, centro.lng], 11);
  mapaSeletorInstancia = mapa;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(mapa);
  data.bairros.forEach(b => {
    const marcador = L.marker([b.lat, b.lng]).addTo(mapa).bindPopup(`<b>${esc(b.nome)}</b><br>${esc(b.cidade_nome)}<br><button onclick="selecionarBairroDoMapa('${b.id}','${esc(b.nome).replace(/'/g,"\\'")}')" style="margin-top:6px; padding:6px 10px; border-radius:8px; border:none; background:#178a43; color:#fff; font-weight:700;">Usar este bairro</button>`);
    if (b.id === STATE.bairroId) marcador.openPopup();
  });
}

    const bairroSel = document.getElementById('sb-bairro');

    if (!v || v === '__novo__') { bairroSel.disabled = true; document.getElementById('sb-confirmar').disabled = true; return; }
    const { data } = await api('/localizacao/bairros?cidade_id=' + v);
    bairroSel.disabled = false;

// produto escolhido e o chat já sobre ele. Dentro da loja, tocar num
// produto só troca o escolhido (opts.naLoja).
function cartaoProduto(a, _i, _l, opts){
  opts = opts || {};
  const fotos = safeJsonParse(a.fotos, []);
  const capa = fotos[0] || null;
  const favoritado = favoritos().includes(a.id);
  const deOutro = a.status === 'ativo' && a.vendedor_id && a.vendedor_id !== STATE.usuario?.id;
  const acao = opts.naLoja && deOutro ? `selecionarProdutoLoja('${a.id}')`
    : deOutro ? `abrirLojaNegociar('${a.vendedor_id}', '${a.id}')` : `abrirAnuncio('${a.id}')`;
  return `
  <div class="card produto-card ${a.status === 'vendido' ? 'vendido' : ''} ${opts.selecionado ? 'escolhido' : ''}" data-id="${a.id}" onclick="${acao}">

    ${a.status === 'vendido' ? '<span class="selo-vendido">✓ VENDIDO</span>' : ''}
    ${capa ? `<img class="produto-foto" src="${esc(capa)}" alt="">` : `<div class="produto-foto produto-foto-vazia">${iconeTipo(a.tipo_peca_id)}</div>`}
    <div class="produto-info">
      <div class="produto-local">📍 ${esc(a.bairro_nome||'')} ${a.distancia_km!=null?'· '+distanciaLabel(a.distancia_km):''} · ${tempoRelativo(a.criado_em)}</div>
      <div class="produto-titulo">${esc(a.titulo)}</div>
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:3px;">
        <span class="chip cinza" style="margin:0;">${esc(CONDICOES[a.condicao]||'Usado')}</span>
      </div>
      <div class="preco-linha">
        <div class="preco">${centavosParaReais(a.preco_centavos)}</div>
        ${deOutro ? `<button class="btn-negociar" onclick="event.stopPropagation(); ${opts.naLoja ? `iniciarConversa('${a.id}')` : `abrirLojaNegociar('${a.vendedor_id}', '${a.id}')`}">💬 Negociar</button>` : ''}
      </div>
    </div>
    <button onclick="event.stopPropagation(); marcarFavoritoUI(this,'${a.id}')" style="background:none;border:none;font-size:17px;align-self:flex-start;cursor:pointer;">${favoritado?'❤️':'🤍'}</button>

  document.querySelectorAll('#lp-ordenar button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#lp-ordenar button').forEach(x=>x.classList.remove('ativo'));

function abrirFiltrosBusca(){
  abrirModal(`
    <button class="fechar-folha" onclick="fecharModal()">✕</button>
    <h3>Filtros</h3>
    <label style="margin-top:0;">Marca</label>
    <select id="fl-marca"><option value="">Todas</option>${STATE.marcas.map(m=>`<option value="${m.id}" ${filtroAtual.marca_id===m.id?'selected':''}>${esc(m.nome)}</option>`).join('')}</select>
    <button class="btn" id="fl-aplicar">Aplicar filtros</button>`);
  document.getElementById('fl-aplicar').onclick = () => {
    filtroAtual.marca_id = document.getElementById('fl-marca').value;
    fecharModal(); buscarEListar();
  };
}
async function buscarEListar(){
  let path = '/anuncios?bairro_id=' + encodeURIComponent(STATE.bairroId);
  if (filtroAtual.grupo) path += '&grupo=' + filtroAtual.grupo;
  if (filtroAtual.condicao) path += '&condicao=' + filtroAtual.condicao;
  if (filtroAtual.marca_id) path += '&marca_id=' + filtroAtual.marca_id;
  if (filtroAtual.busca) path += '&busca=' + encodeURIComponent(filtroAtual.busca);
  const { data } = await api(path);
  const box = document.getElementById('lp-resultados');
  const contagem = document.getElementById('lp-contagem');
  if (!data.ok) { box.innerHTML = '<div class="empty">Erro ao buscar.</div>'; return; }
  let anuncios = data.anuncios;
  if (filtroAtual.ordenar === 'recentes') anuncios = [...anuncios].sort((x,y) => new Date(y.criado_em) - new Date(x.criado_em));
  else if (filtroAtual.ordenar === 'preco') anuncios = [...anuncios].sort((x,y) => x.preco_centavos - y.preco_centavos);
  if (contagem) contagem.textContent = anuncios.length + (STATE.bairroId === 'todos' ? ' anúncio(s) em todos os bairros' : ' anúncio(s) na sua região');
  box.innerHTML = anuncios.length ? anuncios.map(cartaoProduto).join('') : '<div class="empty"><span class="emoji-vazio">📭</span>Nenhum anúncio encontrado.</div>';
}

// Foto de celular hoje passa fácil de 5-10MB; reduz pra no máximo 1600px
// e JPEG antes de enviar -- sobe muito mais rápido no 4G e nunca estoura
// o limite de 8MB do servidor. Se o navegador não conseguir ler a imagem
// (formato estranho), manda o arquivo original mesmo.
async function comprimirFoto(file){
  try {
    const bitmap = await createImageBitmap(file);
    const escala = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * escala);
    canvas.height = Math.round(bitmap.height * escala);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch (e) { return file; }
}
async function enviarFoto(file){
  const corpo = await comprimirFoto(file);
  const resp = await fetch(API + '/upload-foto', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem(LS_TOKEN), 'X-File-Name': 'foto.jpg', 'Content-Type': corpo.type || 'image/jpeg' },
    body: corpo,
  });
  const d = await resp.json();
  return d.ok ? API + d.url : null;
}
async function publicarAnuncio(){
  const marca_id = document.getElementById('an-marca').value;
  const modelo_id = document.getElementById('an-modelo').value;
  const tipo_peca_id = document.getElementById('an-tipo').value;
  const titulo = document.getElementById('an-titulo').value.trim();
  const descricao = document.getElementById('an-descricao').value.trim();
  const precoReais = parseFloat(document.getElementById('an-preco').value);
  if (!marca_id || !modelo_id || !tipo_peca_id || !titulo || !precoReais || marca_id === '__novo__' || modelo_id === '__novo__') return toast('Preencha tipo, marca, modelo, título e preço.', 'erro');
  const tipoEscolhido = STATE.tiposPeca.find(t => t.id === tipo_peca_id);
  const imei = tipoEscolhido && tipoEscolhido.exige_imei ? document.getElementById('an-imei').value.trim() : '';
  if (imeiObrigatorioAnuncio() && !imei) return toast(ERROS_IMEI.imei_obrigatorio, 'erro');
  if (imei && !imeiValido(imei)) return toast(ERROS_IMEI.imei_invalido, 'erro');
  const btn = document.getElementById('an-publicar');
  btn.disabled = true; btn.textContent = 'Enviando fotos...';
  const fotosUrls = [];
  let falhasFoto = 0;
  for (const f of fotosSelecionadas) {
    try {
      const url = await enviarFoto(f.file);
      if (url) fotosUrls.push(url); else falhasFoto++;
    } catch (e) { falhasFoto++; }
  }
  if (falhasFoto) toast(`${falhasFoto} foto(s) não subiram -- o anúncio vai sem elas.`, 'erro');
  btn.textContent = 'Publicando...';
  const { data } = await api('/anuncios', { method:'POST', body:{ marca_id, modelo_id, tipo_peca_id, titulo, descricao, preco_centavos: Math.round(precoReais*100), fotos: fotosUrls, bairro_id: STATE.usuario.bairro_id, condicao: condicaoSelecionada, imei } });
  btn.disabled = false; btn.textContent = STATE.usuario.is_admin ? 'Publicar anúncio' : 'Publicar anúncio (1 crédito)';
  if (!data.ok) {
    if (data.erro === 'sem_creditos') { toast('Você não tem créditos.', 'erro'); return irPara(renderComprarCreditos); }
    if (data.erro === 'fora_do_tema') return toast('Este anúncio só aceita celular, peças e acessórios.', 'erro');
    if (ERROS_IMEI[data.erro]) return toast(ERROS_IMEI[data.erro], 'erro');
    return toast('Erro ao publicar' + (data.erro ? ' (' + data.erro + ')' : '') + '.', 'erro');
  }
  toast('Anúncio publicado!', 'sucesso');
  setTab('loja');
}

function statusLabel(s){ return { ativo:'Ativo', pausado_manual:'Pausado', expirado:'Expirado', removido_admin:'Removido', vendido:'Vendido ✓' }[s] || s; }
let abaMeusAnuncios = 'todos';
async function renderMeusAnuncios(){
  topoComVoltar('Meus anúncios', voltar);
  const el = document.getElementById('conteudo');
  el.innerHTML = `<div class="abas-perfil" id="ma-abas">
      <button data-a="todos" class="ativo">Todos</button>
      <button data-a="ativo">Ativos</button>
      <button data-a="pausado_manual">Pausados</button>
      <button data-a="expirado">Expirados</button>
      <button data-a="vendido">Vendidos</button>
    </div>
    <div id="ma-lista"><div class="muted">Carregando...</div></div>`;
  document.querySelectorAll('#ma-abas button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#ma-abas button').forEach(x=>x.classList.remove('ativo')); b.classList.add('ativo');
    abaMeusAnuncios = b.dataset.a; desenharMeusAnuncios();
  });
  abaMeusAnuncios = 'todos';
  await desenharMeusAnuncios();
}
let cacheMeusAnuncios = [];
async function desenharMeusAnuncios(){
  const { data } = await api('/anuncios/meus');
  cacheMeusAnuncios = data.ok ? data.anuncios : [];
  const lista = abaMeusAnuncios === 'todos' ? cacheMeusAnuncios : cacheMeusAnuncios.filter(a => a.status === abaMeusAnuncios);
  const box = document.getElementById('ma-lista');
  if (!lista.length) { box.innerHTML = '<div class="empty"><span class="emoji-vazio">📦</span>Nada por aqui ainda.</div>'; return; }
  box.innerHTML = lista.map(a => `
    <div class="card">
      <div style="display:flex; justify-content:space-between; gap:8px;">
        <div style="font-weight:700;">${esc(a.titulo)}</div>
        <span class="chip cinza">${statusLabel(a.status)}</span>
      </div>
      <div class="preco">${centavosParaReais(a.preco_centavos)}</div>
      ${a.imei ? `<p class="muted" style="margin:4px 0;">IMEI: <b>${esc(a.imei)}</b></p>` : ''}
      <p class="muted">${a.status === 'vendido' ? 'Vendido em ' + new Date(a.vendido_em || a.criado_em).toLocaleDateString('pt-BR') : 'Expira em ' + new Date(a.expira_em).toLocaleDateString('pt-BR')}</p>
      ${a.status === 'ativo' || a.status === 'pausado_manual' ? `<div class="linha2">
          <button class="btn pequeno" onclick="marcarVendido('${a.id}')">✓ Vendi</button>
          ${a.status === 'ativo' ? `<button class="btn pequeno secundario" onclick="pausarAnuncio('${a.id}')">Pausar</button>` : ''}
        </div>` : ''}
      ${a.status === 'expirado' ? `<button class="btn pequeno" onclick="renovarAnuncio('${a.id}')">Renovar (1 crédito)</button>` : ''}
    </div>`).join('');
}
// Dar baixa na venda. Com IMEI o anúncio é uma unidade: sai da loja.
// Sem IMEI (capinha, cabo, lote) pergunta se ainda tem mais pra vender.
window.marcarVendido = function(id){
  const a = cacheMeusAnuncios.find(x => x.id === id) || {};
  abrirModal(`
    <button class="fechar-folha" onclick="fecharModal()">✕</button>
    <h3>Dar baixa na venda</h3>
    <p class="muted"><b>${esc(a.titulo || '')}</b>${a.imei ? '<br>IMEI ' + esc(a.imei) : ''}</p>
    ${a.imei ? `<p class="muted">O anúncio sai da loja e vai pra "Vendidos". Se tiver outra unidade, anuncie de novo com o IMEI dela.</p>
      <button class="btn" onclick="confirmarVenda('${id}', true)">✓ Confirmar: vendi</button>`
    : `<button class="btn" onclick="confirmarVenda('${id}', true)">Vendi e acabou (tirar da loja)</button>
      <button class="btn secundario" onclick="confirmarVenda('${id}', false)">Vendi um, ainda tenho mais (manter na loja)</button>`}`);
};
window.confirmarVenda = async function(id, encerrar){
  fecharModal();
  const { data } = await api('/anuncios/' + id + '/vender', { method:'POST', body:{ encerrar } });
  if (!data.ok) return toast(data.erro === 'ja_vendido' ? 'Esse anúncio já está como vendido.' : 'Erro ao dar baixa.', 'erro');
  toast(data.ganhou_credito_bonus ? 'Venda registrada! Você ganhou 1 crédito de bônus 🎉' : (data.encerrado ? 'Baixa feita! O anúncio saiu da loja.' : 'Venda registrada!'), 'sucesso');
  if (document.getElementById('ma-lista')) desenharMeusAnuncios();
  else if (document.getElementById('ml-painel')) renderMinhaLoja(STATE.pilha.length ? true : undefined);
  else if (typeof aoDarBaixaNoChat === 'function') aoDarBaixaNoChat();
};
window.pausarAnuncio = async function(id){ await api('/anuncios/' + id + '/pausar', { method:'POST' }); toast('Anúncio pausado.', 'sucesso'); desenharMeusAnuncios(); };
window.renovarAnuncio = async function(id){
  const { data } = await api('/anuncios/' + id + '/renovar', { method:'POST' });
  if (!data.ok) return toast(data.erro === 'sem_creditos' ? 'Sem créditos suficientes.' : (ERROS_IMEI[data.erro] || 'Erro.'), 'erro');
  toast('Anúncio renovado por mais 30 dias!', 'sucesso'); desenharMeusAnuncios();
};

// "Negociar" num produto: abre a loja do vendedor com esse produto em
// destaque no topo e o botão pra negociar ele (igual marketplace).
window.abrirLojaNegociar = function(usuarioId, anuncioId){ irPara(() => renderPerfilVendedor(usuarioId, 'anuncios', anuncioId)); };
async function renderPerfilVendedor(usuarioId, aba, destaqueId){
  aba = aba || 'anuncios';
  const [{ data }, destaqueResp] = await Promise.all([
    api('/usuarios/' + usuarioId),
    destaqueId ? api('/anuncios/' + destaqueId) : Promise.resolve(null),
  ]);
  if (!data.ok) { topoComVoltar('Vendedor', voltar); document.getElementById('conteudo').innerHTML = '<div class="empty">Vendedor não encontrado.</div>'; return; }
  const u = data.usuario;
  const souEu = usuarioId === STATE.usuario?.id;
  const destaque = destaqueResp && destaqueResp.data && destaqueResp.data.ok ? destaqueResp.data.anuncio : null;
  topoComVoltar('Loja de ' + (u.nome || '').split(' ')[0], voltar);
  document.getElementById('conteudo').innerHTML = `
    <div class="loja-capa">
      <div class="loja-faixa"><span>Sucat<b>ell</b> · Loja oficial do vendedor</span></div>
      <div class="loja-cabeca">
        ${avatarHtml(u.nome, u.foto_url, 'width:78px; height:78px; font-size:26px; border:4px solid var(--card); flex-shrink:0;')}
        <div style="min-width:0; flex:1;">
          <div class="loja-nome">Loja de ${esc(u.nome)}</div>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; align-items:center;">
            ${u.verificado ? '<span class="selo-verificado">✅ Vendedor verificado</span>' : ''}
            ${u.bairro_nome ? `<span class="muted">📍 ${esc(u.bairro_nome)}</span>` : ''}
            <span class="muted">· desde ${dataPorExtenso(u.criado_em)}</span>
          </div>
        </div>
      </div>
      <div class="estat-grid" style="margin:12px 0 0;">
        <div class="estat-item"><b>${u.anuncios_ativos}</b><span>À venda</span></div>
        <div class="estat-item"><b>${u.vendas_confirmadas_total}</b><span>Vendas</span></div>
        <div class="estat-item"><b>${u.media_avaliacoes ? '★ ' + u.media_avaliacoes : '—'}</b><span>Avaliação</span></div>
        <div class="estat-item"><b>${u.total_avaliacoes}</b><span>Avaliações</span></div>
      </div>
      ${souEu ? '<p class="muted" style="text-align:center; margin:12px 0 0;">É assim que os clientes veem a sua loja.</p>' : ''}
    </div>
    <div class="abas-perfil" id="pv-abas">
      <button data-a="anuncios" class="${aba==='anuncios'?'ativo':''}">À venda (${u.anuncios_ativos})</button>
      <button data-a="vendidos" class="${aba==='vendidos'?'ativo':''}">Vendidos (${u.anuncios_vendidos || 0})</button>
      <button data-a="avaliacoes" class="${aba==='avaliacoes'?'ativo':''}">Avaliações (${u.total_avaliacoes})</button>
    </div>
    <div id="pv-conteudo"></div>`;
  document.querySelectorAll('#pv-abas button').forEach(b => b.onclick = () => renderPerfilVendedor(usuarioId, b.dataset.a, STATE.lojaEscolhido || destaqueId));
  STATE.lojaVendedor = usuarioId;
  STATE.lojaEscolhido = destaqueId || null;
  STATE.lojaDestaque = destaque;
  if (!souEu) desenharBarraNegociar();
  const box = document.getElementById('pv-conteudo');
  box.classList.toggle('lista-produtos', aba === 'anuncios' || aba === 'vendidos');
  document.getElementById('conteudo').classList.add('largo');
  if (aba === 'anuncios') {
    const { data: an } = await api('/usuarios/' + usuarioId + '/anuncios');
    let lista = an.ok ? an.anuncios : [];
    // O produto escolhido vem primeiro na vitrine da loja.
    if (destaqueId) lista = lista.filter(a => a.id === destaqueId).concat(lista.filter(a => a.id !== destaqueId));
    STATE.anunciosLojaAberta = lista;
    box.innerHTML = lista.length ? lista.map(a => cartaoProduto(a, 0, 0, { naLoja: true, selecionado: a.id === STATE.lojaEscolhido })).join('') : '<div class="empty">Nenhum anúncio ativo.</div>';
    if (!souEu) desenharBarraNegociar();
  } else if (aba === 'vendidos') {
    const { data: an } = await api('/usuarios/' + usuarioId + '/anuncios?status=vendido');
    box.innerHTML = (an.ok && an.anuncios.length) ? an.anuncios.map(cartaoProduto).join('') : '<div class="empty">Nenhuma venda ainda.</div>';
  } else {
    const { data: av } = await api('/usuarios/' + usuarioId + '/avaliacoes');
    if (!av.ok) { box.innerHTML = '<div class="empty">Erro ao carregar.</div>'; return; }
    const total = Object.values(av.distribuicao).reduce((a,b)=>a+b,0) || 1;
    box.innerHTML = `
      <div class="card">
        ${[5,4,3,2,1].map(n => `<div class="barra-nota"><span>${n}★</span><div class="fundo"><div class="preenchida" style="width:${(av.distribuicao[n]/total*100)}%"></div></div><span>${av.distribuicao[n]}</span></div>`).join('')}
      </div>
      ${av.avaliacoes.length ? av.avaliacoes.map(r => `

          <div style="display:flex; justify-content:space-between;"><b>${esc(r.avaliador_nome)}</b><span class="estrelas">${'★'.repeat(r.nota)}${'☆'.repeat(5-r.nota)}</span></div>
          ${r.comentario ? `<p class="muted">"${esc(r.comentario)}"</p>` : ''}
        </div>`).join('') : '<div class="empty">Nenhuma avaliação ainda.</div>'}`;
  }
}
// Barra fixa embaixo da loja: o chat já é sobre o produto escolhido.
function desenharBarraNegociar(){
  let barra = document.getElementById('barra-negociar');
  if (!barra) { barra = document.createElement('div'); barra.id = 'barra-negociar'; barra.className = 'barra-negociar'; document.body.appendChild(barra); }
  const a = (STATE.anunciosLojaAberta || []).find(x => x.id === STATE.lojaEscolhido)
    || (STATE.lojaDestaque && STATE.lojaDestaque.id === STATE.lojaEscolhido ? STATE.lojaDestaque : null);
  const disponivel = a && a.status === 'ativo';
  const capa = a ? safeJsonParse(a.fotos, [])[0] : null;
  barra.innerHTML = `<div class="bn-dentro">
    ${a ? `${capa ? `<img src="${esc(capa)}" alt="">` : `<div class="bn-ic">${iconeTipo(a.tipo_peca_id)}</div>`}
      <div class="bn-txt"><div class="bn-rot">${disponivel ? 'Conversar sobre:' : 'Não está mais disponível:'}</div><div class="bn-tit">${esc(a.titulo)}</div><div class="bn-preco">${centavosParaReais(a.preco_centavos)} · <a href="javascript:void(0)" onclick="abrirAnuncio('${a.id}')">ver fotos</a></div></div>`
      : `<div class="bn-txt"><div class="bn-tit">Gostou de algo dessa loja?</div><div class="bn-rot">Toque num produto pra escolher</div></div>`}
    <button class="btn" style="margin:0; width:auto; padding:12px 16px; flex-shrink:0;" onclick="iniciarConversaComVendedor('${STATE.lojaVendedor}', '${disponivel ? a.id : ''}')">💬 ${disponivel ? 'Negociar' : 'Falar com o vendedor'}</button>
  </div>`;
  document.getElementById('conteudo').classList.add('com-barra-negociar');
}
window.selecionarProdutoLoja = function(id){
  STATE.lojaEscolhido = id;
  document.querySelectorAll('#pv-conteudo .produto-card').forEach(c => {
    const sel = c.dataset.id === id;
    c.classList.toggle('escolhido', sel);
    const selo = c.querySelector('.selo-escolhido');
    if (sel && !selo) c.insertAdjacentHTML('afterbegin', '<span class="selo-escolhido">Você escolheu</span>');
    if (!sel && selo) selo.remove();
  });
  desenharBarraNegociar();
};
// "Falar com o vendedor" na loja: a conversa é sempre sobre um produto.
// Veio pelo "Negociar"? Já é sobre aquele. Senão, pergunta qual.
window.iniciarConversaComVendedor = async function(usuarioId, anuncioId){
  if (!STATE.usuario) return pedirLogin('falar com o vendedor');
  if (anuncioId) return iniciarConversa(anuncioId);
  let lista = STATE.anunciosLojaAberta;
  if (!lista || !lista.length || lista[0].vendedor_id !== usuarioId) {
    const { data } = await api('/usuarios/' + usuarioId + '/anuncios');
    lista = data.ok ? data.anuncios : [];
  }
  if (!lista.length) return toast('Esse vendedor não tem produtos à venda agora.', 'erro');
  if (lista.length === 1) return iniciarConversa(lista[0].id);
  abrirModal(`
    <button class="fechar-folha" onclick="fecharModal()">✕</button>
    <h3>Sobre qual produto você quer falar?</h3>
    ${lista.map(a => { const f = safeJsonParse(a.fotos, [])[0]; return `
      <div class="card" style="display:flex; gap:10px; align-items:center; cursor:pointer; margin-bottom:8px; padding:10px;" onclick="fecharModal(); iniciarConversa('${a.id}')">
        ${f ? `<img src="${esc(f)}" alt="" style="width:52px; height:52px; object-fit:cover; border-radius:10px;">` : `<div class="produto-foto produto-foto-vazia" style="width:52px; height:52px;">${iconeTipo(a.tipo_peca_id)}</div>`}
        <div style="flex:1; min-width:0;"><b>${esc(a.titulo)}</b><div class="preco" style="font-size:14px;">${centavosParaReais(a.preco_centavos)}</div></div>
        <span style="color:var(--verde); font-weight:800;">Negociar ›</span>
      </div>`; }).join('')}`);
};

// ---------------- COMPRAR CRÉDITOS ----------------
async function renderComprarCreditos(){
  topoComVoltar('Comprar créditos', voltar);
  const { data: saldoData } = await api('/creditos/saldo');
  document.getElementById('conteudo').innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="muted">Saldo atual</div>
      <div style="font-size:34px; font-weight:800; color:var(--verde-forte);">${STATE.usuario.is_admin ? '∞' : (saldoData.saldo_creditos ?? 0)}</div>
      <p class="muted">${STATE.usuario.is_admin ? 'Sua conta é admin: créditos ilimitados, nunca precisa comprar.' : '1 crédito = R$5 = 1 anúncio ativo por 30 dias. Dentro dos 30 dias você pode vender quantas vezes quiser do mesmo anúncio sem pagar de novo.'}</p>
    </div>
    <div class="card">
      <label style="margin-top:0;">Quantidade de créditos</label>
      <input id="cc-qtd" type="number" min="1" value="5">
      <button class="btn" id="cc-comprar">Gerar Pix</button>
      <div id="cc-pix-area"></div>
    </div>`;
  document.getElementById('cc-comprar').onclick = comprarCreditos;
}
async function comprarCreditos(){
  const qtd = parseInt(document.getElementById('cc-qtd').value, 10);
  if (!qtd || qtd < 1) return toast('Quantidade inválida.', 'erro');
  const { data } = await api('/creditos/comprar', { method:'POST', body:{ quantidade: qtd } });
  const area = document.getElementById('cc-pix-area');
  if (!data.ok) {
    area.innerHTML = `<div class="pix-caixa" style="background:var(--alerta-bg); color:var(--alerta);">${data.erro === 'pagamento_nao_configurado' ? 'O pagamento por Pix ainda não foi ativado pelo administrador.' : 'Erro ao gerar cobrança.'}</div>`;
    return;
  }
  area.innerHTML = `
    <div class="pix-caixa">
      <b>Pague ${centavosParaReais(data.valor_centavos)} pelo Pix</b>
      <p class="muted">Os créditos entram automaticamente na confirmação.</p>
      ${data.qr_code_base64 ? `<img src="data:image/png;base64,${data.qr_code_base64}">` : ''}
      <label>Pix copia e cola</label>
      <textarea rows="3" readonly>${esc(data.pix_copia_cola || '')}</textarea>
    </div>`;
}

// ---------------- CONFIGURAÇÕES ----------------
async function renderConfiguracoes(){
  topoComVoltar('Configurações', voltar);
  const temaAtual = localStorage.getItem(LS_TEMA) || 'claro';
  document.getElementById('conteudo').innerHTML = `
    <div class="card">
      <b style="display:block; margin-bottom:8px;">Conta</b>
      <div class="menu-item" id="cf-dados"><span class="icone-menu">👤</span><div class="texto-menu"><b>Editar meus dados</b></div><span class="seta">›</span></div>
      <div class="menu-item" id="cf-seguranca"><span class="icone-menu">🔒</span><div class="texto-menu"><b>Segurança / senha</b></div><span class="seta">›</span></div>
      <div class="menu-item" id="cf-localizacao"><span class="icone-menu">📍</span><div class="texto-menu"><b>Minha localização</b><span class="muted">${esc(nomeBairroAtual())}</span></div><span class="seta">›</span></div>
    </div>
    <div class="card">
      <b style="display:block; margin-bottom:8px;">Preferências</b>
      <label style="margin-top:0;">Tema do aplicativo</label>
      <div class="filtro-chips" id="cf-tema">
        ${['claro','escuro','automatico'].map(t => `<button data-t="${t}" class="${t===temaAtual?'ativo':''}">${t==='claro'?'Claro':t==='escuro'?'Escuro':'Automático'}</button>`).join('')}
      </div>
      <p class="muted">Idioma: Português (Brasil)</p>
    </div>
    <div class="card">
      <b style="display:block; margin-bottom:8px;">Ajuda</b>
      <div class="menu-item" id="cf-ajuda"><span class="icone-menu">❓</span><div class="texto-menu"><b>Central de ajuda</b><span class="muted">Como funciona o Sucatell</span></div><span class="seta">›</span></div>
      <div class="menu-item" id="cf-sobre"><span class="icone-menu">ℹ️</span><div class="texto-menu"><b>Sobre o app</b><span class="muted">Versão e empresa</span></div><span class="seta">›</span></div>
    </div>`;
  document.getElementById('cf-dados').onclick = () => irPara(renderMeusDados);
  document.getElementById('cf-seguranca').onclick = () => irPara(renderSeguranca);
  document.getElementById('cf-localizacao').onclick = abrirSeletorBairro;
  document.getElementById('cf-ajuda').onclick = () => abrirModal(`
    <button class="fechar-folha" onclick="fecharModal()">✕</button>
    <h3>Como funciona o Sucatell</h3>
    <p class="muted">Cada anúncio custa 1 crédito (R$5) e fica ativo por 30 dias, podendo vender quantas unidades quiser nesse período. A cada 20 vendas confirmadas você ganha 1 crédito de bônus. A busca mostra sempre a sua região, e o chat bloqueia telefone/WhatsApp pra manter a negociação seguindo pelo app.</p>
    <p class="muted">Dúvidas? Fale com o vendedor pelo chat interno ou use "Denunciar" em qualquer anúncio suspeito.</p>`);
  document.getElementById('cf-sobre').onclick = () => abrirModal(`
    <button class="fechar-folha" onclick="fecharModal()">✕</button>
    <h3>Sobre o Sucatell</h3>
    <p class="muted">Sucatell — marketplace de celulares e peças usadas, por região.</p>
    <p class="muted">Versão 1.0.0</p>
    <p class="muted">Um produto LeuName Softwares.</p>`);
  document.querySelectorAll('#cf-tema button').forEach(b => b.onclick = () => {
    localStorage.setItem(LS_TEMA, b.dataset.t); aplicarTema();
    document.querySelectorAll('#cf-tema button').forEach(x=>x.classList.remove('ativo')); b.classList.add('ativo');
  });
}

// ---------------- categorias globais + boot ----------------
async function carregarCategorias(){
  const [m, tp] = await Promise.all([api('/categorias/marcas'), api('/categorias/tipos-peca')]);
  STATE.marcas = m.data.marcas || [];
  STATE.tiposPeca = tp.data.tipos_peca || [];
}
function setupPWA(){ try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); } catch(e){} }
function esconderSplashIntro(){
  const splash = document.getElementById('intro-splash');
  if (!splash) return;
  splash.classList.add('saindo');
  setTimeout(() => splash.remove(), 400);
}
// Bônus que o Sucatell (admin) deu: aparece uma vez, quando a pessoa abre o app.
async function avisarBonusNovo(){
  try {
    const { data } = await api('/bonus/novos');
    if (!data.ok) return;
    const prazos = data.prorrogacoes || [];
    if (!data.bonus.length && prazos.length) {
      abrirModal(`
        <button class="fechar-folha" onclick="fecharModal()">✕</button>
        <div style="text-align:center; padding:6px 0 4px;">
          <div style="font-size:54px;">⏳</div>
          <h3 style="margin:6px 0;">Você ganhou mais prazo!</h3>
          <p class="muted" style="margin:0;">Presente do Sucatell, sem gastar crédito:</p>
        </div>
        ${prazos.map(p => `<div class="card" style="margin:8px 0; padding:10px 12px;"><b>+${p.dias} dias</b> em "${esc(p.titulo)}"<div class="muted" style="font-size:12.5px;">Agora fica no ar até ${new Date(p.expira_em_novo).toLocaleDateString('pt-BR')}</div></div>`).join('')}
        <button class="btn" onclick="fecharModal(); setTab('perfil'); irPara(renderMeusAnuncios);">Ver meus anúncios</button>`);
      return;
    }
    if (!data.bonus.length) return;
    const total = data.bonus.reduce((a, b) => a + b.quantidade, 0);
    const mensagens = [...new Set(data.bonus.map(b => b.motivo).filter(Boolean))];
    abrirModal(`
      <button class="fechar-folha" onclick="fecharModal()">✕</button>
      <div style="text-align:center; padding:6px 0 4px;">
        <div style="font-size:54px;">🎁</div>
        <h3 style="margin:6px 0;">Você ganhou ${total} crédito${total > 1 ? 's' : ''} de bônus!</h3>
        <p class="muted" style="margin:0 0 6px;">${mensagens.length ? mensagens.map(esc).join('<br>') : 'Presente do Sucatell por anunciar com a gente.'}</p>
        <p style="margin:10px 0 0;">Cada crédito vale 1 anúncio de 30 dias. Saldo agora: <b>${data.saldo_creditos}</b> crédito(s).</p>
      </div>
      ${prazos.length ? `<p class="muted" style="text-align:center; margin:4px 0 0;">⏳ E ainda ganhou mais prazo em ${prazos.length} anúncio(s)!</p>` : ''}
      <button class="btn" onclick="fecharModal(); setTab('anunciar');">Anunciar agora</button>`);
  } catch (e) {}
}
async function boot(){
  try {
    setupPWA();
    // Igual Shopee: a loja abre direto nos produtos, mesmo sem conta.
    // Entrar só é pedido pra conversar, anunciar ou ver o perfil.
    const token = localStorage.getItem(LS_TOKEN);
    let logado = null;
    if (token) {
      const { data } = await api('/auth/me');
      if (data.ok) logado = data.usuario;
      else if (data.erro !== 'sem_conexao') localStorage.removeItem(LS_TOKEN);
    }
    STATE.usuario = logado;
    const salvo = safeJsonParse(localStorage.getItem('sucatel_bairro_visualizacao'), null);
    STATE.bairroId = logado ? logado.bairro_id : ((salvo && salvo.id) || 'todos');
    document.getElementById('auth-root').innerHTML = '';
    document.getElementById('app-root').classList.add('pronto');
    await carregarCategorias();
    document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
    STATE.lojaAberta = true;
    setTab('inicio');
    if (STATE.usuario) { atualizarBadgeChat(); avisarBonusNovo(); }
  } catch (e) {
    if (!document.getElementById('app-root').classList.contains('pronto')) renderAuth('login');
  } finally {
    esconderSplashIntro();
  }
}
boot();
</script>
