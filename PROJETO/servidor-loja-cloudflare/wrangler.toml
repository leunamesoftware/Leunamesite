name = "leuname-loja"
main = "src/index.js"
compatibility_date = "2026-09-19"

# Banco D1 da loja (catalogo + pedidos). Criado via Cloudflare MCP e ja
# populado com o catalogo inicial (ver schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "leuname_loja"
database_id = "960c3bdb-6562-4499-bf66-d55a6347b1db"

# Bucket para as imagens dos produtos, enviadas pelo painel admin
# (admin/productos.html) e servidas publicamente em /imagen/<arquivo>.
[[r2_buckets]]
binding = "IMAGENES"
bucket_name = "leuname-loja-imagenes"

# URL publica do site estatico (SITE-LEUNAMESOFTWARE/), usada para montar
# os links de sucesso/cancelamento do Stripe Checkout.
[vars]
SITE_URL = "https://www.leunamesoftware.com"

# Segredos usados por este Worker (configurados via "wrangler secret put"
# no workflow de deploy, nunca escritos aqui):
#   ADMIN_TOKEN            -> ja existente, reaproveitado
#   STRIPE_SECRET_KEY      -> chave secreta da conta Stripe (sk_test_/sk_live_)
#   STRIPE_WEBHOOK_SECRET  -> assinatura do endpoint de webhook (whsec_...),
#                             criado manualmente no Dashboard da Stripe
#                             apontando para <URL-deste-Worker>/webhook/stripe

# Dominio customizado: por enquanto NAO configurado (o Worker fica
# disponivel apenas em leuname-loja.<subdominio-da-conta>.workers.dev).
# Para ligar um dominio proprio (ex: loja-api.leunamesoftware.com), repita
# no Cloudflare Dashboard o mesmo passo manual que ja foi feito uma vez
# para api.leunamesoftware.com (usado pelo servidor de licencas):
#   Workers & Pages -> leuname-loja -> Settings -> Domains & Routes ->
#   Add Custom Domain -> escolher o subdominio desejado.
# Depois, descomente o bloco abaixo com o dominio escolhido e rode o
# workflow de deploy novamente.
# [[routes]]
# pattern = "loja-api.leunamesoftware.com"
# custom_domain = true
