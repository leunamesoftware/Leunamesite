name = "leuname-licencas"
main = "src/index.js"
compatibility_date = "2026-09-19"

# Depois de criar o banco (passo 2 do README), troque o database_id abaixo
# pelo id real que o comando "wrangler d1 create" devolver.
[[d1_databases]]
binding = "DB"
database_name = "leuname_licencas"
database_id = "4f3f9185-7743-4c36-b86e-92c557847c1e"

# Bucket com os instaladores (.apk / .exe) mais recentes, atualizado
# automaticamente pelos workflows de build. Serve como link fixo de
# download (sem precisar navegar no GitHub).
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "leuname-downloads"

# Dominios customizados: o "wrangler deploy" cria isso automaticamente,
# junto com o resto (script + binding do banco), numa unica chamada.
# O mesmo Worker/banco atende os dois dominios (site espanhol e site
# brasileiro usam o mesmo backend de licencas e downloads).
[[routes]]
pattern = "api.leunamesoftware.com"
custom_domain = true

[[routes]]
pattern = "api.leunamesoftware.com.br"
custom_domain = true
