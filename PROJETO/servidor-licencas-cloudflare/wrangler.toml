name = "leuname-licencas"
main = "src/index.js"
compatibility_date = "2026-09-19"

# Depois de criar o banco (passo 2 do README), troque o database_id abaixo
# pelo id real que o comando "wrangler d1 create" devolver.
[[d1_databases]]
binding = "DB"
database_name = "leuname_licencas"
database_id = "4f3f9185-7743-4c36-b86e-92c557847c1e"

# Domínio customizado: o "wrangler deploy" cria isso automaticamente,
# junto com o resto (script + binding do banco), numa unica chamada.
[[routes]]
pattern = "api.leunamesoftware.com"
custom_domain = true
