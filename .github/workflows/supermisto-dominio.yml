name: Supermisto - domínio na Cloudflare
on:
  workflow_dispatch:
jobs:
  dominio:
    runs-on: ubuntu-latest
    steps:
      - name: Criar/consultar a zona supermistotemperos.com.br
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF" -H "Content-Type: application/json" "$@"; }
          Z=supermistotemperos.com.br
          r=$(api "https://api.cloudflare.com/client/v4/zones?name=$Z")
          if [ "$(echo "$r" | jq '.result|length')" = "0" ]; then
            acc=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
            r=$(api -X POST https://api.cloudflare.com/client/v4/zones -d "{\"name\":\"$Z\",\"account\":{\"id\":\"$acc\"},\"type\":\"full\"}")
            echo "::notice::Criar zona: $(echo "$r" | jq -c '{success, errors}')"
            echo "::notice::Conta: $(api https://api.cloudflare.com/client/v4/accounts | jq -c '{success, errors, n: (.result|length)}')"
            r=$(api "https://api.cloudflare.com/client/v4/zones?name=$Z")
          fi
          echo "$r" | jq -c '.result[0] | {status, name_servers}'
          echo "::notice::Status: $(echo "$r" | jq -r '.result[0].status') | DNS: $(echo "$r" | jq -r '.result[0].name_servers|join(" e ")')"
      - name: DNS público
        run: |
          echo "::notice::NS no .br: $(dig +short NS supermistotemperos.com.br @a.dns.br | tr '\n' ' ') | NS público: $(dig +short NS supermistotemperos.com.br @1.1.1.1 | tr '\n' ' ') | DS: $(dig +short DS supermistotemperos.com.br @a.dns.br | tr '\n' ' ')"
      - name: Site responde?
        run: |
          for h in supermistotemperos.com.br www.supermistotemperos.com.br; do
            echo "::notice::$h -> $(dig +short A $h @1.1.1.1 | head -2 | tr '\n' ' ') HTTP $(curl -s -o /dev/null -w '%{http_code}' https://$h/)"
          done
