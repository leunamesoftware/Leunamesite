name: Build Android APK

# Depois que este workflow terminar, a versão mais recente do APK fica
# disponível para baixar direto (sem zip, sem navegar no GitHub) em:
# https://api.leunamesoftware.com/download/leuname-gestao.apk
#
# (Alternativa, se precisar do arquivo bruto do GitHub: aba Actions →
# "Build Android APK" → abrir a execução → seção "Artifacts" → baixar
# "LeuName-Gestao-Android", um .zip contendo o .apk real.)
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (necessário para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar o Android SDK
        # A action android-actions/setup-android@v3 tenta instalar o pacote
        # legado "tools", que foi removido do repositório do SDK e faz o
        # passo falhar. Em vez de depender de um sdkmanager pré-instalado em
        # um caminho incerto do runner, baixamos o cmdline-tools oficial do
        # Google só se ele ainda não existir, e instalamos exatamente a
        # plataforma/build-tools que o projeto Android (gerado pelo
        # Capacitor) declara em variables.gradle (compileSdkVersion 34).
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $ANDROID_SDK_ROOT; baixando cmdline-tools do Google..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Usando sdkmanager em: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Instalar dependências do projeto Android
        working-directory: ANDROID/projeto-instalador-android
        run: npm install

      - name: Criar o projeto Android nativo (Capacitor)
        working-directory: ANDROID/projeto-instalador-android
        run: npx cap add android

      - name: Copiar o sistema para dentro do projeto Android
        working-directory: ANDROID/projeto-instalador-android
        run: npx cap sync android

      - name: Aplicar o ícone oficial da LeuName Softwares
        # Copia tambem a camada "foreground" e a cor de fundo do icone
        # adaptativo (Android 8+), nao so os ic_launcher.png legados.
        # Sem isso, o launcher moderno continua mostrando o icone padrao
        # do Capacitor (a seta azul), mesmo com ic_launcher.png trocado.
        working-directory: ANDROID/projeto-instalador-android
        shell: bash
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "icones-oficiais/$d/ic_launcher.png" "android/app/src/main/res/$d/ic_launcher.png"
            cp "icones-oficiais/$d/ic_launcher_round.png" "android/app/src/main/res/$d/ic_launcher_round.png"
            cp "icones-oficiais/$d/ic_launcher_foreground.png" "android/app/src/main/res/$d/ic_launcher_foreground.png"
          done
          cp "icones-oficiais/ic_launcher_background.xml" "android/app/src/main/res/values/ic_launcher_background.xml"

      - name: Dar permissão de execução ao Gradle
        working-directory: ANDROID/projeto-instalador-android/android
        shell: bash
        run: chmod +x gradlew

      - name: Gerar o APK
        working-directory: ANDROID/projeto-instalador-android/android
        shell: bash
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK final
        working-directory: ANDROID/projeto-instalador-android
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/LeuName-Gestao.apk

      - name: Enviar o APK como Artifact do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: LeuName-Gestao-Android
          path: ANDROID/projeto-instalador-android/android/app/build/outputs/apk/debug/LeuName-Gestao.apk
          if-no-files-found: error

      - name: Configurar Node.js 22 (exigido pelo wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar o APK no link fixo de download
        # Sobe o APK para o mesmo servidor da Cloudflare que já hospeda as
        # licenças, disponibilizando sempre em
        # https://api.leunamesoftware.com/download/leuname-gestao.apk
        # (link permanente, sem precisar navegar no GitHub Actions).
        working-directory: PROJETO/servidor-licencas-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx wrangler@latest r2 object put \
            leuname-downloads/leuname-gestao.apk \
            --file ../../ANDROID/projeto-instalador-android/android/app/build/outputs/apk/debug/LeuName-Gestao.apk \
            --content-type application/vnd.android.package-archive \
            --remote
