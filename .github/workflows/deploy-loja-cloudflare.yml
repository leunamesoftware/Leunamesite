name: Deploy Servidor da Loja (Cloudflare)

# Publica/atualiza o Worker "leuname-loja" na Cloudflare: sobe o
# código e liga o banco D1 leuname_loja — tudo em uma única chamada do
# wrangler. Depois configura o segredo ADMIN_TOKEN separadamente
# (reaproveita o MESMO segredo do servidor de licenças).
#
# Requer estes segredos no repositório (já configurados, reaproveitados
# do servidor de licenças):
#   CF_API_TOKEN   -> token de API da Cloudflare (permissões: Workers
#                     Scripts Edit, D1 Edit, Account Settings Read)
#   ADMIN_TOKEN    -> a mesma "senha mestra" já usada pelo servidor de
#                     licenças, reaproveitada aqui para o painel
#                     administrativo da loja
#
# Para futuras atualizações do código deste servidor, basta rodar este
# workflow de novo (workflow_dispatch).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar o Worker (código + banco D1)
        working-directory: PROJETO/servidor-loja-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler@latest deploy

      - name: Configurar o segredo ADMIN_TOKEN no Worker
        working-directory: PROJETO/servidor-loja-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler@latest secret put ADMIN_TOKEN

      - name: Configurar o segredo STRIPE_SECRET_KEY no Worker
        working-directory: PROJETO/servidor-loja-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: printf '%s' "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler@latest secret put STRIPE_SECRET_KEY

      - name: Configurar o segredo STRIPE_WEBHOOK_SECRET no Worker
        # Fica vazio ate o webhook ser criado manualmente no Dashboard da
        # Stripe (passo obrigatoriamente manual — precisa da URL deste
        # Worker ja publicada). Enquanto vazio, a rota /webhook/stripe
        # responde 503 em vez de aceitar eventos nao verificados.
        working-directory: PROJETO/servidor-loja-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: printf '%s' "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler@latest secret put STRIPE_WEBHOOK_SECRET

      - name: Esperar o Worker propagar
        run: sleep 15

      - name: Descobrir a URL pública do Worker
        working-directory: PROJETO/servidor-loja-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler@latest deployments list | tail -20

      - name: Testar o servidor no ar (workers.dev)
        # URL confirmada no log do "wrangler deploy" (passo acima) na primeira
        # publicação: https://leuname-loja.emanuelantunes2024.workers.dev
        # Se a conta trocar de subdomínio workers.dev no futuro, atualize a
        # URL abaixo (e em SITE-LEUNAMESOFTWARE/js/api.js e admin/admin.js).
        run: curl -sS --fail "https://leuname-loja.emanuelantunes2024.workers.dev/health"

      # ---- TEMPORARIO: sobe a imagem real do LeuName Gestão (remover apos rodar) ----
      - name: TEMP — subir imagen de leuname-gestao
        working-directory: PROJETO/servidor-loja-cloudflare
        run: |
          curl -sS -X POST "https://leuname-loja.emanuelantunes2024.workers.dev/admin/productos/leuname-gestao/imagen" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: image/jpeg" \
            --data-binary @temp-upload-imagen.jpg
