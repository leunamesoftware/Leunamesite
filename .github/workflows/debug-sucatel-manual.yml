name: Debug Sucatel (manual, temporário)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Curl cru, sem parsing
        run: |
          echo "== estados (raw) =="
          curl -sS -i "https://sucatel-api.emanuelantunes2024.workers.dev/localizacao/estados"
          echo
          echo "== estados de novo, sem cache =="
          curl -sS -i -H "Cache-Control: no-cache" "https://sucatel-api.emanuelantunes2024.workers.dev/localizacao/estados?t=$(date +%s)"
