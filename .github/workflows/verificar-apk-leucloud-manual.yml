name: Verificar download do APK do LeuCloud (pontual)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar e confirmar o APK publicado
        run: |
          curl -sS --fail -o /tmp/leucloud.apk -w "codigo http: %{http_code}\ntipo: %{content_type}\n" \
            https://api.leunamesoftware.com/download/leucloud.apk
          echo "tamanho em bytes:"
          wc -c < /tmp/leucloud.apk
          echo "assinatura de arquivo ZIP/APK (primeiros bytes, esperado PK):"
          head -c 4 /tmp/leucloud.apk | od -c | head -1
