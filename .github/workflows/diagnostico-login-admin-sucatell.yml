name: Diagnóstico login admin Sucatell (temporário)

on:
  push:
    paths:
      - '.github/workflows/diagnostico-login-admin-sucatell.yml'

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Login direto na API
        run: |
          for e in leunamesoftware@gmail.com emanuelantunes2021@gmail.com; do
            echo "== $e"
            curl -sS -X POST https://sucatel-api.emanuelantunes2024.workers.dev/auth/login \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$e\",\"senha\":\"sucatell2582\"}" | head -c 300; echo
          done

      - name: Login pelo painel no navegador de verdade
        run: |
          npm i playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 400, height: 850 } });
            p.on('console', m => console.log('CONSOLE', m.type(), m.text()));
            p.on('pageerror', e => console.log('PAGEERROR', e.message));
            p.on('response', r => { if (r.url().includes('workers.dev')) console.log('API', r.status(), r.url()); });
            await p.goto('https://sucatell.leunamesoftware.com.br/admin.html', { waitUntil: 'networkidle' });
            await p.waitForTimeout(4000);
            console.log('LOGIN VISIVEL:', await p.isVisible('#lg-email'));
            await p.fill('#lg-email', 'leunamesoftware@gmail.com');
            await p.fill('#lg-senha', 'sucatell2582');
            await p.click('#lg-entrar');
            await p.waitForTimeout(6000);
            console.log('ERRO LOGIN:', await p.textContent('#lg-erro').catch(() => '?'));
            console.log('APP VISIVEL:', await p.isVisible('#app-view'));
            const txt = (await p.textContent('body')).replace(/\s+/g, ' ').slice(0, 1500);
            console.log('TEXTO:', txt);
            await b.close();
          })();
          EOF
          node t.js
