name: Deploy ConstruGestão (Cloudflare)

# Publica o app ConstruGestão (CONSTRUGESTAO/frontend/) como um Worker de
# "static assets" na Cloudflare -- mesmo padrão dos outros sites deste
# projeto. Usa o MESMO CF_API_TOKEN já usado pelos outros Workers.
#
# Roda sozinho quando algo dentro de CONSTRUGESTAO/frontend/ muda num
# push, ou pode ser disparado manual (workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches: [claude/leuname-github-setup-qwkedw]
    paths:
      - 'CONSTRUGESTAO/frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar o app (static assets)
        working-directory: CONSTRUGESTAO/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler@latest deploy

      - name: Esperar o Worker propagar
        run: sleep 15

      - name: Descobrir a URL pública do Worker
        working-directory: CONSTRUGESTAO/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler@latest deployments list | tail -20
