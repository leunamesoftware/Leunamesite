name: Diagnóstico Sucatell (temporário)

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Site ao vivo -- cabeçalhos e versão do index.html
        run: |
          curl -sSI "https://sucatell.leunamesoftware.com.br/" | grep -iE "^(HTTP|cache-control|etag|age|cf-cache-status|last-modified)" || true
          echo "--- tem a correção da tela de abertura? ---"
          curl -sS "https://sucatell.leunamesoftware.com.br/" | grep -c "esconderSplashIntro" || true
          echo "--- sw.js ---"
          curl -sS "https://sucatell.leunamesoftware.com.br/sw.js" | head -20 || true

      - name: APK publicado -- o que tem dentro
        run: |
          curl -sS -o sucatell.apk "https://api.leunamesoftware.com/download/sucatell.apk"
          ls -la sucatell.apk
          mkdir apk && cd apk && unzip -q ../sucatell.apk 'assets/*' || true
          echo "--- capacitor.config.json dentro do APK ---"
          cat assets/capacitor.config.json || true
          echo
          echo "--- index.html embutido tem a correção? ---"
          grep -c "esconderSplashIntro" assets/public/index.html || true

      - name: Abrir o site ao vivo num navegador de verdade (celular)
        run: |
          mkdir pw && cd pw && npm init -y > /dev/null && npm i playwright@1.56.1 > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > t.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({ ...devices['Pixel 7'] });
          const p = await ctx.newPage();
          p.on('console', m => console.log('console', m.type(), m.text()));
          p.on('pageerror', e => console.log('PAGEERROR', e.message));
          p.on('requestfailed', r => console.log('FALHOU', r.url(), r.failure()?.errorText));
          await p.goto('https://sucatell.leunamesoftware.com.br/', { waitUntil: 'load', timeout: 30000 });
          for (const s of [1, 3, 9]) {
            await p.waitForTimeout(s === 1 ? 1000 : s === 3 ? 2000 : 6000);
            console.log(`após ${s}s: splash existe?`, await p.locator('#intro-splash').count(), '| login visível?', await p.locator('#lg-email').isVisible().catch(() => false));
          }
          await p.screenshot({ path: 'loja.png' });
          await b.close();
          EOF
          node t.mjs

      - name: Guardar a captura
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: pw/loja.png
