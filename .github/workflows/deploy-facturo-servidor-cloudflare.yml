name: Deploy Servidor do Facturo (Cloudflare)

# Publica o Worker "facturo" (link de aprovação/assinatura do cliente) em
# https://facturo.leunamesoftware.com.br. Cria o banco D1 "facturo" na primeira
# vez, aplica as migrações e testa no ar. Requer o segredo CF_API_TOKEN.
on:
  workflow_dispatch:
  push:
    branches: [claude/leuname-github-setup-qwkedw]
    paths: ['FACTURO/servidor/**']

concurrency: deploy-facturo-servidor

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FACTURO/servidor
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências e conferir tipos
        run: |
          npm ci
          npx tsc --noEmit

      - name: Criar o banco D1 (só se não existir) e ligar ao Worker
        run: |
          ID="$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="facturo");process.stdout.write(d?d.uuid:"")')"
          if [ -z "$ID" ]; then
            npx wrangler d1 create facturo
            ID="$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));process.stdout.write(l.find(x=>x.name==="facturo").uuid)')"
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          grep database_id wrangler.toml

      - name: Aplicar migrações
        run: npx wrangler d1 migrations apply facturo --remote

      - name: Publicar o Worker
        run: npx wrangler deploy

      - name: Testar no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sS --fail https://facturo.leunamesoftware.com.br/saude; then exit 0; fi
            echo "Tentativa $i falhou, aguardando..."; sleep 20
          done
          exit 1
