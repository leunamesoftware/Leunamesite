name: Diagnóstico — velocidade do link do WhatsApp

# Mede quanto demora para abrir os links que vão no canal/grupo do WhatsApp
# (DNS, conexão, primeira resposta e total, com os redirecionamentos).
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diagnostico-link.yml']

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - name: Medir links
        run: |
          # Uma linha por endereço (o GitHub mostra no máximo 10 avisos por passo).
          medir() {
            L=""
            for i in 1 2 3; do
              R=$(curl -sS -L -o /dev/null --max-time 60 -A "Mozilla/5.0 (Linux; Android 14) WhatsApp" \
                -w "%{http_code} redir=%{num_redirects} 1ª-resposta=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}" "$1" 2>&1)
              L="$L [vez $i: $R]"
            done
            echo "::warning title=$1::$L"
          }
          medir "http://www.leunamesoftware.com.br/quantocobrar"
          medir "https://www.leunamesoftware.com.br/quantocobrar"
          medir "https://www.leunamesoftware.com.br/"
          medir "https://www.leunamesoftware.com.br/apps.json"
          medir "https://www.leunamesoftware.com.br/servicos.json"
          medir "https://www.leunamesoftware.com.br/quantocobrar/app/"
          medir "https://quantocobrar.leunamesoftware.com.br/"
          medir "http://leunamesoftware.com.br/quantocobrar"
          echo "::warning title=DNS e cabeçalhos::A: $(dig +short www.leunamesoftware.com.br | tr '\n' ' ') | AAAA: $(dig +short AAAA www.leunamesoftware.com.br | tr '\n' ' ') | $(curl -sSI http://www.leunamesoftware.com.br/quantocobrar | tr '\r\n' '  ' | head -c 700)"
