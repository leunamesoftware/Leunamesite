name: Revogar licenca manual

on:
  workflow_dispatch:
    inputs:
      chave:
        description: 'Chave a revogar (ex: LEU-XXXX-XXXX-XXXX)'
        required: true
      admin_token:
        description: 'ADMIN_TOKEN do servidor de licencas'
        required: true

jobs:
  revogar:
    runs-on: ubuntu-latest
    steps:
      - name: Revogar chave no servidor de licencas
        run: |
          curl -sS -X POST "https://api.leunamesoftware.com/admin/licencas/revogar" \
            -H "Authorization: Bearer ${{ inputs.admin_token }}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"chave\":\"${{ inputs.chave }}\"}"
