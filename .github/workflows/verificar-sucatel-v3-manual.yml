name: Verificar Sucatel v3 (manual, temporário)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar estados completos e cadastro de cidade/bairro proprio
        working-directory: PROJETO/servidor-sucatel-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -e
          BASE="https://sucatel-api.emanuelantunes2024.workers.dev"

          echo "== quantidade de estados =="
          curl -sS --fail "$BASE/localizacao/estados" -o estados.json
          N=$(python3 -c "import json;print(len(json.load(open('estados.json'))['estados']))")
          echo "estados: $N"
          if [ "$N" != "27" ]; then echo "FALHA: esperava 27 estados, veio $N"; exit 1; fi

          echo "== cadastrar cidade propria em SP =="
          curl -sS --fail -X POST "$BASE/localizacao/cidades" -H 'Content-Type: application/json' \
            -d '{"estado_id":"sp","nome":"Cidade Teste Automatizado"}' -o cidade_nova.json
          CIDADE_ID=$(python3 -c "import json;print(json.load(open('cidade_nova.json'))['cidade']['id'])")
          echo "cidade criada: $CIDADE_ID"

          echo "== cadastrar bairro proprio nessa cidade =="
          curl -sS --fail -X POST "$BASE/localizacao/bairros" -H 'Content-Type: application/json' \
            -d "{\"cidade_id\":\"$CIDADE_ID\",\"nome\":\"Bairro Teste Automatizado\"}" -o bairro_novo.json
          BAIRRO_ID=$(python3 -c "import json;print(json.load(open('bairro_novo.json'))['bairro']['id'])")
          echo "bairro criado: $BAIRRO_ID"

          echo "== confirmar que aparece na listagem da cidade =="
          curl -sS --fail "$BASE/localizacao/bairros?cidade_id=$CIDADE_ID" -o lista_bairros.json
          python3 -c "
          import json
          d = json.load(open('lista_bairros.json'))
          ids = [b['id'] for b in d['bairros']]
          assert '$BAIRRO_ID' in ids, ids
          print('OK')
          "

          echo "TUDO OK (v3)"

          echo "== limpeza =="
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM bairros WHERE id = '$BAIRRO_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM cidades WHERE id = '$CIDADE_ID'"
          echo "limpeza concluída"
