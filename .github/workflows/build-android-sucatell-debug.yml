name: Build Android APK Sucatell (teste, sem loja)

# Gera um .apk de teste do Sucatell (assinado com a chave de debug do
# Android -- sem precisar de keystore/secrets) e publica no link fixo:
# https://api.leunamesoftware.com/download/sucatell.apk
#
# Esse .apk ja pode ser instalado direto no celular pra testar, sem o
# "quadradinho" de abertura do navegador/PWA (esse app roda nativo).
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (necessário para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar o Android SDK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Instalar dependências do projeto Android
        working-directory: ANDROID/projeto-instalador-sucatell
        run: npm install

      - name: Criar o projeto Android nativo (Capacitor)
        working-directory: ANDROID/projeto-instalador-sucatell
        run: npx cap add android

      - name: Copiar o sistema para dentro do projeto Android
        working-directory: ANDROID/projeto-instalador-sucatell
        run: npx cap sync android

      - name: Numerar a versão do app (cada build fica maior que a anterior)
        working-directory: ANDROID/projeto-instalador-sucatell
        shell: bash
        run: |
          CODIGO=$(( $(date +%s) / 60 ))
          sed -i -E "s/versionCode [0-9]+/versionCode $CODIGO/; s/versionName \"[^\"]*\"/versionName \"1.2.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Aplicar o ícone oficial do Sucatell
        working-directory: ANDROID/projeto-instalador-sucatell
        shell: bash
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "icones-oficiais/$d/ic_launcher.png" "android/app/src/main/res/$d/ic_launcher.png"
            cp "icones-oficiais/$d/ic_launcher_round.png" "android/app/src/main/res/$d/ic_launcher_round.png"
            cp "icones-oficiais/$d/ic_launcher_foreground.png" "android/app/src/main/res/$d/ic_launcher_foreground.png"
          done
          cp "icones-oficiais/ic_launcher_background.xml" "android/app/src/main/res/values/ic_launcher_background.xml"

      - name: Deixar a tela de abertura (splash) com a cor da marca
        working-directory: ANDROID/projeto-instalador-sucatell
        shell: bash
        run: |
          cat > "android/app/src/main/res/values/colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorSplashBackground">#0d3b1f</color>
          </resources>
          EOF
          cat > "android/app/src/main/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <!-- Base application theme. -->
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <!-- Customize your theme here. -->
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@color/colorSplashBackground</item>
                  <item name="windowSplashScreenBackground">@color/colorSplashBackground</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          EOF

      - name: Dar permissão de execução ao Gradle
        working-directory: ANDROID/projeto-instalador-sucatell/android
        shell: bash
        run: chmod +x gradlew

      - name: Gerar o APK
        working-directory: ANDROID/projeto-instalador-sucatell/android
        shell: bash
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK final
        working-directory: ANDROID/projeto-instalador-sucatell
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/Sucatell.apk

      - name: Enviar o APK como Artifact do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Sucatell-Android-APK-teste
          path: ANDROID/projeto-instalador-sucatell/android/app/build/outputs/apk/debug/Sucatell.apk
          if-no-files-found: error

      - name: Configurar Node.js 22 (exigido pelo wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar o APK no link fixo de download
        working-directory: PROJETO/servidor-licencas-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx wrangler@latest r2 object put \
            leuname-downloads/sucatell.apk \
            --file ../../ANDROID/projeto-instalador-sucatell/android/app/build/outputs/apk/debug/Sucatell.apk \
            --content-type application/vnd.android.package-archive \
            --remote
