name: Verificar Sucatel de ponta a ponta (manual, temporário)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar API e fluxo completo (cadastro, anúncio, venda, chat)
        working-directory: PROJETO/servidor-sucatel-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -e
          BASE="https://sucatel-api.emanuelantunes2024.workers.dev"

          cat > sucatel_check.py <<'PY'
          import json, sys

          def carregar(caminho):
              return json.load(open(caminho))

          def navegar(dados, caminho):
              atual = dados
              for parte in caminho.split('.'):
                  atual = atual[int(parte)] if isinstance(atual, list) else atual[parte]
              return atual

          comando = sys.argv[1]
          if comando == 'extrair':
              print(navegar(carregar(sys.argv[2]), sys.argv[3]))
          elif comando == 'verificar':
              dados = carregar(sys.argv[2])
              atual = navegar(dados, sys.argv[3])
              esperado = {'__true__': True, '__false__': False}.get(sys.argv[4], sys.argv[4])
              if atual != esperado:
                  print('FALHA: campo', sys.argv[3], 'esperado', repr(esperado), 'obtido', repr(atual))
                  print('dados completos:', dados)
                  sys.exit(1)
              print('OK')
          elif comando == 'contem_id':
              dados = carregar(sys.argv[2])
              ids = [item['id'] for item in dados[sys.argv[3]]]
              if sys.argv[4] not in ids:
                  print('FALHA: id', sys.argv[4], 'nao encontrado em', ids)
                  sys.exit(1)
              print('OK')
          PY

          buscar_com_retry() {
            local url="$1" arquivo="$2" caminho="$3" tentativas=0 valor
            while [ "$tentativas" -lt 6 ]; do
              tentativas=$((tentativas+1))
              if curl -sS --fail "$url" -o "$arquivo" && valor=$(python3 sucatel_check.py extrair "$arquivo" "$caminho" 2>/dev/null); then
                echo "$valor"
                return 0
              fi
              echo "tentativa $tentativas falhou para $url, tentando de novo..." >&2
              sleep 2
            done
            echo "FALHA definitiva apos $tentativas tentativas: $url" >&2
            cat "$arquivo" >&2 || true
            return 1
          }

          echo "== health =="
          curl -sS --fail "$BASE/health"; echo

          ESTADO_ID=$(buscar_com_retry "$BASE/localizacao/estados" estados.json estados.0.id)
          CIDADE_ID=$(buscar_com_retry "$BASE/localizacao/cidades?estado_id=$ESTADO_ID" cidades.json cidades.0.id)
          BAIRRO_ID=$(buscar_com_retry "$BASE/localizacao/bairros?cidade_id=$CIDADE_ID" bairros.json bairros.0.id)

          MARCA_ID=$(buscar_com_retry "$BASE/categorias/marcas" marcas.json marcas.0.id)
          MODELO_ID=$(buscar_com_retry "$BASE/categorias/modelos?marca_id=$MARCA_ID" modelos.json modelos.0.id)
          TIPO_ID=$(buscar_com_retry "$BASE/categorias/tipos-peca" tipos.json tipos_peca.0.id)
          echo "bairro=$BAIRRO_ID marca=$MARCA_ID modelo=$MODELO_ID tipo=$TIPO_ID"

          EMAIL_V="teste-vendedor-$(date +%s)@sucatel-teste.com"
          curl -sS --fail -X POST "$BASE/auth/cadastro" -H 'Content-Type: application/json' \
            -d "{\"nome\":\"Vendedor Teste\",\"email\":\"$EMAIL_V\",\"senha\":\"senha123456\",\"bairro_id\":\"$BAIRRO_ID\"}" -o cadastro_v.json
          TOKEN_V=$(python3 sucatel_check.py extrair cadastro_v.json token)
          VENDEDOR_ID=$(python3 sucatel_check.py extrair cadastro_v.json usuario.id)

          EMAIL_C="teste-comprador-$(date +%s)@sucatel-teste.com"
          curl -sS --fail -X POST "$BASE/auth/cadastro" -H 'Content-Type: application/json' \
            -d "{\"nome\":\"Comprador Teste\",\"email\":\"$EMAIL_C\",\"senha\":\"senha123456\",\"bairro_id\":\"$BAIRRO_ID\"}" -o cadastro_c.json
          TOKEN_C=$(python3 sucatel_check.py extrair cadastro_c.json token)
          COMPRADOR_ID=$(python3 sucatel_check.py extrair cadastro_c.json usuario.id)
          echo "vendedor=$VENDEDOR_ID comprador=$COMPRADOR_ID"

          echo "== 1) anunciar fora do tema deve bloquear (sem gastar credito) =="
          curl -sS -X POST "$BASE/anuncios" -H "Authorization: Bearer $TOKEN_V" -H 'Content-Type: application/json' \
            -d "{\"marca_id\":\"$MARCA_ID\",\"modelo_id\":\"$MODELO_ID\",\"tipo_peca_id\":\"$TIPO_ID\",\"titulo\":\"Vendo uma cama de casal\",\"preco_centavos\":10000,\"bairro_id\":\"$BAIRRO_ID\"}" -o fora_tema.json
          python3 sucatel_check.py verificar fora_tema.json erro fora_do_tema
          echo "OK: bloqueado corretamente"

          echo "== 2) anunciar sem credito deve bloquear =="
          curl -sS -X POST "$BASE/anuncios" -H "Authorization: Bearer $TOKEN_V" -H 'Content-Type: application/json' \
            -d "{\"marca_id\":\"$MARCA_ID\",\"modelo_id\":\"$MODELO_ID\",\"tipo_peca_id\":\"$TIPO_ID\",\"titulo\":\"Placa teste automatizado\",\"preco_centavos\":10000,\"bairro_id\":\"$BAIRRO_ID\"}" -o sem_credito.json
          python3 sucatel_check.py verificar sem_credito.json erro sem_creditos
          echo "OK: bloqueado corretamente"

          echo "== 3) dar 2 creditos ao vendedor direto no banco (simula pagamento confirmado) =="
          npx wrangler@latest d1 execute sucatel --remote --command "UPDATE users SET saldo_creditos = 2 WHERE id = '$VENDEDOR_ID'"

          echo "== 4) anunciar com credito deve funcionar =="
          curl -sS --fail -X POST "$BASE/anuncios" -H "Authorization: Bearer $TOKEN_V" -H 'Content-Type: application/json' \
            -d "{\"marca_id\":\"$MARCA_ID\",\"modelo_id\":\"$MODELO_ID\",\"tipo_peca_id\":\"$TIPO_ID\",\"titulo\":\"Placa teste automatizado\",\"descricao\":\"anuncio de teste\",\"preco_centavos\":10000,\"bairro_id\":\"$BAIRRO_ID\"}" -o anuncio.json
          ANUNCIO_ID=$(python3 sucatel_check.py extrair anuncio.json anuncio.id)
          echo "anuncio criado: $ANUNCIO_ID"

          echo "== 5) o anuncio aparece na busca do bairro =="
          curl -sS --fail "$BASE/anuncios?bairro_id=$BAIRRO_ID" -o busca.json
          python3 sucatel_check.py contem_id busca.json anuncios "$ANUNCIO_ID"

          echo "== 6) marcar uma venda =="
          curl -sS --fail -X POST "$BASE/anuncios/$ANUNCIO_ID/vender" -H "Authorization: Bearer $TOKEN_V" -o venda.json
          cat venda.json

          echo "== 7) comprador inicia conversa e manda mensagem com telefone (deve ser bloqueada) =="
          curl -sS --fail -X POST "$BASE/conversas" -H "Authorization: Bearer $TOKEN_C" -H 'Content-Type: application/json' \
            -d "{\"anuncio_id\":\"$ANUNCIO_ID\"}" -o conversa.json
          CONVERSA_ID=$(python3 sucatel_check.py extrair conversa.json conversa.id)
          curl -sS --fail -X POST "$BASE/conversas/$CONVERSA_ID/mensagens" -H "Authorization: Bearer $TOKEN_C" -H 'Content-Type: application/json' \
            -d '{"texto":"Meu whatsapp é 21999998888, me chama"}' -o msg_bloqueada.json
          python3 sucatel_check.py verificar msg_bloqueada.json bloqueada __true__
          echo "OK: telefone/whatsapp bloqueado no chat"

          echo "== 8) mensagem normal deve passar =="
          curl -sS --fail -X POST "$BASE/conversas/$CONVERSA_ID/mensagens" -H "Authorization: Bearer $TOKEN_C" -H 'Content-Type: application/json' \
            -d '{"texto":"Ainda tem essa peça disponível?"}' -o msg_ok.json
          python3 sucatel_check.py verificar msg_ok.json bloqueada __false__
          echo "OK: mensagem normal passou"

          echo "== 9) vendedor renova anuncio (gasta o 2o credito) =="
          curl -sS --fail -X POST "$BASE/anuncios/$ANUNCIO_ID/renovar" -H "Authorization: Bearer $TOKEN_V" -o renovado.json
          cat renovado.json

          echo "TUDO OK" > "$GITHUB_WORKSPACE/RESULTADO_OK.txt"

          echo "== limpeza: apagar dados de teste =="
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM mensagens WHERE conversa_id = '$CONVERSA_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM conversas WHERE id = '$CONVERSA_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM vendas WHERE anuncio_id = '$ANUNCIO_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM anuncios WHERE vendedor_id = '$VENDEDOR_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM sessoes WHERE user_id = '$VENDEDOR_ID' OR user_id = '$COMPRADOR_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM users WHERE id = '$VENDEDOR_ID' OR id = '$COMPRADOR_ID'"
          echo "limpeza concluída"
