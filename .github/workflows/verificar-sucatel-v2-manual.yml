name: Verificar Sucatel v2 (manual, temporário)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar região, condição, meus dados, senha, avaliação e verificado
        working-directory: PROJETO/servidor-sucatel-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -e
          BASE="https://sucatel-api.emanuelantunes2024.workers.dev"

          cat > check.py <<'PY'
          import json, sys

          def carregar(caminho):
              return json.load(open(caminho))

          def navegar(dados, caminho):
              atual = dados
              for parte in caminho.split('.'):
                  atual = atual[int(parte)] if isinstance(atual, list) else atual[parte]
              return atual

          comando = sys.argv[1]
          if comando == 'extrair':
              print(navegar(carregar(sys.argv[2]), sys.argv[3]))
          elif comando == 'verificar':
              dados = carregar(sys.argv[2])
              atual = navegar(dados, sys.argv[3])
              bruto = sys.argv[4]
              if bruto in ('__true__', '__false__'):
                  esperado = bruto == '__true__'
              elif bruto.lstrip('-').isdigit():
                  esperado = int(bruto)
              else:
                  esperado = bruto
              if atual != esperado:
                  print('FALHA: campo', sys.argv[3], 'esperado', repr(esperado), 'obtido', repr(atual))
                  print('dados completos:', dados)
                  sys.exit(1)
              print('OK')
          elif comando == 'contem_id':
              dados = carregar(sys.argv[2])
              ids = [item['id'] for item in dados[sys.argv[3]]]
              if sys.argv[4] not in ids:
                  print('FALHA: id', sys.argv[4], 'nao encontrado em', ids)
                  sys.exit(1)
              print('OK')
          elif comando == 'nao_contem_id':
              dados = carregar(sys.argv[2])
              ids = [item['id'] for item in dados[sys.argv[3]]]
              if sys.argv[4] in ids:
                  print('FALHA: id', sys.argv[4], 'nao deveria estar em', ids)
                  sys.exit(1)
              print('OK')
          PY

          buscar_com_retry() {
            local url="$1" arquivo="$2" caminho="$3" tentativas=0 valor
            while [ "$tentativas" -lt 6 ]; do
              tentativas=$((tentativas+1))
              if curl -sS --fail "$url" -o "$arquivo" && valor=$(python3 check.py extrair "$arquivo" "$caminho" 2>/dev/null); then
                echo "$valor"
                return 0
              fi
              sleep 2
            done
            echo "FALHA definitiva: $url" >&2; cat "$arquivo" >&2 || true; return 1
          }

          echo "== health =="
          curl -sS --fail "$BASE/health"; echo

          MARCA_ID=$(buscar_com_retry "$BASE/categorias/marcas" marcas.json marcas.0.id)

          EMAIL_V="teste2-vendedor-$(date +%s)@sucatel-teste.com"
          curl -sS --fail -X POST "$BASE/auth/cadastro" -H 'Content-Type: application/json' \
            -d "{\"nome\":\"Vendedor Teste2\",\"email\":\"$EMAIL_V\",\"senha\":\"senha123456\",\"bairro_id\":\"xerem\"}" -o cadastro_v.json
          TOKEN_V=$(python3 check.py extrair cadastro_v.json token)
          VENDEDOR_ID=$(python3 check.py extrair cadastro_v.json usuario.id)
          python3 check.py verificar cadastro_v.json usuario.bairro_nome "Xerém"

          EMAIL_C="teste2-comprador-$(date +%s)@sucatel-teste.com"
          curl -sS --fail -X POST "$BASE/auth/cadastro" -H 'Content-Type: application/json' \
            -d "{\"nome\":\"Comprador Teste2\",\"email\":\"$EMAIL_C\",\"senha\":\"senha123456\",\"bairro_id\":\"xerem\"}" -o cadastro_c.json
          TOKEN_C=$(python3 check.py extrair cadastro_c.json token)
          COMPRADOR_ID=$(python3 check.py extrair cadastro_c.json usuario.id)
          echo "vendedor=$VENDEDOR_ID comprador=$COMPRADOR_ID"

          echo "== dar 3 creditos ao vendedor =="
          npx wrangler@latest d1 execute sucatel --remote --command "UPDATE users SET saldo_creditos = 3 WHERE id = '$VENDEDOR_ID'"

          echo "== 1) criar anuncio 'celular' sucata em Xerem =="
          curl -sS --fail "$BASE/categorias/modelos?marca_id=$MARCA_ID" -o modelos.json
          MODELO_ID=$(python3 check.py extrair modelos.json modelos.0.id)
          curl -sS --fail -X POST "$BASE/anuncios" -H "Authorization: Bearer $TOKEN_V" -H 'Content-Type: application/json' \
            -d "{\"marca_id\":\"$MARCA_ID\",\"modelo_id\":\"$MODELO_ID\",\"tipo_peca_id\":\"celular\",\"titulo\":\"Celular sucata teste automatizado\",\"preco_centavos\":5000,\"bairro_id\":\"xerem\",\"condicao\":\"sucata\"}" -o anuncio.json
          ANUNCIO_ID=$(python3 check.py extrair anuncio.json anuncio.id)
          python3 check.py verificar anuncio.json anuncio.condicao sucata
          echo "OK: anuncio criado com condicao sucata, id=$ANUNCIO_ID"

          echo "== 2) busca por regiao: santa-cruz-da-serra (perto de Xerem) deve ver o anuncio, com distancia =="
          curl -sS --fail "$BASE/anuncios?bairro_id=santa-cruz-da-serra&grupo=celular" -o busca_perto.json
          python3 check.py contem_id busca_perto.json anuncios "$ANUNCIO_ID"

          echo "== 3) busca por regiao: nova-iguacu (longe de Xerem) NAO deve ver o anuncio =="
          curl -sS --fail "$BASE/anuncios?bairro_id=centro-nova-iguacu&grupo=celular" -o busca_longe.json
          python3 check.py nao_contem_id busca_longe.json anuncios "$ANUNCIO_ID"

          echo "== 4) filtro de condicao: usado NAO deve trazer o anuncio (que e sucata) =="
          curl -sS --fail "$BASE/anuncios?bairro_id=xerem&condicao=usado" -o busca_usado.json
          python3 check.py nao_contem_id busca_usado.json anuncios "$ANUNCIO_ID"

          echo "== 5) editar meus dados (PATCH /auth/me) =="
          curl -sS --fail -X PATCH "$BASE/auth/me" -H "Authorization: Bearer $TOKEN_V" -H 'Content-Type: application/json' \
            -d '{"nome":"Vendedor Editado","telefone":"21999990000"}' -o me_editado.json
          python3 check.py verificar me_editado.json usuario.nome "Vendedor Editado"

          echo "== 6) trocar senha: senha atual errada deve falhar =="
          curl -sS -X POST "$BASE/auth/trocar-senha" -H "Authorization: Bearer $TOKEN_V" -H 'Content-Type: application/json' \
            -d '{"senha_atual":"errada123","nova_senha":"novaSenha123"}' -o senha_errada.json
          python3 check.py verificar senha_errada.json ok __false__

          echo "== 7) trocar senha certa e logar com a nova =="
          curl -sS --fail -X POST "$BASE/auth/trocar-senha" -H "Authorization: Bearer $TOKEN_V" -H 'Content-Type: application/json' \
            -d '{"senha_atual":"senha123456","nova_senha":"novaSenha123"}' -o senha_ok.json
          curl -sS --fail -X POST "$BASE/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL_V\",\"senha\":\"novaSenha123\"}" -o login_novo.json
          python3 check.py verificar login_novo.json ok __true__
          echo "OK: login com nova senha funcionou"

          echo "== 8) comprador conversa e avalia o vendedor =="
          curl -sS --fail -X POST "$BASE/conversas" -H "Authorization: Bearer $TOKEN_C" -H 'Content-Type: application/json' \
            -d "{\"anuncio_id\":\"$ANUNCIO_ID\"}" -o conversa.json
          CONVERSA_ID=$(python3 check.py extrair conversa.json conversa.id)
          curl -sS --fail -X POST "$BASE/conversas/$CONVERSA_ID/avaliar" -H "Authorization: Bearer $TOKEN_C" -H 'Content-Type: application/json' \
            -d '{"nota":5,"comentario":"Otimo vendedor, teste automatizado"}' -o avaliar.json
          python3 check.py verificar avaliar.json ok __true__

          echo "== 9) avaliar de novo deve falhar (ja_avaliado) =="
          curl -sS -X POST "$BASE/conversas/$CONVERSA_ID/avaliar" -H "Authorization: Bearer $TOKEN_C" -H 'Content-Type: application/json' \
            -d '{"nota":3}' -o avaliar2.json
          python3 check.py verificar avaliar2.json erro ja_avaliado

          echo "== 10) perfil publico do vendedor mostra a avaliacao =="
          curl -sS --fail "$BASE/usuarios/$VENDEDOR_ID/avaliacoes" -o avaliacoes.json
          python3 check.py verificar avaliacoes.json distribuicao.5 1

          echo "== 11) admin marca vendedor como verificado =="
          curl -sS --fail -X POST "$BASE/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"emanuelantunes2021@gmail.com","senha":"oLpkwuQHzNeUZl6R"}' -o login_admin.json
          TOKEN_ADMIN=$(python3 check.py extrair login_admin.json token)
          curl -sS --fail -X POST "$BASE/admin/usuarios/$VENDEDOR_ID/verificar" -H "Authorization: Bearer $TOKEN_ADMIN" -H 'Content-Type: application/json' \
            -d '{"verificado":true}' -o verificar_resp.json
          curl -sS --fail "$BASE/usuarios/$VENDEDOR_ID" -o perfil_pub.json
          python3 check.py verificar perfil_pub.json usuario.verificado __true__
          echo "OK: selo de verificado aplicado"

          echo "== 12) excluir conta do comprador (DELETE /auth/me) e confirmar sessao revogada =="
          curl -sS --fail -X DELETE "$BASE/auth/me" -H "Authorization: Bearer $TOKEN_C" -o /dev/null
          ME_APOS_EXCLUIR=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/auth/me" -H "Authorization: Bearer $TOKEN_C")
          if [ "$ME_APOS_EXCLUIR" != "401" ]; then echo "FALHA: esperava 401 apos excluir conta, recebeu $ME_APOS_EXCLUIR"; exit 1; fi
          echo "OK: conta do comprador excluida e sessao revogada"

          echo "TUDO OK (v2)" > "$GITHUB_WORKSPACE/RESULTADO_OK_V2.txt"

          echo "== limpeza =="
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM avaliacoes WHERE conversa_id = '$CONVERSA_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM mensagens WHERE conversa_id = '$CONVERSA_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM conversas WHERE id = '$CONVERSA_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM anuncios WHERE id = '$ANUNCIO_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM sessoes WHERE user_id = '$VENDEDOR_ID' OR user_id = '$COMPRADOR_ID'"
          npx wrangler@latest d1 execute sucatel --remote --command "DELETE FROM users WHERE id = '$VENDEDOR_ID' OR id = '$COMPRADOR_ID'"
          echo "limpeza concluída"
