name: Verificar painel admin do LeuCloud (pontual)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Cadastro de um usuario normal de teste (alvo das acoes)
        run: |
          curl -sS --fail -X POST https://api.leucloud.leunamesoftware.com.br/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"name":"Teste Admin Alvo","email":"teste-admin-alvo@leunamesoftware.com.br","password":"senhaDeTeste123","platform":"web","device_name":"CI"}' \
            -o /tmp/alvo.json
          cat /tmp/alvo.json
          python3 -c "import json;print(json.load(open('/tmp/alvo.json'))['user']['id'])"

      - name: Cadastro de uma conta que vai ser promovida a admin
        run: |
          curl -sS --fail -X POST https://api.leucloud.leunamesoftware.com.br/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"name":"Teste Admin","email":"teste-admin-painel@leunamesoftware.com.br","password":"senhaDeTeste123","platform":"web","device_name":"CI"}' \
            -o /tmp/admin.json
          cat /tmp/admin.json
          python3 -c "import json;print(json.load(open('/tmp/admin.json'))['user']['id'])"
