name: Deploy Site LeuName Softwares (Cloudflare)

# Publica o site estatico SITE-LEUNAMESOFTWARE/ como um Worker de
# "static assets" na Cloudflare. Usa o MESMO CF_API_TOKEN ja usado
# pelos outros dois Workers deste projeto (nenhuma permissao nova
# necessaria, pois "static assets" e so mais um tipo de Worker).
#
# Para futuras atualizacoes do site, basta rodar este workflow de novo
# (workflow_dispatch) — ou ele roda sozinho quando algo dentro de
# SITE-LEUNAMESOFTWARE/ muda num push.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'   # robô da CJ: todo dia ~2h da manhã (Brasília)
  push:
    branches: [claude/leuname-github-setup-qwkedw]
    paths:
      - 'SITE-LEUNAMESOFTWARE/**'
      - 'ferramentas-loja/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Robô da CJ (produtos da loja Europa)
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          # push = só republica (usa o catálogo salvo, não gasta a CJ); agenda/manual = busca tudo na CJ
          if [ "${{ github.event_name }}" = "push" ] && git fetch -q origin dados-cj 2>/dev/null; then
            git show FETCH_HEAD:catalogo-cj.json > SITE-LEUNAMESOFTWARE/catalogo-cj.json
            SO_MONTAR=1 python3 ferramentas-loja/cj_sync.py
          else
            python3 ferramentas-loja/cj_sync.py
          fi

      - name: Salvar catálogo da CJ no branch dados-cj (para o Claude ler)
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ -s SITE-LEUNAMESOFTWARE/catalogo-cj.json ]; then
            mkdir -p /tmp/dados && cp SITE-LEUNAMESOFTWARE/catalogo-cj.json /tmp/dados/
            cd /tmp/dados && git init -q && git checkout -q -b dados-cj
            git config user.name "robo-cj" && git config user.email "robo-cj@users.noreply.github.com"
            git add . && git commit -qm "catálogo CJ $(date -u +%F)"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-cj
          fi

      - name: Guardar catálogo da CJ (para o Claude traduzir)
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-cj
          path: SITE-LEUNAMESOFTWARE/catalogo-cj.json
          if-no-files-found: ignore

      - name: Publicar o site (static assets)
        working-directory: SITE-LEUNAMESOFTWARE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx wrangler@latest deploy > /tmp/dep.log 2>&1 || { echo "::error::DEPLOY: $(sed 's/\x1b\[[0-9;]*m//g' /tmp/dep.log | tail -c 900 | tr '\n' ' ')"; exit 1; }
          tail -3 /tmp/dep.log

      - name: Segredos no Worker (Stripe, CJ e senha do painel; só os que existem no GitHub)
        working-directory: SITE-LEUNAMESOFTWARE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          LOJA_ADMIN_SENHA: ${{ secrets.LOJA_ADMIN_SENHA }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
        run: |
          for nome in STRIPE_SECRET_KEY CJ_API_KEY LOJA_ADMIN_SENHA PAYPAL_CLIENT_ID PAYPAL_SECRET; do
            valor="${!nome}"
            if [ -n "$valor" ]; then
              printf '%s' "$valor" | npx wrangler@latest secret put "$nome"
            else
              echo "Sem $nome no GitHub."
            fi
          done

      - name: Esperar o Worker propagar
        run: sleep 15

      - name: Testar o site no ar (dominio proprio)
        # Desde que leunamesoftware.com foi ligado como dominio customizado,
        # a Cloudflare desativa por padrao o endereco antigo workers.dev
        # (por isso o teste mudou pra cima do dominio real).
        run: curl -sS --fail "https://leunamesoftware.com/index.html" > /dev/null
