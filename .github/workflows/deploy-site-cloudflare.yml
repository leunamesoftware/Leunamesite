name: Deploy Site LeuName Softwares (Cloudflare)

# Publica o site estatico SITE-LEUNAMESOFTWARE/ como um Worker de
# "static assets" na Cloudflare. Usa o MESMO CF_API_TOKEN ja usado
# pelos outros dois Workers deste projeto (nenhuma permissao nova
# necessaria, pois "static assets" e so mais um tipo de Worker).
#
# Para futuras atualizacoes do site, basta rodar este workflow de novo
# (workflow_dispatch) — ou ele roda sozinho quando algo dentro de
# SITE-LEUNAMESOFTWARE/ muda num push.
on:
  workflow_dispatch:
  push:
    branches: [claude/leuname-github-setup-qwkedw]
    paths:
      - 'SITE-LEUNAMESOFTWARE/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar o site (static assets)
        working-directory: SITE-LEUNAMESOFTWARE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler@latest deploy

      - name: Esperar o Worker propagar
        run: sleep 15

      - name: Testar o site no ar (workers.dev)
        # URL confirmada apos o primeiro deploy (ver log do passo acima).
        # Se a conta trocar de subdominio workers.dev no futuro, atualize
        # aqui e nas referencias a SITE_URL do servidor da loja.
        run: curl -sS --fail "https://leuname-site.emanuelantunes2024.workers.dev/index.html" > /dev/null

      - name: TEMP - investigar duplicacao do botao Comprar na demo
        run: |
          npm i -D playwright@1.48.0
          npx playwright install --with-deps chromium
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('https://leuname-site.emanuelantunes2024.workers.dev/demo.html?id=leuname-gestao&nocache=' + Date.now(), { waitUntil: 'networkidle' });
            await page.waitForTimeout(600);
            const ctaBox = await page.\$eval('.demo-cta', el => { const r = el.getBoundingClientRect(); return r.top + window.scrollY; });
            await page.evaluate((y) => window.scrollTo(0, y - 200), ctaBox);
            await page.waitForTimeout(700);
            const info = await page.evaluate(() => {
              const sticky = document.getElementById('demoSticky');
              const cta = document.querySelector('.demo-cta');
              return {
                stickyVisible: sticky ? sticky.classList.contains('is-visible') : null,
                stickyRect: sticky ? sticky.getBoundingClientRect() : null,
                ctaRect: cta ? cta.getBoundingClientRect() : null,
              };
            });
            console.log('info:', JSON.stringify(info));
            await page.screenshot({ path: 'sticky-check.png' });
            await browser.close();
          })();
          "
      - name: TEMP - upload screenshot da checagem
        uses: actions/upload-artifact@v4
        with:
          name: sticky-check
          path: sticky-check.png
