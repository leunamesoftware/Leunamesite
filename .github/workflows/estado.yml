name: Estado da loja (segredos e pagamento)
on: workflow_dispatch
jobs:
  estado:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Conferir (sem mostrar nenhuma chave)
        env:
          S1: ${{ secrets.STRIPE_SECRET_KEY }}
          S2: ${{ secrets.CJ_API_KEY }}
          S3: ${{ secrets.LOJA_ADMIN_SENHA }}
          S4: ${{ secrets.PAYPAL_CLIENT_ID }}
          S5: ${{ secrets.PAYPAL_SECRET }}
        run: |
          tem() { [ -n "$1" ] && echo true || echo false; }
          tipo="nenhum"; case "$S1" in sk_live_*) tipo=live;; sk_test_*) tipo=teste;; rk_live_*) tipo=restrita_live;; "") tipo=nenhum;; *) tipo=formato_desconhecido;; esac
          cfg=$(curl -s https://pets.leuname.com/api/config || echo erro)
          home=$(curl -s -o /dev/null -w '%{http_code}' https://pets.leuname.com/ || echo erro)
          prod=$(curl -s https://pets.leuname.com/produtos.json | head -c 200 | tr -d '\n' || echo erro)
          pagar=$(curl -s -X POST https://pets.leuname.com/api/pagar -H 'Content-Type: application/json' -d '{"lang":"es","itens":[{"id":"1642036884023021568","q":1}]}' | sed 's#cs_live_[A-Za-z0-9_]*#cs_live_OK#g' | head -c 400)
          mkdir -p /tmp/e
          # painel: login com a senha (não aparece), busca e detalhe na CJ
          tk=$(jq -nc --arg s "$S3" '{senha:$s}' | curl -s -X POST https://pets.leuname.com/api/painel/login -H 'Content-Type: application/json' -d @- | jq -r '.token // empty')
          if [ -n "$tk" ]; then
            echo "login ok" > /tmp/e/painel.txt
            curl -s https://pets.leuname.com/api/painel/estado -H "Authorization: Bearer $tk" >> /tmp/e/painel.txt; echo >> /tmp/e/painel.txt
            curl -s "https://pets.leuname.com/api/painel/buscar?q=cat%20scratcher" -H "Authorization: Bearer $tk" | jq -c '{n:(.itens|length),erro,detalhe,primeiros:[.itens[:3][]|{pid,nome,custoUsd,popularidade}]}' >> /tmp/e/painel.txt
            pid=$(curl -s "https://pets.leuname.com/api/painel/buscar?q=dog%20leash" -H "Authorization: Bearer $tk" | jq -r '.itens[0].pid // empty')
            curl -s "https://pets.leuname.com/api/painel/detalhe?pid=$pid" -H "Authorization: Bearer $tk" | jq -c 'del(.descricaoEn,.imagens)' >> /tmp/e/painel.txt
            echo "video:" >> /tmp/e/painel.txt
            curl -s -X POST https://pets.leuname.com/api/painel/video -H "Authorization: Bearer $tk" -H 'Content-Type: application/json' -d '{"id":"2090701323421270017"}' >> /tmp/e/painel.txt; echo >> /tmp/e/painel.txt
            curl -s -o /dev/null -w 'mp4 http=%{http_code} bytes=%{size_download} tipo=%{content_type}\n' https://pets.leuname.com/v/2090701323421270017.mp4 >> /tmp/e/painel.txt
            curl -s -o /dev/null -w 'range http=%{http_code}\n' -H 'Range: bytes=0-999' https://pets.leuname.com/v/2090701323421270017.mp4 >> /tmp/e/painel.txt
            curl -s -o /dev/null -w 'apk http=%{http_code} bytes=%{size_download}\n' https://pets.leuname.com/painel/app.apk >> /tmp/e/painel.txt
            echo "pedidos:" >> /tmp/e/painel.txt
            curl -s "https://pets.leuname.com/api/painel/pedidos" -H "Authorization: Bearer $tk" | jq -c '{n:((.pedidos // [])|length),erro,detalhe,lojas:[(.pedidos // [])[]|.loja],paises:[(.pedidos // [])[]|.endereco.pais]}' >> /tmp/e/painel.txt || true
            echo "lojas:" >> /tmp/e/painel.txt
            curl -s "https://pets.leuname.com/api/painel/lojas" -H "Authorization: Bearer $tk" | jq -c '[.lojas[]|{id,host,publicados}]' >> /tmp/e/painel.txt
            curl -s "https://pets.leuname.com/api/painel/buscar?q=kitchen%20gadgets&loja=casa" -H "Authorization: Bearer $tk" | jq -c '{n:(.itens|length),erro}' >> /tmp/e/painel.txt
            echo "casa:" >> /tmp/e/painel.txt
            for u in / /carrito.html /producto.html /tema.css /loja.js /produtos.json /robots.txt /img/favicon.png; do
              curl -s -L -o /tmp/e/x -w "$u http=%{http_code} final=%{url_effective} bytes=%{size_download}\n" "https://cachik.leuname.com$u" >> /tmp/e/painel.txt
            done
            curl -s https://cachik.leuname.com/ | grep -o '<title>[^<]*' >> /tmp/e/painel.txt || true
            curl -s https://pets.leuname.com/ | grep -o '<title>[^<]*' >> /tmp/e/painel.txt || true
            curl -s -I https://casa.leuname.com/ | grep -i 'content-security\|x-frame' >> /tmp/e/painel.txt || true
            curl -s -X POST https://pets.leuname.com/api/painel/sair -H "Authorization: Bearer $tk" > /dev/null
          else
            jq -nc --arg s "$S3" '{senha:$s}' | curl -s -X POST https://pets.leuname.com/api/painel/login -H 'Content-Type: application/json' -d @- > /tmp/e/painel.txt
          fi
          cd /tmp/e
          echo "$pagar" > pagar.txt
          printf '{"stripe":%s,"stripe_tipo":"%s","cj":%s,"admin_senha":%s,"api_config":%s,"home_http":"%s","produtos_inicio":%s,"paypal_id":%s,"paypal_secret":%s}\n' \
            "$(tem "$S1")" "$tipo" "$(tem "$S2")" "$(tem "$S3")" "$(echo "$cfg" | grep -q stripe && echo "$cfg" || echo '"erro"')" "$home" "$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1]))' "$prod")" "$(tem "$S4")" "$(tem "$S5")" > estado.json
          cat estado.json
          git init -q && git checkout -q -b dados-estado && git config user.name robo && git config user.email robo@users.noreply.github.com
          git add . && git commit -qm estado && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-estado
