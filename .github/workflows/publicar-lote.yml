name: Publicar lote de produtos (painel)
on:
  workflow_dispatch:
    inputs:
      loja:
        description: 'Loja (pets ou casa)'
        default: 'casa'
      publicar:
        description: 'sim = publicar lote; barato = produtos bem baratos; tirar-caros = tira acima de 20 €; reprecificar; nao = só fotos'
        default: 'sim'
jobs:
  lote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        if: ${{ github.event.inputs.publicar != 'nao' }}
        env:
          LOJA_ADMIN_SENHA: ${{ secrets.LOJA_ADMIN_SENHA }}
        run: |
          cd ferramentas-loja
          case "${{ github.event.inputs.publicar }}" in
            reprecificar|barato|tirar-caros) python3 publicar_lote.py "${{ github.event.inputs.loja }}" "${{ github.event.inputs.publicar }}" ;;
            *) python3 publicar_lote.py "${{ github.event.inputs.loja }}" ;;
          esac
          cp lote.json /tmp/
      - name: Fotos da loja (celular e computador)
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium > /dev/null
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          host = {'casa': 'cachik.leuname.com', 'pets': 'pets.leuname.com'}["${{ github.event.inputs.loja }}"]
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              for w, h, n in [(412, 900, 'celular'), (1366, 800, 'computador')]:
                  p = b.new_page(viewport={'width': w, 'height': h})
                  p.goto('https://' + host + '/', wait_until='networkidle'); p.wait_for_timeout(3000)
                  p.evaluate("var c=document.getElementById('cookies'); if(c) c.hidden=true")
                  p.screenshot(path=f'/tmp/{n}.png', full_page=True)
                  p.close()
              b.close()
          PY
      - name: Guardar no branch dados-lote
        run: |
          mkdir -p /tmp/s && cp /tmp/*.png /tmp/s/ && (cp /tmp/lote.json /tmp/s/ 2>/dev/null || true)
          cd /tmp/s && git init -q && git checkout -q -b dados-lote
          git config user.name robo && git config user.email robo@users.noreply.github.com
          git add . && git commit -qm lote && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-lote
