name: Gerar AAB e APK do Radar Preventivo

# Gera o Android App Bundle (.aab) assinado do Radar Preventivo para enviar à Play Store.
# O app abre o Radar hospedado na Cloudflare (server.url), então atualizações do
# sistema chegam sem precisar publicar um AAB novo.
#
# Chave de assinatura:
# - Se o segredo RADAR_KEYSTORE_B64 existir, usa essa chave (atualizações).
# - Se não existir, reaproveita a chave entregue no primeiro instalador (artefato da execução
#   36627345065, disponível até 29/10/2026) e a entrega de novo junto com este.
# - Sem nenhuma das duas, PARA com um aviso. Só gera uma chave nova se "chave_nova" for marcado
#   ao rodar (uma chave diferente impede atualizar o app já instalado e o da Play Store).
# O APK também é publicado no site: /baixar.html → /baixar/RadarPreventivo.apk.
# PROVISÓRIO neste repositório até o repositório próprio do Radar existir.
on:
  workflow_dispatch:
    inputs:
      chave_nova:
        description: 'Gerar uma chave de assinatura NOVA (só se ainda não existe nenhuma)'
        type: boolean
        default: false

jobs:
  aab:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: RADAR-PREVENTIVO/app-android
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar o Android SDK (API 36)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Instalar dependências e criar o projeto Android (Capacitor)
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Aplicar o ícone oficial do Radar Preventivo
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp icones/$d/*.png "android/app/src/main/res/$d/"
          done
          cp icones/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
          # Ícone adaptável (fundo e símbolo em camadas) e a imagem da abertura.
          for d in mipmap-anydpi-v26 drawable; do
            mkdir -p "android/app/src/main/res/$d"
            cp icones/$d/* "android/app/src/main/res/$d/"
          done

      - name: Abertura com o fundo do app (sem a tela branca padrão)
        run: |
          python3 - <<'PY'
          import pathlib, re
          res = pathlib.Path("android/app/src/main/res")
          (res / "values/radar_cores.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="radar_fundo">#041640</color>\n</resources>\n',
              encoding="utf-8")
          estilos = res / "values/styles.xml"
          t = estilos.read_text(encoding="utf-8")
          # Abertura do sistema (Android 12+) e a tela até a página carregar são iguais:
          # o azul do app com o símbolo (288dp de área, o símbolo ocupa 46% = ~132dp).
          # Os atributos "android:" valem para a abertura do próprio Android 12+ (sem eles
          # aparece uma tela cinza vazia antes); os sem prefixo, para a biblioteca de abertura.
          novo = ('<item name="android:background">@drawable/radar_abertura_tela</item>\n'
                  '        <item name="android:windowBackground">@drawable/radar_abertura_tela</item>\n'
                  '        <item name="android:windowSplashScreenBackground">@color/radar_fundo</item>\n'
                  '        <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>\n'
                  '        <item name="windowSplashScreenBackground">@color/radar_fundo</item>\n'
                  '        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>')
          t, n = re.subn(r'<item name="android:background">@drawable/splash</item>', novo, t)
          assert n == 1, "tema de abertura do Capacitor não encontrado:\n" + t
          # Depois da abertura o Capacitor troca para o tema AppTheme.NoActionBar, cujo fundo
          # padrão é cinza (tela vazia até a página carregar). O fundo dele vira a mesma abertura.
          t, n = re.subn(r'(<style name="AppTheme\.NoActionBar"[^>]*>)',
                         r'\1\n        <item name="android:windowBackground">@drawable/radar_abertura_tela</item>', t)
          assert n == 1, "tema AppTheme.NoActionBar não encontrado:\n" + t
          estilos.write_text(t, encoding="utf-8")
          print(t)
          PY

      - name: Conferir os recursos Android (antes de assinar)
        working-directory: RADAR-PREVENTIVO/app-android/android
        run: |
          chmod +x gradlew
          ./gradlew :app:processReleaseResources --no-daemon

      - name: Recuperar a chave do primeiro instalador (se os segredos ainda não existem)
        if: ${{ !inputs.chave_nova }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: RadarPreventivo-Play-Store
          run-id: 36627345065
          github-token: ${{ github.token }}
          path: RADAR-PREVENTIVO/app-android/chave-anterior

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.RADAR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SALVA: ${{ secrets.RADAR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SALVA: ${{ secrets.RADAR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SALVA" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SALVA" >> "$GITHUB_ENV"
            echo "CHAVE_NOVA=nao" >> "$GITHUB_ENV"
            echo "Usando a chave já guardada nos segredos."
          elif [ "${{ inputs.chave_nova }}" != "true" ] && [ -f chave-anterior/RadarPreventivo-chave-assinatura.keystore ]; then
            SENHA="$(sed -n 's/^Senha do keystore: //p' chave-anterior/LEIA-ISSO-chave-de-assinatura.txt | tr -d '\r')"
            echo "::add-mask::$SENHA"
            test -n "$SENHA"
            cp chave-anterior/RadarPreventivo-chave-assinatura.keystore android/app/release.keystore
            echo "KEYSTORE_PASSWORD=$SENHA" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SENHA" >> "$GITHUB_ENV"
            echo "CHAVE_NOVA=reaproveitada" >> "$GITHUB_ENV"
            echo "Usando a mesma chave do primeiro instalador (segredos ainda não cadastrados)."
          elif [ "${{ inputs.chave_nova }}" != "true" ]; then
            echo "::error::Faltam os segredos RADAR_KEYSTORE_B64, RADAR_KEYSTORE_PASSWORD e RADAR_KEY_PASSWORD. Cadastre-os com os dados do arquivo LEIA-ISSO-chave-de-assinatura.txt (Settings -> Secrets and variables -> Actions). Sem eles, o app gerado teria outra chave e não poderia atualizar o já instalado nem o da Play Store."
            exit 1
          else
            # Formato PKCS12: a senha da chave é obrigatoriamente a mesma do arquivo.
            KEYSTORE_PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -v -keystore android/app/release.keystore -alias radarpreventivo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Radar Preventivo, OU=Radar Preventivo, O=Radar Preventivo, L=Brasil, S=Brasil, C=BR"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "CHAVE_NOVA=sim" >> "$GITHUB_ENV"
            echo "Chave nova gerada (primeira vez)."
          fi

      - name: Configurar versão e assinatura no build.gradle
        run: |
          python3 - <<'PY'
          import re
          props = dict(l.strip().split("=", 1) for l in open("versao-release.properties", encoding="utf-8") if "=" in l and not l.lstrip().startswith("#"))
          caminho = "android/app/build.gradle"
          t = open(caminho, encoding="utf-8").read()
          t = re.sub(r"versionCode\s+\d+", f"versionCode {props['versionCode']}", t, count=1)
          t = re.sub(r'versionName\s+"[^"]*"', f'versionName "{props["versionName"]}"', t, count=1)
          assinatura = (
              "    signingConfigs {\n"
              "        release {\n"
              "            storeFile file('release.keystore')\n"
              "            storePassword System.getenv('KEYSTORE_PASSWORD')\n"
              "            keyAlias 'radarpreventivo'\n"
              "            keyPassword System.getenv('KEY_PASSWORD')\n"
              "        }\n"
              "    }\n"
          )
          assert "    buildTypes {" in t, "buildTypes não encontrado"
          t = t.replace("    buildTypes {", assinatura + "    buildTypes {", 1)
          t, n = re.subn(r"(buildTypes \{\s*release \{)", r"\1\n            signingConfig signingConfigs.release", t, count=1)
          assert n == 1, "bloco release não encontrado"
          open(caminho, "w", encoding="utf-8").write(t)
          print("versão", props["versionCode"], props["versionName"], "e assinatura aplicadas")
          PY
          grep -nE "versionCode|versionName|targetSdk|signingConfig" android/app/build.gradle android/variables.gradle || true

      - name: Gerar o AAB (Play Store) e o APK (instalar direto no celular), mesma chave
        working-directory: RADAR-PREVENTIVO/app-android/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Conferir a assinatura do AAB
        run: jarsigner -verify -verbose:summary android/app/build/outputs/bundle/release/app-release.aab | tail -3

      - name: Preparar a entrega
        run: |
          mkdir -p entrega
          cp android/app/build/outputs/bundle/release/app-release.aab entrega/RadarPreventivo.aab
          cp android/app/build/outputs/apk/release/app-release.apk entrega/RadarPreventivo-instalar-no-celular.apk
          if [ "$CHAVE_NOVA" = "reaproveitada" ]; then
            # Entrega a chave de novo, para ela não sumir quando o primeiro artefato expirar.
            cp chave-anterior/RadarPreventivo-chave-assinatura.keystore chave-anterior/LEIA-ISSO-chave-de-assinatura.txt entrega/
          fi
          rm -rf chave-anterior
          if [ "$CHAVE_NOVA" = "sim" ]; then
            cp android/app/release.keystore entrega/RadarPreventivo-chave-assinatura.keystore
            {
              echo "CHAVE DE ASSINATURA -- Radar Preventivo"
              echo
              echo "GUARDE ESTE ARQUIVO E O .keystore EM PELO MENOS 2 LUGARES SEGUROS."
              echo "Toda atualização do app na Play Store precisa desta mesma chave."
              echo
              echo "Alias: radarpreventivo"
              echo "Senha do keystore: $KEYSTORE_PASSWORD"
              echo "Senha da chave: $KEY_PASSWORD"
              echo
              echo "Para as próximas versões saírem automáticas, cadastre no GitHub"
              echo "(Settings -> Secrets and variables -> Actions):"
              echo "  RADAR_KEYSTORE_PASSWORD = senha do keystore acima"
              echo "  RADAR_KEY_PASSWORD      = senha da chave acima"
              echo "  RADAR_KEYSTORE_B64      = o conteúdo abaixo (uma linha só):"
              echo
              base64 -w0 android/app/release.keystore
              echo
            } > entrega/LEIA-ISSO-chave-de-assinatura.txt
          fi
          ls -la entrega

      - name: Publicar o APK no site (link de download)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx --yes wrangler@4 r2 object put radar-preventivo-downloads/RadarPreventivo.apk \
            --file entrega/RadarPreventivo-instalar-no-celular.apk \
            --content-type application/vnd.android.package-archive --remote
          echo "Link: https://radar-preventivo.emanuelantunes2024.workers.dev/baixar.html"

      - name: Enviar para download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RadarPreventivo-Play-Store
          path: RADAR-PREVENTIVO/app-android/entrega/
          if-no-files-found: error
          retention-days: 30
