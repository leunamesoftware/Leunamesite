name: Verificar site Web do EconoRota (pontual)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar que o site responde e carrega o app Flutter
        run: |
          curl -sS --fail -o /tmp/index.html -w "codigo http: %{http_code}\n" https://econorota.pages.dev/
          grep -q "flutter" /tmp/index.html && echo "OK: pagina carrega o bootstrap do Flutter"
          curl -sS --fail -o /dev/null -w "manifest.json codigo: %{http_code}\n" https://econorota.pages.dev/manifest.json
