name: Verificar LeuCloud ponta a ponta (pontual)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Site do app responde
        run: curl -sS --fail -o /dev/null -w "site: %{http_code}\n" https://leucloud.leunamesoftware.com.br/

      - name: API responde (health)
        run: curl -sS --fail https://api.leucloud.leunamesoftware.com.br/health

      - name: Cadastro real de um usuario de teste
        run: |
          curl -sS --fail -X POST https://api.leucloud.leunamesoftware.com.br/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"name":"Teste Verificacao","email":"teste-verificacao-e2e@leunamesoftware.com.br","password":"senhaDeTeste123","platform":"web","device_name":"CI"}' \
            -o /tmp/signup.json
          cat /tmp/signup.json

      - name: Login com o usuario de teste
        run: |
          curl -sS --fail -X POST https://api.leucloud.leunamesoftware.com.br/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"teste-verificacao-e2e@leunamesoftware.com.br","password":"senhaDeTeste123","platform":"web","device_name":"CI"}' \
            -o /tmp/login.json
          cat /tmp/login.json
          python3 -c "import json;print(json.load(open('/tmp/login.json'))['session_token'])" > /tmp/token.txt

      - name: Criar uma pasta de teste
        run: |
          TOKEN=$(cat /tmp/token.txt)
          curl -sS --fail -X POST https://api.leucloud.leunamesoftware.com.br/folders \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"Pasta de teste CI"}'

      - name: Listar raiz (deve mostrar a pasta criada)
        run: |
          TOKEN=$(cat /tmp/token.txt)
          curl -sS --fail https://api.leucloud.leunamesoftware.com.br/folders/root -H "Authorization: Bearer $TOKEN"

      - name: Upload real de um arquivo pequeno
        run: |
          TOKEN=$(cat /tmp/token.txt)
          echo "conteudo de teste do LeuCloud" > /tmp/arquivo-teste.txt
          curl -sS --fail -X POST https://api.leucloud.leunamesoftware.com.br/files/upload \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-File-Name: arquivo-teste.txt" \
            -H "Content-Type: text/plain" \
            --data-binary @/tmp/arquivo-teste.txt \
            -o /tmp/upload.json
          cat /tmp/upload.json
          python3 -c "import json;print(json.load(open('/tmp/upload.json'))['file']['id'])" > /tmp/file_id.txt

      - name: Baixar o arquivo de volta e conferir conteudo
        run: |
          TOKEN=$(cat /tmp/token.txt)
          FILE_ID=$(cat /tmp/file_id.txt)
          curl -sS --fail https://api.leucloud.leunamesoftware.com.br/files/$FILE_ID/download -H "Authorization: Bearer $TOKEN" -o /tmp/baixado.txt
          diff /tmp/arquivo-teste.txt /tmp/baixado.txt && echo "OK: baixou identico ao que foi enviado"

      - name: Conferir que o storage_used_bytes do usuario aumentou
        run: |
          TOKEN=$(cat /tmp/token.txt)
          curl -sS --fail https://api.leucloud.leunamesoftware.com.br/me -H "Authorization: Bearer $TOKEN"

      - name: Excluir o arquivo (lixeira) e depois de vez (limpeza do teste)
        run: |
          TOKEN=$(cat /tmp/token.txt)
          FILE_ID=$(cat /tmp/file_id.txt)
          curl -sS --fail -X DELETE https://api.leucloud.leunamesoftware.com.br/files/$FILE_ID -H "Authorization: Bearer $TOKEN"
          curl -sS --fail -X DELETE https://api.leucloud.leunamesoftware.com.br/trash/file/$FILE_ID -H "Authorization: Bearer $TOKEN"

      - name: Logout (revoga a sessao de teste)
        run: |
          TOKEN=$(cat /tmp/token.txt)
          curl -sS --fail -X POST https://api.leucloud.leunamesoftware.com.br/auth/logout -H "Authorization: Bearer $TOKEN"
