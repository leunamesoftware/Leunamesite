name: Deploy Site LeuName Softwares BR (Cloudflare)

# Publica o site estatico SITE-LEUNAMESOFTWARE-BR/ (versao em portugues
# do Brasil) como um Worker de "static assets" na Cloudflare, separado do
# site em espanhol (SITE-LEUNAMESOFTWARE/). Usa o MESMO CF_API_TOKEN ja
# usado pelos outros Workers deste projeto.
#
# Para futuras atualizacoes deste site, roda sozinho quando algo dentro de
# SITE-LEUNAMESOFTWARE-BR/ muda num push, ou pode ser disparado manual
# (workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches: [claude/leuname-github-setup-qwkedw]
    paths:
      - 'SITE-LEUNAMESOFTWARE-BR/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar o site (static assets)
        working-directory: SITE-LEUNAMESOFTWARE-BR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler@latest deploy

      - name: Esperar o Worker propagar
        run: sleep 15

      - name: Testar o site no ar (dominio proprio)
        # Desde que leunamesoftware.com.br foi ligado como dominio
        # customizado, a Cloudflare desativa por padrao o endereco
        # workers.dev antigo (por isso o teste mudou pra cima do dominio real).
        run: curl -sS --fail "https://leunamesoftware.com.br/index.html" > /dev/null
