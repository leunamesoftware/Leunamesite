name: Diagnóstico links dos painéis (temporário)
on:
  push:
    paths:
      - '.github/workflows/diagnostico-links-paineis.yml'
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            https://sucatell.leunamesoftware.com.br/ \
            https://sucatell.leunamesoftware.com.br/admin.html \
            https://api.leunamesoftware.com/download/sucatell.apk \
            https://api.leunamesoftware.com/download/sucatell-admin.apk \
            https://leucloud.leunamesoftware.com.br/ \
            https://leucloud.leunamesoftware.com.br/admin.html \
            https://econorota.pages.dev/ \
            https://econorota-api.emanuelantunes2024.workers.dev/health \
            https://leunamesoftware.com.br/admin/login.html \
            https://leunamesoftware.com.br/admin-licencas/login.html \
            https://leunamesoftware.com/admin-licencas/login.html \
            https://gestao.leunamesoftware.com.br/ \
            https://construgestao.leunamesoftware.com.br/ ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 -I "$u" || echo ERR)
            [ "$code" = "405" ] && code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "$u")
            echo "$code $u"
          done
