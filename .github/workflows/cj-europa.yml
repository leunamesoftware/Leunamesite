name: CJ — armazéns na Europa (sondagem)
on: workflow_dispatch
jobs:
  europa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sondar DE/PL
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          cd ferramentas-loja && python3 cj_europa.py
          mkdir -p /tmp/d && cp europa.json /tmp/d/ && cd /tmp/d && git init -q && git checkout -q -b dados-cj-europa
          git config user.name robo-cj && git config user.email robo-cj@users.noreply.github.com
          git add . && git commit -qm europa && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-cj-europa
