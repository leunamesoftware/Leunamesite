name: Verificar API do EconoRota (pontual)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      API: https://econorota-api.emanuelantunes2024.workers.dev
    steps:
      - name: GET /health
        run: curl -sS --fail "$API/health"

      - name: GET /auth/config
        run: curl -sS --fail "$API/auth/config"

      - name: Cadastrar conta cliente de teste e confirmar sessao
        run: |
          curl -sS --fail -X POST "$API/auth/register" -H "Content-Type: application/json" \
            -d '{"name":"Teste EconoRota","email":"teste-econorota@leunamesoftware.com.br","password":"senhaDeTeste123","role":"cliente","accept_terms":true}' \
            -o /tmp/registro.json
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/registro.json'))['token'])")
          USER_ID=$(python3 -c "import json;print(json.load(open('/tmp/registro.json'))['user']['id'])")
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "USER_ID=$USER_ID" >> "$GITHUB_ENV"
          echo "USER_ID=$USER_ID"

      - name: GET /auth/me com o token da conta de teste
        run: |
          curl -sS --fail "$API/auth/me" -H "Authorization: Bearer $TOKEN" -o /tmp/me.json
          python3 -c "import json; d=json.load(open('/tmp/me.json')); assert d['user']['email']=='teste-econorota@leunamesoftware.com.br'; print('OK: /auth/me confirma a conta cadastrada')"

      - name: Login de novo com a mesma conta
        run: |
          curl -sS --fail -X POST "$API/auth/login" -H "Content-Type: application/json" \
            -d '{"email":"teste-econorota@leunamesoftware.com.br","password":"senhaDeTeste123"}' -o /tmp/login.json
          python3 -c "import json; d=json.load(open('/tmp/login.json')); assert d.get('token'); print('OK: login funciona')"

      - name: Confirma que senha errada e rejeitada
        run: |
          CODIGO=$(curl -sS -o /tmp/senha_errada.json -w "%{http_code}" -X POST "$API/auth/login" -H "Content-Type: application/json" \
            -d '{"email":"teste-econorota@leunamesoftware.com.br","password":"senhaErrada"}')
          test "$CODIGO" = "401" && echo "OK: senha errada rejeitada (401)"

      - name: Imprimir ID de teste para limpeza manual no D1
        run: echo "USER_ID=$USER_ID"
