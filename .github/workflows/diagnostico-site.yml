name: Diagnóstico — site antigo na página inicial
on:
  workflow_dispatch:
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.leunamesoftware.com.br
          H=$(curl -sS "$B/")
          echo "::warning title=pagina::$(echo "$H" | grep -o '<title>[^<]*' | head -1) | css=$(echo "$H" | grep -o 'href="[^"]*css[^"]*"' | head -3 | tr '\n' ' ') | bytes=$(echo -n "$H" | wc -c)"
          for p in /css/style.css /js/main.js /js/products.js /assets/img/logo-mark.png /manifest.webmanifest; do
            R=$(curl -sS -o /tmp/r -w "%{http_code} %{content_type} %{size_download}" "$B$p")
            echo "::warning title=$p::$R | $(head -c 90 /tmp/r | tr '\n\r' '  ' | tr -cd '[:print:] ')"
          done
