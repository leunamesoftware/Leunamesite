name: Diagnóstico — site antigo na página inicial
on:
  workflow_dispatch:
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.leunamesoftware.com.br
          H=$(curl -sS "$B/")
          echo "::warning title=pagina::$(echo "$H" | grep -o '<title>[^<]*' | head -1) | css=$(echo "$H" | grep -o 'href="[^"]*css[^"]*"' | head -3 | tr '\n' ' ') | bytes=$(echo -n "$H" | wc -c)"
          # Compra do site pronto abre o pagamento? (cria só um pedido "aguardando", sem cobrar nada)
          R=$(curl -sS -o /tmp/c -w "%{http_code}" -X POST "$B/loja-api/comprar" -H "Content-Type: application/json" -H "Origin: $B" -H "Referer: $B/loja/comprar" --data '{"nome":"Teste Diagnostico","email":"leunamesoftware@gmail.com","plano":"tpl_agencia"}')
          echo "::warning title=compra-template::$R | $(head -c 160 /tmp/c | tr -cd '[:print:] ')"
          for p in '/loja-api/template/licenca?chave=LEU-X&dominio=teste.com.br' '/loja-api/template/baixar?p=0' '/loja/comprar?app=tpl_agencia&plano=unico' /img/modelos/agencia-de-viagens-banner.webp /modelos/agencia-de-viagens/ /robots.txt /sitemap.xml /curso.html /cursos.json /img/destaques/gestacell-v5.webp /apps /instalar/gestacell /js/catalogo.js '/loja/comprar?app=gestacell&plano=mensal' /quantocobrar; do
            R=$(curl -sS -o /tmp/r -w "%{http_code} %{content_type} %{size_download}" "$B$p")
            echo "::warning title=$p::$R | $(head -c 90 /tmp/r | tr '\n\r' '  ' | tr -cd '[:print:] ')"
          done
