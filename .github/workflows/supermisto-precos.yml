name: ERP Supermisto (Precificador) — testar e publicar

# Código no repositório leuname-softwarea-apps, pasta supermisto-precos/.
#   Worker "supermisto-precos" → erp.supermistotemperos.com.br (e precos.…)
#   R2 supermisto-erp (fotos dos produtos, criado sozinho) · segredos SHOPEE_PARTNER_ID/KEY (quando existirem)
#   D1 supermisto_precos (criado sozinho na primeira vez) + Workers AI (lê os prints)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch do código'
        default: 'ccr-f58cd13b-ml0bzs'
  push:
    paths: ['.github/workflows/supermisto-precos.yml']

concurrency: supermisto-precos

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    defaults:
      run:
        working-directory: app/supermisto-precos
    steps:
      - uses: actions/checkout@v4
        with:
          repository: leunamesoftware/leuname-softwarea-apps
          ref: ${{ github.event.inputs.ref || 'ccr-f58cd13b-ml0bzs' }}
          path: app
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Testes
        run: npm test
      - name: Conta da Cloudflare
        run: |
          CONTA=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          echo "::add-mask::$CONTA"
          echo "CLOUDFLARE_ACCOUNT_ID=$CONTA" >> "$GITHUB_ENV"
      - name: Banco (cria na primeira vez)
        run: |
          ID=$(npx -y wrangler@4 d1 list --json | jq -r '.[] | select(.name=="supermisto_precos") | .uuid')
          if [ -z "$ID" ]; then
            npx -y wrangler@4 d1 create supermisto_precos >/dev/null
            ID=$(npx -y wrangler@4 d1 list --json | jq -r '.[] | select(.name=="supermisto_precos") | .uuid')
          fi
          [ -n "$ID" ] || { echo "::error::Não consegui criar o banco D1"; exit 1; }
          sed -i "s/ID_DO_BANCO/$ID/" wrangler.toml
      - name: Fotos (cria o armazenamento e sobe as fotos da Shopee na primeira vez)
        run: |
          npx -y wrangler@4 r2 bucket list | grep -q 'supermisto-erp' || npx -y wrangler@4 r2 bucket create supermisto-erp
          if ! npx -y wrangler@4 r2 object get supermisto-erp/.semeado --remote --pipe >/dev/null 2>&1; then
            for f in ../entregas/super-misto/shopee/fotos/*.jpg; do
              npx -y wrangler@4 r2 object put "supermisto-erp/$(basename "$f")" --file "$f" --content-type image/jpeg --remote >/dev/null
            done
            echo ok > /tmp/semeado && npx -y wrangler@4 r2 object put supermisto-erp/.semeado --file /tmp/semeado --remote >/dev/null
            echo "::notice::Fotos dos produtos enviadas"
          fi
      - name: Publicar
        run: |
          npx -y wrangler@4 d1 migrations apply supermisto_precos --remote
          npx -y wrangler@4 deploy
      - name: Ligação com a Shopee (só quando o cadastro existir)
        env:
          PID: ${{ secrets.SHOPEE_PARTNER_ID }}
          PKEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
        run: |
          if [ -n "$PID" ] && [ -n "$PKEY" ]; then
            echo "$PID" | npx -y wrangler@4 secret put SHOPEE_PARTNER_ID >/dev/null
            echo "$PKEY" | npx -y wrangler@4 secret put SHOPEE_PARTNER_KEY >/dev/null
            echo "::notice::Credenciais da Shopee instaladas"
          else
            echo "::notice::Sem cadastro na Shopee Open Platform ainda (segredos SHOPEE_PARTNER_ID e SHOPEE_PARTNER_KEY)"
          fi
      - name: Testar a leitura de um print
        run: |
          T=$(openssl rand -hex 24)
          echo "$T" | npx -y wrangler@4 secret put TESTE_IA >/dev/null
          sleep 10
          python3 - <<'PY'
          import base64, json
          u = 'data:image/jpeg;base64,' + base64.b64encode(open('test/imagens/print-exemplo.jpg','rb').read()).decode()
          json.dump({'imagem': u}, open('/tmp/corpo.json','w'))
          PY
          R=$(curl -s -X POST -H "X-Teste: $T" -H "Content-Type: application/json" -d @/tmp/corpo.json https://precos.supermistotemperos.com.br/api/teste-ia)
          echo "::notice::Leitura: $(echo "$R" | head -c 700)"
          npx -y wrangler@4 secret delete TESTE_IA --force >/dev/null || true
      - name: Conferir no ar
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://precos.supermistotemperos.com.br/api/saude; then echo; break; fi
            sleep 10
          done
          echo "::notice::Precificador: $(curl -s -o /dev/null -w '%{http_code}' https://precos.supermistotemperos.com.br/) em https://precos.supermistotemperos.com.br"
          for i in $(seq 1 12); do curl -fsS https://erp.supermistotemperos.com.br/api/saude && break; sleep 10; done
          echo "::notice::ERP: $(curl -s -o /dev/null -w '%{http_code}' https://erp.supermistotemperos.com.br/) em https://erp.supermistotemperos.com.br"
