name: LeuApps — publicar vitrine

# Publica a vitrine LeuApps (código em leuname-softwarea-apps, pasta leuapps/)
# em https://apps.leunamesoftware.com.br
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch do LeuApps'
        default: 'ccr-f58cd13b-ml0bzs'
  push:
    paths: ['.github/workflows/leuapps-publicar.yml']

concurrency: leuapps-publicar

env:
  REF: ${{ github.event.inputs.ref || 'ccr-f58cd13b-ml0bzs' }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    defaults:
      run:
        working-directory: app/leuapps
    steps:
      - uses: actions/checkout@v4
        with:
          repository: leunamesoftware/leuname-softwarea-apps
          ref: ${{ env.REF }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conta da Cloudflare
        run: |
          CONTA=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          echo "::add-mask::$CONTA"
          echo "CLOUDFLARE_ACCOUNT_ID=$CONTA" >> "$GITHUB_ENV"
      - name: Soltar os endereços principais do site antigo
        # O LeuApps assume leunamesoftware.com.br e www; o site antigo continua respondendo
        # por dentro do LeuApps (ligação SITE_ANTIGO) para painel, licenças e páginas antigas.
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$H" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            | jq -r '.result[] | select((.hostname=="leunamesoftware.com.br" or .hostname=="www.leunamesoftware.com.br") and .service!="leuapps") | .id' \
            | while read -r ID; do
                curl -fsS -X DELETE -H "$H" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$ID" >/dev/null && echo "solto: $ID"
              done
      - name: Publicar
        run: npx --yes wrangler@4 deploy
      - name: Conferir no ar
        run: |
          for i in $(seq 30); do curl -fsS -o /dev/null https://www.leunamesoftware.com.br/apps.json && break; sleep 10; done
          for u in https://www.leunamesoftware.com.br/ https://www.leunamesoftware.com.br/apps.json https://www.leunamesoftware.com.br/admin-licencas/login.html https://www.leunamesoftware.com.br/sobre-nosotros.html https://www.leunamesoftware.com.br/site-antigo https://apps.leunamesoftware.com.br/ https://leunamesoftware.com.br/; do
            echo "::notice::$u → $(curl -s -o /dev/null -w '%{http_code}' "$u" || true) $(curl -sI "$u" | grep -i '^x-leuapps' | tr -d '\r' || true)"
          done
