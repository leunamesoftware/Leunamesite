name: Verificar rota de avatar do LeuCloud (pontual)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Avatar de usuario sem foto deve dar 404 organizado, nao 500
        run: |
          curl -sS -o /tmp/resp.json -w "codigo: %{http_code}\n" https://api.leucloud.leunamesoftware.com.br/avatar/313ef5c4-2505-4766-9847-2f42dc39fe91
          cat /tmp/resp.json
