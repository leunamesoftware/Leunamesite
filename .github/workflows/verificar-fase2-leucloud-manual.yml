name: Verificar Fase 2 do LeuCloud (pontual)

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      API: https://api.leucloud.leunamesoftware.com.br
    steps:
      - name: Cadastrar conta A (dona) e conta B (destinataria)
        run: |
          curl -sS --fail -X POST "$API/auth/signup" -H "Content-Type: application/json" \
            -d '{"name":"Teste Fase2 A","email":"teste-fase2-a@leunamesoftware.com.br","password":"senhaDeTeste123","platform":"web","device_name":"CI"}' \
            -o /tmp/a.json
          curl -sS --fail -X POST "$API/auth/signup" -H "Content-Type: application/json" \
            -d '{"name":"Teste Fase2 B","email":"teste-fase2-b@leunamesoftware.com.br","password":"senhaDeTeste123","platform":"web","device_name":"CI"}' \
            -o /tmp/b.json
          TOKEN_A=$(python3 -c "import json;print(json.load(open('/tmp/a.json'))['session_token'])")
          USER_A=$(python3 -c "import json;print(json.load(open('/tmp/a.json'))['user']['id'])")
          TOKEN_B=$(python3 -c "import json;print(json.load(open('/tmp/b.json'))['session_token'])")
          USER_B=$(python3 -c "import json;print(json.load(open('/tmp/b.json'))['user']['id'])")
          echo "TOKEN_A=$TOKEN_A" >> "$GITHUB_ENV"
          echo "USER_A=$USER_A" >> "$GITHUB_ENV"
          echo "TOKEN_B=$TOKEN_B" >> "$GITHUB_ENV"
          echo "USER_B=$USER_B" >> "$GITHUB_ENV"

      - name: Upload de um arquivo e criacao de uma pasta (conta A)
        run: |
          echo "conteudo de teste fase 2" > /tmp/arquivo.txt
          curl -sS --fail -X POST "$API/files/upload" \
            -H "Authorization: Bearer $TOKEN_A" -H "X-File-Name: relatorio.txt" -H "Content-Type: text/plain" \
            --data-binary @/tmp/arquivo.txt -o /tmp/upload.json
          FILE_ID=$(python3 -c "import json;print(json.load(open('/tmp/upload.json'))['file']['id'])")
          curl -sS --fail -X POST "$API/folders" -H "Authorization: Bearer $TOKEN_A" -H "Content-Type: application/json" \
            -d '{"name":"Pasta Compartilhada Teste"}' -o /tmp/pasta.json
          FOLDER_ID=$(python3 -c "import json;print(json.load(open('/tmp/pasta.json'))['folder']['id'])")
          echo "FILE_ID=$FILE_ID" >> "$GITHUB_ENV"
          echo "FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"

      - name: Favoritar arquivo e confirmar em GET /favoritos
        run: |
          curl -sS --fail -X PATCH "$API/files/$FILE_ID" -H "Authorization: Bearer $TOKEN_A" -H "Content-Type: application/json" \
            -d '{"favorite":true}'
          curl -sS --fail "$API/favoritos" -H "Authorization: Bearer $TOKEN_A" -o /tmp/favoritos.json
          python3 -c "import json; d=json.load(open('/tmp/favoritos.json')); assert any(f['id']=='$FILE_ID' for f in d['files']), 'arquivo favoritado nao apareceu em /favoritos'; print('OK: favoritos')"

      - name: Buscar pelo nome do arquivo em GET /busca
        run: |
          curl -sS --fail "$API/busca?q=relatorio" -H "Authorization: Bearer $TOKEN_A" -o /tmp/busca.json
          python3 -c "import json; d=json.load(open('/tmp/busca.json')); assert any(f['id']=='$FILE_ID' for f in d['files']), 'busca nao encontrou o arquivo'; print('OK: busca')"

      - name: Criar album, adicionar o arquivo e confirmar em GET /albuns/:id
        run: |
          curl -sS --fail -X POST "$API/albuns" -H "Authorization: Bearer $TOKEN_A" -H "Content-Type: application/json" \
            -d '{"name":"Album de Teste"}' -o /tmp/album.json
          ALBUM_ID=$(python3 -c "import json;print(json.load(open('/tmp/album.json'))['album']['id'])")
          curl -sS --fail -X POST "$API/albuns/$ALBUM_ID/itens" -H "Authorization: Bearer $TOKEN_A" -H "Content-Type: application/json" \
            -d "{\"file_id\":\"$FILE_ID\"}"
          curl -sS --fail "$API/albuns/$ALBUM_ID" -H "Authorization: Bearer $TOKEN_A" -o /tmp/album_detalhe.json
          python3 -c "import json; d=json.load(open('/tmp/album_detalhe.json')); assert any(f['id']=='$FILE_ID' for f in d['files']), 'arquivo nao apareceu no album'; print('OK: albuns')"
          echo "ALBUM_ID=$ALBUM_ID" >> "$GITHUB_ENV"

      - name: Criar link publico sem senha e baixar sem autenticacao
        run: |
          curl -sS --fail -X POST "$API/shares" -H "Authorization: Bearer $TOKEN_A" -H "Content-Type: application/json" \
            -d "{\"file_id\":\"$FILE_ID\"}" -o /tmp/share1.json
          TOKEN_LINK=$(python3 -c "import json;print(json.load(open('/tmp/share1.json'))['share']['token'])")
          SHARE_ID=$(python3 -c "import json;print(json.load(open('/tmp/share1.json'))['share']['id'])")
          curl -sS --fail "$API/s/$TOKEN_LINK" -o /tmp/share1_meta.json
          python3 -c "import json; d=json.load(open('/tmp/share1_meta.json')); assert d['requer_senha'] == False, 'link sem senha nao devia exigir senha'; print('OK: metadata do link publico')"
          curl -sS --fail "$API/s/$TOKEN_LINK/download" -o /tmp/baixado_sem_senha.txt
          diff /tmp/arquivo.txt /tmp/baixado_sem_senha.txt && echo "OK: download publico sem senha bateu com o conteudo original"
          echo "SHARE_ID=$SHARE_ID" >> "$GITHUB_ENV"
          echo "TOKEN_LINK=$TOKEN_LINK" >> "$GITHUB_ENV"

      - name: Criar link publico com senha e confirmar que senha errada e rejeitada
        run: |
          curl -sS --fail -X POST "$API/shares" -H "Authorization: Bearer $TOKEN_A" -H "Content-Type: application/json" \
            -d "{\"file_id\":\"$FILE_ID\",\"password\":\"segredo123\"}" -o /tmp/share2.json
          TOKEN_LINK2=$(python3 -c "import json;print(json.load(open('/tmp/share2.json'))['share']['token'])")
          CODIGO_ERRADO=$(curl -sS -o /tmp/senha_errada.json -w "%{http_code}" "$API/s/$TOKEN_LINK2/download?password=errada")
          test "$CODIGO_ERRADO" = "401" && echo "OK: senha errada rejeitada (401)"
          CODIGO_CERTO=$(curl -sS -o /tmp/baixado_com_senha.txt -w "%{http_code}" "$API/s/$TOKEN_LINK2/download?password=segredo123")
          test "$CODIGO_CERTO" = "200" && echo "OK: senha certa aceita (200)"
          diff /tmp/arquivo.txt /tmp/baixado_com_senha.txt && echo "OK: conteudo do download com senha bateu"

      - name: Revogar o primeiro link e confirmar que fica invalido
        run: |
          curl -sS --fail -X DELETE "$API/shares/$SHARE_ID" -H "Authorization: Bearer $TOKEN_A"
          CODIGO=$(curl -sS -o /tmp/revogado.json -w "%{http_code}" "$API/s/$TOKEN_LINK")
          test "$CODIGO" = "404" && echo "OK: link revogado retorna 404"

      - name: Compartilhar pasta direto com a conta B e acessar como B
        run: |
          curl -sS --fail -X POST "$API/compartilhar-com" -H "Authorization: Bearer $TOKEN_A" -H "Content-Type: application/json" \
            -d "{\"folder_id\":\"$FOLDER_ID\",\"email\":\"teste-fase2-b@leunamesoftware.com.br\"}"
          curl -sS --fail "$API/folders/$FOLDER_ID" -H "Authorization: Bearer $TOKEN_B" -o /tmp/pasta_como_b.json
          python3 -c "import json; d=json.load(open('/tmp/pasta_como_b.json')); assert d.get('compartilhada_por_outro') == True, 'pasta compartilhada nao marcou compartilhada_por_outro'; print('OK: conta B conseguiu listar a pasta compartilhada de A')"
          curl -sS --fail "$API/compartilhado-comigo" -H "Authorization: Bearer $TOKEN_B" -o /tmp/comigo.json
          python3 -c "import json; d=json.load(open('/tmp/comigo.json')); assert any(it['folder_id']=='$FOLDER_ID' for it in d['itens']), 'pasta nao apareceu em /compartilhado-comigo da conta B'; print('OK: /compartilhado-comigo (B)')"
          curl -sS --fail "$API/compartilhado-por-mim" -H "Authorization: Bearer $TOKEN_A" -o /tmp/pormim.json
          SR_ID=$(python3 -c "import json; d=json.load(open('/tmp/pormim.json')); row=next(it for it in d['itens'] if it['folder_id']=='$FOLDER_ID'); print(row['id'])")
          echo "OK: /compartilhado-por-mim (A), SR_ID=$SR_ID"
          echo "SR_ID=$SR_ID" >> "$GITHUB_ENV"

      - name: Confirmar que conta C (sem convite) NAO consegue ver a pasta de A
        run: |
          curl -sS --fail -X POST "$API/auth/signup" -H "Content-Type: application/json" \
            -d '{"name":"Teste Fase2 C","email":"teste-fase2-c@leunamesoftware.com.br","password":"senhaDeTeste123","platform":"web","device_name":"CI"}' \
            -o /tmp/c.json
          TOKEN_C=$(python3 -c "import json;print(json.load(open('/tmp/c.json'))['session_token'])")
          USER_C=$(python3 -c "import json;print(json.load(open('/tmp/c.json'))['user']['id'])")
          echo "USER_C=$USER_C" >> "$GITHUB_ENV"
          CODIGO=$(curl -sS -o /tmp/negado.json -w "%{http_code}" "$API/folders/$FOLDER_ID" -H "Authorization: Bearer $TOKEN_C")
          test "$CODIGO" = "404" && echo "OK: conta sem convite recebe 404 na pasta compartilhada de outra conta"

      - name: Revogar o compartilhamento direto e confirmar que B perde o acesso
        run: |
          curl -sS --fail -X DELETE "$API/compartilhado/$SR_ID" -H "Authorization: Bearer $TOKEN_A"
          CODIGO=$(curl -sS -o /tmp/sem_acesso.json -w "%{http_code}" "$API/folders/$FOLDER_ID" -H "Authorization: Bearer $TOKEN_B")
          test "$CODIGO" = "404" && echo "OK: acesso revogado, conta B nao acessa mais"

      - name: Imprimir IDs de teste para limpeza manual no D1
        run: |
          echo "USER_A=$USER_A"
          echo "USER_B=$USER_B"
          echo "USER_C=$USER_C"
