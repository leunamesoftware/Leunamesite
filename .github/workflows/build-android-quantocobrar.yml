name: Build Android APK Quanto Cobrar

# Gera o .apk do Quanto Cobrar (Capacitor, abre o app publicado em
# quantocobrar.leunamesoftware.com.br) e publica no link fixo:
# https://api.leunamesoftware.com/download/quantocobrar.apk
# Abre sem a tela preta do navegador; abertura e barras do Android na cor do app.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ANDROID/projeto-instalador-quantocobrar/**'
      - '.github/workflows/build-android-quantocobrar.yml'

concurrency: build-android-quantocobrar

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Projeto Android (Capacitor)
        working-directory: ANDROID/projeto-instalador-quantocobrar
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Ícones, cores da abertura e das barras
        working-directory: ANDROID/projeto-instalador-quantocobrar
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp icones-oficiais/$d/*.png android/app/src/main/res/$d/
          done
          cp icones-oficiais/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/res/values/styles.xml'); s = p.read_text()
          app = ('<item name="android:statusBarColor">#E8590C</item>'
                 '<item name="android:navigationBarColor">#FFF8F1</item>'
                 '<item name="android:windowLightNavigationBar">true</item>'
                 '<item name="android:windowBackground">@color/fundo_app</item>')
          abre = ('<item name="windowSplashScreenBackground">#E8590C</item>'
                  '<item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>'
                  '<item name="android:statusBarColor">#E8590C</item>'
                  '<item name="android:navigationBarColor">#E8590C</item>')
          s = re.sub(r'(<style name="AppTheme.NoActionBar"[^>]*>)', r'\1' + app, s)
          s = re.sub(r'(<style name="AppTheme.NoActionBarLaunch"[^>]*>)', r'\1' + abre, s)
          s = s.replace('</resources>', '<color name="fundo_app">#FFF8F1</color></resources>')
          p.write_text(s)
          g = pathlib.Path('android/app/build.gradle'); t = g.read_text()
          v = dict(l.split('=', 1) for l in pathlib.Path('versao-release.properties').read_text().splitlines() if '=' in l and not l.startswith('#'))
          t = re.sub(r'versionCode \d+', 'versionCode ' + v['versionCode'].strip(), t)
          t = re.sub(r'versionName "[^"]*"', 'versionName "' + v['versionName'].strip() + '"', t)
          g.write_text(t)
          print(s)
          EOF

      - name: Gerar o APK
        working-directory: ANDROID/projeto-instalador-quantocobrar/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/QuantoCobrar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuantoCobrar-APK
          path: ANDROID/projeto-instalador-quantocobrar/android/app/build/outputs/apk/debug/QuantoCobrar.apk
          if-no-files-found: error

      - name: Publicar no link fixo de download
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          CONTA=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          echo "::add-mask::$CONTA"
          export CLOUDFLARE_ACCOUNT_ID=$CONTA
          npx --yes wrangler@4 r2 object put leuname-downloads/quantocobrar.apk \
            --file ANDROID/projeto-instalador-quantocobrar/android/app/build/outputs/apk/debug/QuantoCobrar.apk \
            --content-type application/vnd.android.package-archive --remote
          echo "### APK publicado: https://api.leunamesoftware.com/download/quantocobrar.apk" >> "$GITHUB_STEP_SUMMARY"
