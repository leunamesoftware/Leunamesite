name: Lista dos produtos das lojas (para conferir)
on: workflow_dispatch
jobs:
  lista:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          pip install -q pillow
          mkdir -p /tmp/l && cd /tmp/l
          for h in pets.leuname.com cachik.leuname.com; do
            curl -s "https://$h/produtos.json" > "$h.json"
            curl -s "https://$h/google-shopping.xml" > "$h-feed.xml"
          done
          cat > folha.py <<'PY'
          import json, sys, io, urllib.request
          from PIL import Image, ImageDraw
          for h in ['pets.leuname.com', 'cachik.leuname.com']:
              d = json.load(open(h + '.json'))
              cols, w = 6, 220
              rows = (len(d) + cols - 1) // cols
              folha = Image.new('RGB', (cols * w, rows * (w + 40)), 'white')
              dr = ImageDraw.Draw(folha)
              for i, p in enumerate(d):
                  x, y = (i % cols) * w, (i // cols) * (w + 40)
                  try:
                      req = urllib.request.Request(p['imagenes'][0], headers={'User-Agent': 'Mozilla/5.0'})
                      im = Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=20).read())).convert('RGB')
                      im.thumbnail((w - 10, w - 10)); folha.paste(im, (x + 5, y + 5))
                  except Exception as e:
                      dr.text((x + 10, y + 100), 'sem foto', fill='red')
                  dr.text((x + 5, y + w + 2), f"{i+1}. {p['es']['nombre'][:30]}", fill='black')
                  dr.text((x + 5, y + w + 18), f"{p['categoria']} | {p.get('animal','')} | {p['precio']}", fill='gray')
              folha.save(h + '-fotos.jpg', quality=80)
          PY
          sed -i 's/^          //' folha.py
          python3 folha.py
          git init -q && git checkout -q -b dados-produtos && git config user.name robo && git config user.email robo@users.noreply.github.com
          git add . && git commit -qm produtos && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-produtos
