name: Lista dos produtos das lojas (para conferir)
on: workflow_dispatch
jobs:
  lista:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pillow
          mkdir -p /tmp/l
          for h in pets.leuname.com cachik.leuname.com; do
            curl -s "https://$h/produtos.json" > "/tmp/l/$h.json"
            curl -s "https://$h/google-shopping.xml" > "/tmp/l/$h-feed.xml"
            python3 ferramentas-loja/folha_fotos.py "/tmp/l/$h.json" "/tmp/l/$h-fotos.jpg" "https://$h" || echo "::warning::folha $h falhou"
          done
          cd /tmp/l
          git init -q && git checkout -q -b dados-produtos && git config user.name robo && git config user.email robo@users.noreply.github.com
          git add . && git commit -qm produtos && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-produtos
