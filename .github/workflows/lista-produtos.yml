name: Lista dos produtos das lojas (para conferir)
on: workflow_dispatch
jobs:
  lista:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          mkdir -p /tmp/l && cd /tmp/l
          for h in pets.leuname.com cachik.leuname.com; do
            curl -s "https://$h/produtos.json" > "$h.json"
            curl -s "https://$h/google-shopping.xml" > "$h-feed.xml"
            echo "$h: $(wc -c < $h.json) bytes"
          done
          git init -q && git checkout -q -b dados-produtos && git config user.name robo && git config user.email robo@users.noreply.github.com
          git add . && git commit -qm produtos && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-produtos
