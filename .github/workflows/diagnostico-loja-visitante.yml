name: Diagnóstico loja como visitante (temporário)

on:
  push:
    paths:
      - '.github/workflows/diagnostico-loja-visitante.yml'

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir a loja de verdade e clicar em Ver todos
        run: |
          npm i playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 980, height: 1700 } });
            p.on('pageerror', e => console.log('PAGEERROR', e.message));
            p.on('response', async r => { if (r.url().includes('/anuncios?')) console.log('API', r.status(), r.url().split('.dev')[1], (await r.text()).slice(0, 120)); });
            await p.goto('https://sucatell.leunamesoftware.com.br/', { waitUntil: 'networkidle' });
            await p.waitForTimeout(4000);
            console.log('INICIO PRODUTOS:', await p.$$eval('#in-resultados .produto-titulo', t => t.map(x => x.textContent)));
            await p.click('#in-ver-todos'); await p.waitForTimeout(4000);
            console.log('VER TODOS CONTAGEM:', await p.textContent('#lp-contagem'));
            console.log('VER TODOS PRODUTOS:', await p.$$eval('#lp-resultados .produto-titulo', t => t.map(x => x.textContent)));
            await p.click('#lp-ordenar button[data-o="recentes"]'); await p.waitForTimeout(3000);
            console.log('RECENTES:', await p.textContent('#lp-contagem'));
            await b.close();
          })();
          JS
          node t.js
