name: Diagnóstico painel Sucatell (temporário)

on:
  push:
    paths:
      - '.github/workflows/diagnostico-painel-sucatell.yml'

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Minha loja e Ver o site no painel de verdade
        run: |
          npm i playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 400, height: 850 } });
            p.on('pageerror', e => console.log('PAGEERROR', e.message));
            p.on('response', r => { if (r.url().includes('workers.dev') && r.status() >= 400) console.log('API', r.status(), r.url()); });
            await p.goto('https://sucatell.leunamesoftware.com.br/admin.html', { waitUntil: 'networkidle' });
            await p.waitForTimeout(3000);
            await p.fill('#lg-email', 'emanuelantunes2021@gmail.com');
            await p.fill('#lg-senha', 'sucatell2582');
            await p.click('#lg-entrar');
            await p.waitForTimeout(5000);
            console.log('PAINEL ABERTO:', await p.isVisible('#app-view'));
            await p.click('#btn-menu'); await p.click('.item-menu[data-view="loja"]');
            await p.waitForTimeout(5000);
            console.log('LOJA VISIVEL:', await p.isVisible('#view-loja'));
            console.log('TIPOS:', await p.$$eval('#nv-tipo option', o => o.length), 'MARCAS:', await p.$$eval('#nv-marca option', o => o.length));
            console.log('BAIRRO:', await p.textContent('#nv-bairro'));
            console.log('LISTA:', (await p.textContent('#loja-lista')).replace(/\s+/g, ' ').slice(0, 300));
            await p.click('#loja-abrir-app');
            await p.waitForTimeout(9000);
            console.log('SITE VISIVEL:', await p.isVisible('#view-site'), 'AVISO:', await p.textContent('#site-aviso'));
            const fr = p.frames().find(f => f.url().includes('painel='));
            if (fr) {
              console.log('LOJA LOGADA:', await fr.isVisible('#tabbar').catch(() => '?'));
              const t = await fr.evaluate(() => document.getElementById('conteudo') ? document.getElementById('conteudo').innerText : document.body.innerText);
              console.log('LOJA TEXTO:', t.replace(/\s+/g, ' ').slice(0, 300));
            } else console.log('SEM FRAME');
            await p.click('#site-modo button[data-modo="visitante"]');
            await p.waitForTimeout(7000);
            const fr2 = p.frames().find(f => f.url().includes('painel='));
            console.log('VISITANTE TEXTO:', fr2 ? (await fr2.evaluate(() => document.body.innerText)).replace(/\s+/g, ' ').slice(0, 200) : 'SEM FRAME');
            console.log('PAINEL AINDA LOGADO:', await p.isVisible('#app-view'));
            await b.close();
          })();
          EOF
          node t.js
