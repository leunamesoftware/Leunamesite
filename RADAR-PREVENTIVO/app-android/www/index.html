<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radar Preventivo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #01050f; color: #e3edf9; font: 400 1.05rem/1.5 system-ui, sans-serif; text-align: center; }
  h1 { color: #fff; font-size: 1.4rem; margin: 0 0 8px; }
  button { margin-top: 18px; padding: 14px 26px; border: 0; border-radius: 999px; background: linear-gradient(180deg, #4cc9ff, #0b7bf2); color: #fff; font: 700 1rem system-ui, sans-serif; }
</style>
</head>
<body>
  <!-- Só aparece se o aparelho estiver sem internet ao abrir o app. -->
  <main>
    <h1>Sem conexão</h1>
    <p>O Radar Preventivo precisa de internet para mostrar seus documentos e prazos.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
