<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020a1c" />
    <meta name="color-scheme" content="dark" />
    <!-- Abertura: igual à do Android (mesmo azul, símbolo de 132px no centro), para as
         telas de abertura parecerem uma só. Some sozinha quando o app termina de carregar. -->
    <style>
      html,body{background:#041640;margin:0}
      .abertura-inicial{position:fixed;inset:0;display:grid;place-items:center;background:#041640}
      .abertura-inicial img{width:132px;height:auto;filter:drop-shadow(0 0 6px rgba(60,170,255,.45))}
    </style>
    <meta name="description" content="Radar Preventivo — Protege seu hoje. Evita problemas amanhã." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Radar Preventivo</title>
  </head>
  <body>
    <div id="raiz"><div class="abertura-inicial"><img src="/simbolo.svg" alt="Radar Preventivo" /></div></div>
    <!-- Vindo da loja LeuApps (?instalar=1): tela de instalação por cima, sem login. -->
    <script src="/instalar.js" data-nome="Radar Preventivo" data-icone="/icone-192.png" data-cor="#1F6FEB"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
